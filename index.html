in(12, S.custom.teams + parseInt(v,10))); render(); }\n  if (a === 'custom-units'){ S.custom.units = Math.max(1, Math.min(12, S.custom.units + parseInt(v,10))); render(); }\n  if (a === 'custom-waves'){ S.custom.waves = Math.max(1, Math.min(8, S.custom.waves + parseInt(v,10))); render(); }\n  if (a === 'guide-open'){ S.guideOpen = true; render(); return; }\n  if (a === 'guide-close'){ S.guideOpen = false; render(); return; }\n  if (a === 'home-overlay'){ S.homeOverlay = v; render(); return; }\n  if (a === 'home-overlay-close'){ S.homeOverlay = null; render(); return; }\n  if (a === 'newseed'){ S.seed = makeSeedCode(); render(); }\n  if (a === 'begin'){\n    var f = document.getElementById('seedin'); if (f) S.seed = f.value;\n    S.seed = (S.seed||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6); if (!S.seed) S.seed = makeSeedCode();\n    var pmMode = (S.practiceMode === 'guided') ? 'medical' : S.mode;\n    var opts = { practiceMode:S.practiceMode, guidedLimit:S.guidedLimit, custom:{ teams:S.custom.teams, units:S.custom.units, waves:S.custom.waves } };\n    S.sim = makeIncident(S.seed, S.scale, pmMode, false, false, opts);\n    S.triageOpen = null; S.speed = 1; S.boardTab = 'cards'; S.gmOpen = true; S.guideOpen = false;\n    go('board'); startTick();\n  }\n  if (a === 'pause'){ if (S.sim.running) stopTick(); else startTick(); render(); }\n  if (a === 'speed'){ S.speed = (S.speed === 1 ? 2 : 1); render(); }\n  if (a === 'end'){ stopTick(); go('register'); }\n  if (a === 'boardtab'){ S.boardTab = v; render(); }\n  if (a === 'about-new-toggle'){ S.aboutNewOpen = !S.aboutNewOpen; render(); }\n  if (a === 'learn-goto'){ S.learnStep = parseInt(v,10); render(); try{window.scrollTo(0,0);}catch(e){} return; }\n  if (a === 'team-edit-start'){ S.creditsMode = 'auth'; S.teamAuthKey = ''; S.teamAuthErr = ''; render(); return; }\n  if (a === 'team-auth'){ var ke = document.getElementById('team-key'); var kv = ke ? ke.value : ''; var fac = facilitatorFor(kv);\n    if (fac){ S.creditsMode = 'edit'; S.teamEditBy = fac; S.teamEdit = cloneTeam(S.team); S.teamAuthErr = ''; }\n    else { S.teamAuthKey = kv; S.teamAuthErr = 'Facilitator key not recognized.'; } render(); return; }\n  if (a === 'team-add-member'){ harvestTeam(); S.teamEdit.push({ name:'', role:'', affiliations:[''] }); render(); return; }\n  if (a === 'team-del-member'){ harvestTeam(); S.teamEdit.splice(parseInt(v,10),1); if (!S.teamEdit.length) S.teamEdit.push({ name:'', role:'', affiliations:[''] }); render(); return; }\n  if (a === 'team-add-aff'){ harvestTeam(); S.teamEdit[parseInt(v,10)].affiliations.push(''); render(); return; }\n  if (a === 'team-del-aff'){ harvestTeam(); var pr = v.split(':'); var arr = S.teamEdit[parseInt(pr[0],10)].affiliations; arr.splice(parseInt(pr[1],10),1); if (!arr.length) arr.push(''); render(); return; }\n  if (a === 'team-save'){ harvestTeam(); var cleaned = cleanTeam(S.teamEdit); if (!cleaned.length){ S.teamAuthErr = ''; return; } S.team = cleaned; saveTeam(cleaned); S.creditsMode = 'view'; S.teamEdit = null; render(); return; }\n  if (a === 'team-cancel'){ S.creditsMode = 'view'; S.teamEdit = null; S.teamAuthErr = ''; render(); return; }\n  if (a === 'team-reset'){ harvestTeam(); S.teamEdit = cloneTeam(DEFAULT_TEAM); render(); return; }\n  if (a === 'fb-rate'){ fbHarvest(); var pr = v.split(':'); S.fb.resp[pr[0]] = parseInt(pr[1],10); render(); return; }\n  if (a === 'fb-sus'){ fbHarvest(); var ps = v.split(':'); S.fb.sus[ps[0]] = parseInt(ps[1],10); render(); return; }\n  if (a === 'fb-prof'){ fbHarvest(); var pf = v.indexOf(':'); var field = v.slice(0,pf), val = v.slice(pf+1); S.fb[field] = (S.fb[field] === val ? '' : val); render(); return; }\n  if (a === 'fb-sus-toggle'){ fbHarvest(); S.fb.showSus = !S.fb.showSus; render(); return; }\n  if (a === 'fbgate-close'){ S.fb.gate = false; render(); return; }\n  if (a === 'fb-submit'){ fbHarvest();\n    if (lsGet('svl_played') !== '1'){ S.fb.gate = true; render(); return; }\n    if (fbAnswered() === 0){ S.fb.status = 'Please answer some statements before submitting.'; render(); return; }\n    var rec = { id:'fb_' + Date.now() + '_' + Math.floor(Math.random()*1e6), ts:new Date().toISOString(),\n      code:(S.fb.code||'').trim(), role:S.fb.role||'', experience:S.fb.experience||'', device:S.fb.device||'', scale:S.fb.scale||'', connectivity:S.fb.connectivity||'',\n      app:'Surge vs. Lifeline Self-Study', version:'1.0', ua:(typeof navigator !== 'undefined' ? navigator.userAgent : ''), status:'pending' };\n    fbAllItemIds().forEach(function(id){ rec[id] = (S.fb.resp||{})[id] || ''; });\n    ['K1','K2','K3','K4','K5','K6','K7','K8','K9','K10'].forEach(function(id){ rec[id] = (S.fb.sus||{})[id] || ''; });\n    rec.susScore = fbSusScore();\n    FB_OPEN.forEach(function(o){ rec[o[0]] = ((S.fb.open||{})[o[0]] || '').trim(); });\n    fbAdd(rec); S.fb = fbDefault(); S.fb.sent = true; fbSync(function(){ render(); }); render(); return; }\n  if (a === 'fb-sync'){ fbHarvest(); fbSync(function(){ render(); }); render(); return; }\n  if (a === 'fb-config'){ S.fb.mode = 'config-auth'; S.fb.authKey = ''; S.fb.authErr = ''; render(); return; }\n  if (a === 'fb-config-auth'){ var fke = document.getElementById('fb-key'); var fkv = fke ? fke.value : '';\n    if (facilitatorFor(fkv)){ S.fb.mode = 'config'; S.fb.authErr = ''; } else { S.fb.authKey = fkv; S.fb.authErr = 'Facilitator key not recognized.'; } render(); return; }\n  if (a === 'fb-config-save'){ var ue = document.getElementById('fb-endpoint'); var url = ue ? ue.value.trim() : ''; lsSet('svl_fb_endpoint', url); S.fb.mode = 'form'; S.fb.status = url ? 'Sync destination saved.' : 'Sync destination cleared.'; render(); return; }\n  if (a === 'fb-config-cancel'){ S.fb.mode = 'form'; S.fb.authErr = ''; render(); return; }\n  if (a === 'radio-report'){ revealReport(S.sim); render(); }\n  if (a === 'radio-dismiss'){ dismissRadio(S.sim); if (!S.sim.running && !S.sim.done) startTick(); render(); }\n  if (a === 'assess'){ actAssess(S.sim, parseInt(v,10)); render(); }\n  if (a === 'vitals-collapse'){ var _vc = parseInt(v,10); S.vitalsCollapsed[_vc] = !S.vitalsCollapsed[_vc]; render(); }\n  if (a === 'victim-view'){ S.viewer3d = parseInt(v,10);\n    var vcz = ((S.sim && S.sim.cas) || []).filter(function(x){ return x.cid === S.viewer3d; })[0];\n    var lyingz = vcz && pose3dFor(vcz) === 'lie';\n    yaw3d = lyingz ? 1.45 : 0.55; pitch3d = lyingz ? 0.62 : 0.06; render(); return; }\n  if (a === 'viewer-close'){ S.viewer3d = null; render(); return; }\n  if (a === 'v3d-rot'){ yaw3d += parseInt(v,10) * 0.5; render(); return; }\n  if (a === 'noop'){ return; }\n  if (a === 'triage-open'){ S.triageOpen = (S.triageOpen === parseInt(v,10) ? null : parseInt(v,10)); render(); }\n  if (a === 'triage'){ var p = v.split(':'); actTriage(S.sim, parseInt(p[0],10), p[1]); S.vitalsCollapsed[parseInt(p[0],10)] = true; S.triageOpen = null; render(); }\n  if (a === 'treat'){ actTreat(S.sim, parseInt(v,10)); render(); }\n  if (a === 'transport'){ actTransport(S.sim, parseInt(v,10)); render(); }\n  if (a === 'discharge'){ actDischarge(S.sim, parseInt(v,10)); render(); }\n  if (a === 'reg-submit'){ S.sim.participant = { name:S.reg.name, role:S.reg.role, org:S.reg.org, team:S.reg.team }; go('report'); }\n  if (a === 'reg-skip'){ S.sim.participant = null; go('report'); }\n  if (a === 'restart'){ S.sim = null; S.seed = ''; go('setup'); }\n  if (a === 'exporttxt'){ exportReport(); }\n  if (a === 'exportpdf'){ exportPdf(); }\n}\n\nfunction shell(title, sub, body){\n  return '<main class=\"wrap\">' + (title ? '<h1 class=\"h1\">' + esc(title) + '<\u002Fh1>' : '') +\n    (sub ? '<p class=\"lede\">' + sub + '<\u002Fp>' : '') + body + '<\u002Fmain>';\n}\n\n/* ---------------- Tutorial, START and JumpSTART ---------------- */\nvar LESSONS = [\n  { t:'Triage in one minute', h:\n    '<p>In an everyday emergency, one patient gets the full attention of the whole team. A mass casualty incident flips that. There are more injured people than there are hands, and the sickest are slipping away while you work. Triage is how you make that manageable. You sort people quickly into a few priority groups so the limited help goes where it saves the most lives.<\u002Fp>' +\n    '<p>Two ideas run through every triage system. First, do the greatest good for the greatest number, which sometimes means passing someone who cannot be saved so that others who can be are not lost. Second, a triage tag is not permanent. People get better or worse, so you re-check them whenever you can.<\u002Fp>' +\n    '<p>This game uses the two systems most widely taught, START for adults and JumpSTART for children. Work through these short lessons, then use them under pressure in the practice game.<\u002Fp>' },\n  { t:'The four colors', h:\n    '<p>Almost every field triage system sorts people into the same four groups, shown as colors.<\u002Fp>' +\n    '<div class=\"tag-legend\">' +\n      '<div class=\"tl-row\"><span class=\"tag2 t-red\">RED<\u002Fspan><span>Immediate. Life-threatening but savable with prompt care. Treat and move these first.<\u002Fspan><\u002Fdiv>' +\n      '<div class=\"tl-row\"><span class=\"tag2 t-yellow\">YELLOW<\u002Fspan><span>Delayed. Serious injuries, but they can wait a while without dying.<\u002Fspan><\u002Fdiv>' +\n      '<div class=\"tl-row\"><span class=\"tag2 t-green\">GREEN<\u002Fspan><span>Minor. The walking wounded, who can wait and often help themselves.<\u002Fspan><\u002Fdiv>' +\n      '<div class=\"tl-row\"><span class=\"tag2 t-black\">BLACK<\u002Fspan><span>Deceased, or beyond saving with the resources at hand.<\u002Fspan><\u002Fdiv>' +\n    '<\u002Fdiv>' +\n    '<p>The whole skill of triage is deciding, quickly and correctly, which color each person is. START and JumpSTART give you a reliable way to do exactly that.<\u002Fp>' },\n  { t:'START, the adult sort', h:\n    '<p>START, Simple Triage and Rapid Treatment (Super, 1984; Benson et al., 1996), sorts an adult in under a minute using things you can check fast: whether they walk, their breathing, their perfusion, and their mental status. Work the steps in order and stop at the first one that gives a color.<\u002Fp>' +\n    '<div class=\"flow-step\"><div class=\"flow-q\">1. Can they get up and walk?<\u002Fdiv><div class=\"flow-a\"><span class=\"tag2 t-green\">GREEN<\u002Fspan> if yes. Direct them to the walking wounded area. If no, go on.<\u002Fdiv><\u002Fdiv>' +\n    '<div class=\"flow-step\"><div class=\"flow-q\">2. Are they breathing?<\u002Fdiv><div class=\"flow-a\">If not, open the airway. Breathing returns, <span class=\"tag2 t-red\">RED<\u002Fspan>. Still no breathing, <span class=\"tag2 t-black\">BLACK<\u002Fspan>. If breathing, go on.<\u002Fdiv><\u002Fdiv>' +\n    '<div class=\"flow-step\"><div class=\"flow-q\">3. Is the breathing rate over 30 a minute?<\u002Fdiv><div class=\"flow-a\"><span class=\"tag2 t-red\">RED<\u002Fspan> if yes. If no, go on.<\u002Fdiv><\u002Fdiv>' +\n    '<div class=\"flow-step\"><div class=\"flow-q\">4. Is perfusion failing, a radial pulse you cannot feel or capillary refill slower than 2 seconds?<\u002Fdiv><div class=\"flow-a\"><span class=\"tag2 t-red\">RED<\u002Fspan> if yes. If no, go on.<\u002Fdiv><\u002Fdiv>' +\n    '<div class=\"flow-step\"><div class=\"flow-q\">5. Can they follow a simple command, such as squeeze my hand?<\u002Fdiv><div class=\"flow-a\"><span class=\"tag2 t-red\">RED<\u002Fspan> if they cannot. <span class=\"tag2 t-yellow\">YELLOW<\u002Fspan> if they can.<\u002Fdiv><\u002Fdiv>' +\n    '<p class=\"muted small\">A quick way to hold it: walk, breathing, rate, perfusion, mental status. The first step that fits decides the tag.<\u002Fp>' +\n    '<details class=\"qcheck\"><summary>Quick check: a man is breathing 36 times a minute, has a strong radial pulse, and follows commands. What tag?<\u002Fsummary><p><span class=\"tag2 t-red\">RED<\u002Fspan>. The breathing rate over 30 makes him immediate, even though his pulse and mental status are fine. The first failing step decides it.<\u002Fp><\u002Fdetails>' },\n  { t:'JumpSTART, the children\\u2019s sort', h:\n    '<p>Children are not small adults. Their normal breathing is faster, and a child whose breathing stops often still has a beating heart, so a few rescue breaths can bring them back. JumpSTART adapts START for this (Romig, 2002). Use it for children who look to be roughly one to eight years old.<\u002Fp>' +\n    '<div class=\"flow-step\"><div class=\"flow-q\">1. Can they walk?<\u002Fdiv><div class=\"flow-a\"><span class=\"tag2 t-green\">GREEN<\u002Fspan> if yes. A child too young to walk is assessed where they lie.<\u002Fdiv><\u002Fdiv>' +\n    '<div class=\"flow-step\"><div class=\"flow-q\">2. Are they breathing?<\u002Fdiv><div class=\"flow-a\">If not, open the airway. Breathing returns, <span class=\"tag2 t-red\">RED<\u002Fspan>. If still not, check for a pulse. No pulse, <span class=\"tag2 t-black\">BLACK<\u002Fspan>. If there is a pulse, give five rescue breaths. Breathing starts, <span class=\"tag2 t-red\">RED<\u002Fspan>. Still nothing, <span class=\"tag2 t-black\">BLACK<\u002Fspan>.<\u002Fdiv><\u002Fdiv>' +\n    '<div class=\"flow-step\"><div class=\"flow-q\">3. Is the breathing rate under 15 or over 45 a minute?<\u002Fdiv><div class=\"flow-a\"><span class=\"tag2 t-red\">RED<\u002Fspan> if yes. A child\\u2019s normal range is wider than an adult\\u2019s.<\u002Fdiv><\u002Fdiv>' +\n    '<div class=\"flow-step\"><div class=\"flow-q\">4. Can you feel a pulse?<\u002Fdiv><div class=\"flow-a\">No pulse, <span class=\"tag2 t-red\">RED<\u002Fspan>. If there is one, go on.<\u002Fdiv><\u002Fdiv>' +\n    '<div class=\"flow-step\"><div class=\"flow-q\">5. How do they respond? Use AVPU: Alert, responds to Voice, responds to Pain, Unresponsive.<\u002Fdiv><div class=\"flow-a\">If they respond to pain abnormally or not at all, <span class=\"tag2 t-red\">RED<\u002Fspan>. If alert or responding normally, <span class=\"tag2 t-yellow\">YELLOW<\u002Fspan>.<\u002Fdiv><\u002Fdiv>' +\n    '<details class=\"qcheck\"><summary>Quick check: a small child is not breathing, then starts again the moment you open the airway. What tag?<\u002Fsummary><p><span class=\"tag2 t-red\">RED<\u002Fspan>. In JumpSTART, breathing that returns with a simple airway maneuver is immediate.<\u002Fp><\u002Fdetails>' },\n  { t:'The one error that kills', h:\n    '<p>Two kinds of mistake matter, and they are not equal.<\u002Fp>' +\n    '<p><strong>Under-triage<\u002Fstrong> is calling someone less urgent than they really are, for example tagging a red patient as green. This is the dangerous one. That person waits, gets worse, and can die of an injury that was survivable. In the practice game, this is what the report flags in red.<\u002Fp>' +\n    '<p><strong>Over-triage<\u002Fstrong> is the opposite, calling someone more urgent than they are. It is safer for that person, but it spends scarce teams and transport on people who did not need them, which slows care for those who do.<\u002Fp>' +\n    '<p>Good triage keeps under-triage very low while accepting a little over-triage. When you are unsure, err upward, and better still, measure the vital signs and decide on the evidence. And because people change, re-check anyone whose condition might be moving.<\u002Fp>' }\n];\nfunction learnIcon(i){\n  var ic=[\n    '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/><\u002Fsvg>',\n    '<svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"3\" width=\"8\" height=\"8\" rx=\"2\" fill=\"#F24A4F\"/><rect x=\"13\" y=\"3\" width=\"8\" height=\"8\" rx=\"2\" fill=\"#F5C531\"/><rect x=\"3\" y=\"13\" width=\"8\" height=\"8\" rx=\"2\" fill=\"#37D07E\"/><rect x=\"13\" y=\"13\" width=\"8\" height=\"8\" rx=\"2\" fill=\"#5A6472\"/><\u002Fsvg>',\n    '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"13.5\" cy=\"4.5\" r=\"2\"/><path d=\"M10.5 21l2-5.5-3-2.5 1.5-5 4 2.5 2.5 3\"/><path d=\"M8 9.5l3-2\"/><\u002Fsvg>',\n    '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"5\" r=\"2.3\"/><path d=\"M12 8v6.5M8.5 11h7M9.8 21l2.2-6.5 2.2 6.5\"/><\u002Fsvg>',\n    '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3.5l9 16H3l9-16z\"/><path d=\"M12 10v4.5M12 17.6v.2\"/><\u002Fsvg>'\n  ];\n  return ic[i]||ic[0];\n}\nfunction viewLearn(){\n  var n=LESSONS.length, step=Math.max(0,Math.min(n-1,S.learnStep|0)), l=LESSONS[step];\n  var accents=['#2EC6D8','#9B8CFF','#37D07E','#F5A524','#F24A4F'], ac=accents[step]||'#2EC6D8';\n  var dots=LESSONS.map(function(ls,i){\n    return '<button class=\"lp-dot' + (i===step?' on':(i<step?' done':'')) + '\" data-act=\"learn-goto\" data-val=\"' + i + '\" aria-label=\"Chapter ' + (i+1) + '\"><span>' + (i+1) + '<\u002Fspan><\u002Fbutton>';\n  }).join('<span class=\"lp-line\"><\u002Fspan>');\n  var chead='<div class=\"lchap\"><div class=\"lchap-ic\">' + learnIcon(step) + '<\u002Fdiv><div class=\"lchap-tx\"><span class=\"lchap-n\">Chapter ' + (step+1) + ' of ' + n + '<\u002Fspan><span class=\"lchap-t\">' + esc(l.t) + '<\u002Fspan><\u002Fdiv><\u002Fdiv>';\n  var html=l.h.replace(/(<div class=\"flow-q\">)\\d+\\.\\s*/g,'$1');\n  var bodyHtml='<div class=\"lesson-body lb-rich\">' + html + '<\u002Fdiv>';\n  var sources = step===n-1 ? ('<section class=\"card sources\"><p class=\"eyebrow\">Sources<\u002Fp>' +\n      '<p class=\"muted small\">START was developed in 1983 by Hoag Hospital and the Newport Beach Fire Department in California (Super, 1984), and refined by Benson, Koenig, and Schultz (1996), whose version introduced the radial pulse check used here. JumpSTART, the pediatric adaptation, was develop \" data-go=\"setup\" title=\"Practice options\" aria-label=\"Practice options\">' + gear + '<\u002Fbutton>' +\n        '<button class=\"ts-hicon\" data-act=\"home-overlay\" data-val=\"about\" title=\"About\" aria-label=\"About\">' + quest + '<\u002Fbutton>' +\n      '<\u002Fdiv>' +\n    '<\u002Fdiv>' +\n    '<div class=\"ts-main\">' +\n      '<img class=\"ts-logo\" src=\"' + LOGO_SRC + '\" alt=\"Surge vs. Lifeline, mass casualty triage training game\">' +\n      '<div class=\"ts-menu\">' +\n        '<button class=\"ts-btn ts-primary\" data-go=\"learn\">Learn Triage<\u002Fbutton>' +\n        '<button class=\"ts-btn\" data-go=\"setup\">Start Practice<\u002Fbutton>' +\n        '<button class=\"ts-btn\" data-go=\"credits\">Credits<\u002Fbutton>' +\n        '<button class=\"ts-btn\" data-act=\"home-overlay\" data-val=\"about\">About<\u002Fbutton>' +\n      '<\u002Fdiv>' +\n    '<\u002Fdiv>' +\n    '<div class=\"ts-bottom\">' +\n      '<button class=\"ts-corner\" data-act=\"home-overlay\" data-val=\"whatsnew\">What is New<\u002Fbutton>' +\n      '<button class=\"ts-corner\" data-go=\"feedback\">Feedback<\u002Fbutton>' +\n    '<\u002Fdiv>' +\n    '<div class=\"ts-foot\">Mass Casualty Triage Training Game<\u002Fdiv>' +\n  '<\u002Fdiv>' +\n  (S.homeOverlay === 'about' ? aboutOverlay() : '') +\n  (S.homeOverlay === 'whatsnew' ? whatsnewOverlay() : '');\n}\nfunction aboutOverlay(){\n  return '<div class=\"ts-overlay\" data-act=\"home-overlay-close\"><div class=\"ts-modal\" data-act=\"noop\">' +\n    '<div class=\"ts-modal-h\"><span class=\"ts-modal-t\">About<\u002Fspan><button class=\"ts-modal-x\" data-act=\"home-overlay-close\">Close<\u002Fbutton><\u002Fdiv>' +\n    '<div class=\"ts-modal-b\">' +\n      '<p class=\"ts-lead\">A disaster triage decision simulation<\u002Fp>' +\n      '<p>You are the medical commander at a major incident. Casualties come in more than one wave, you never have enough hands or transport, and the clock does not wait. Your job is to run the scene: sort people fast, measure the ones you are unsure about, hold the right patients to buy time, and move the dying ones first.<\u002Fp>' +\n      '<p>The difference in this version is the vital signs. Real triage is not done by eye. You take a set of vitals, respiratory rate, perfusion, mental status, and the color follows from what you measure. Measuring costs seconds, and seconds are exactly what your reds do not have, so knowing when to look and when to move on is the whole skill.<\u002Fp>' +\n      '<p class=\"ts-credit\">Developed by the University of the Philippines Resilience Institute, in collaboration with UP Manila Disaster Risk Reduction and Management in Health.<\u002Fp>' +\n      '<p class=\"ts-disc\">Training simulation only. Invented casualties and generated timings. Never a clinical or command decision aid for a real incident.<\u002Fp>' +\n    '<\u002Fdiv><\u002Fdiv><\u002Fdiv>';\n}\nfunction whatsnewOverlay(){\n  return '<div class=\"ts-overlay\" data-act=\"home-overlay-close\"><div class=\"ts-modal\" data-act=\"noop\">' +\n    '<div class=\"ts-modal-h\"><span class=\"ts-modal-t\">What is new here<\u002Fspan><button class=\"ts-modal-x\" data-act=\"home-overlay-close\">Close<\u002Fbutton><\u002Fdiv>' +\n    '<div class=\"ts-modal-b\"><ul class=\"ts-feat\">' +\n      '<li><strong>Vital signs on request.<\u002Fstrong> Each casualty has a Take vital signs button that reveals real numbers, so you can tag by START and JumpSTART the way they are meant to be applied.<\u002Fli>' +\n      '<li><strong>Casualties arrive in waves.<\u002Fstrong> Search and rescue radio you when a batch is inbound. You can ask for their initial injury report, then watch them come in on a transit bar before they land.<\u002Fli>' +\n      '<li><strong>Two places to stand.<\u002Fstrong> Work forward with the rescuers, where you sort and evacuate fast, or run the medical area, where you assess, treat, and send to hospital.<\u002Fli>' +\n      '<li><strong>A live accountability board.<\u002Fstrong> Every casualty carries a coded callsign, and the dashboard tracks who is tagged what and who has been moved out.<\u002Fli>' +\n      '<li><strong>Learn then practice.<\u002Fstrong> A built-in lecture teaches the START and JumpSTART triage systems first, so you can study the method and then apply it in the game.<\u002Fli>' +\n    '<\u002Ful><\u002Fdiv><\u002Fdiv><\u002Fdiv>';\n}\n\n/* ---------------- Setup ---------------- */\nfunction stepper(act, val, min, max, unit){\n  var d0 = val <= min ? ' disabled' : '', d1 = val >= max ? ' disabled' : '';\n  return '<div class=\"stepper\"><button class=\"step-b\" data-act=\"' + act + '\" data-val=\"-1\"' + d0 + '>-<\u002Fbutton>' +\n    '<span class=\"step-v mono\">' + val + (unit ? ' ' + unit : '') + '<\u002Fspan>' +\n    '<button class=\"step-b\" data-act=\"' + act + '\" data-val=\"1\"' + d1 + '>+<\u002Fbutton><\u002Fdiv>';\n}\nfunction viewSetup(){\n  var pm = S.practiceMode;\n  var scCount = (SCALES[S.scale] || SCALES.standard).count;\n  var modes = [\n    ['guided','Guided practice','New to triage. A few at a time, deterioration warnings, and the triage guide on hand.'],\n    ['expert','Expert','The full incident as preset, with waves and pressure. No hints.'],\n    ['custom','Custom','Set your own teams, transport, and number of waves. Casualties stay randomized.']\n  ];\n  var pmHtml = modes.map(function(m){\n    return '<button class=\"opt' + (pm===m[0]?' on':'') + '\" data-act=\"pmode\" data-val=\"' + m[0] + '\">' +\n      '<span class=\"opt-n\">' + m[1] + '<\u002Fspan><span class=\"opt-d\">' + m[2] + '<\u002Fspan><\u002Fbutton>';\n  }).join('');\n  var blocks = '<section class=\"block\"><p class=\"eyebrow\">Practice mode<\u002Fp><div class=\"opts\">' + pmHtml + '<\u002Fdiv><\u002Fsection>';\n\n  if (pm !== 'guided'){\n    var modeHtml = ['medical','sar'].map(function(k){ var md = MODES[k];\n      return '<button class=\"opt' + (S.mode===k?' on':'') + '\" data-act=\"mode\" data-val=\"' + k + '\">' +\n        '<span class=\"opt-n\">' + esc(md.name) + '<\u002Fspan><span class=\"opt-d\">' + esc(md.blurb) + '<\u002Fspan><\u002Fbutton>'; }).join('');\n    blocks += '<section class=\"block\"><p class=\"eyebrow\">Where are you standing<\u002Fp><div class=\"opts\">' + modeHtml + '<\u002Fdiv><\u002Fsection>';\n  }\n\n  var scaleHtml = SCALE_ORDER.map(function(k){ var sc = SCALES[k];\n    return '<button class=\"opt' + (S.scale===k?' on':'') + '\" data-act=\"scale\" data-val=\"' + k + '\">' +\n      '<span class=\"opt-n\">' + esc(sc.name) + '<\u002Fspan>' +\n      '<span class=\"opt-meta\">' + sc.count + ' casualties<\u002Fspan><\u002Fbutton>'; }).join('');\n  blocks += '<section class=\"block\"><p class=\"eyebrow\">Choose the incident<\u002Fp><div class=\"opts\">' + scaleHtml + '<\u002Fdiv><\u002Fsection>';\n\n  if (pm === 'guided'){\n    blocks += '<section class=\"block\"><p class=\"eyebrow\">Focus<\u002Fp>' +\n      '<div class=\"setrow\"><span class=\"set-l\">How many casualties at once<\u002Fspan>' + stepper('guided-limit', S.guidedLimit, 1, scCount) + '<\u002Fdiv>' +\n      '<p class=\"hint\">A new casualty is brought in as soon as you treat, move, or clear the one in front of you, up to this many at a time. Set it to 1 to take them strictly one by one.<\u002Fp><\u002Fsection>';\n  } else if (pm === 'custom'){\n    var allowTreat = MODES[S.mode].allowTreat;\n    blocks += '<section class=\"block\"><p class=\"eyebrow\">Resources and waves<\u002Fp>' +\n      (allowTreat ? '<div class=\"setrow\"><span class=\"set-l\">Treatment teams<\u002Fspan>' + stepper('custom-teams', S.custom.teams, 0, 12) + '<\u002Fdiv>' : '') +\n      '<div class=\"setrow\"><span class=\"set-l\">' + (S.mode==='sar'?'Stretcher teams':'Ambulances') + '<\u002Fspan>' + stepper('custom-units', S.custom.units, 1, 12) + '<\u002Fdiv>' +\n      '<div class=\"setrow\"><span class=\"set-l\">Number of waves<\u002Fspan>' + stepper('custom-waves', S.custom.waves, 1, 8) + '<\u002Fdiv>' +\n      '<p class=\"hint\">The casualties themselves stay randomized from the session code. You are changing how much help you have and how the arrivals are spread out.<\u002Fp><\u002Fsection>';\n  }\n\n  var seed = S.seed || '';\n  blocks += '<section class=\"block\"><p class=\"eyebrow\">Session code<\u002Fp>' +\n      '<div class=\"seedrow\"><input id=\"seedin\" class=\"seedin\" maxlength=\"6\" placeholder=\"Blank for a new incident\" value=\"' + esc(seed) + '\">' +\n      '<button class=\"btn btn-ghost\" data-act=\"newseed\">Generate<\u002Fbutton><\u002Fdiv>' +\n      '<p class=\"hint\">The same code always produces the same casualties, injuries, and clocks, so you can replay a scenario or compare two attempts on one fair set of patients.<\u002Fp><\u002Fsection>';\n\n  blocks += '<div class=\"cta-row\"><button class=\"btn btn-primary btn-lg\" data-act=\"begin\">Begin<\u002Fbutton>' +\n    '<button class=\"btn btn-ghost\" data-go=\"about\">Back<\u002Fbutton><\u002Fdiv>';\n  return shell('Set up the incident', '', blocks);\n}\nfunction guideOverlay(){\n  var b =\n    '<div class=\"guide-h\"><span class=\"guide-t\">Triage guide<\u002Fspan><button class=\"v3d-x\" data-act=\"guide-close\">Close<\u002Fbutton><\u002Fdiv>' +\n    '<div class=\"guide-body\">' +\n      '<p class=\"guide-lead\">The clock is paused while this is open. Read, then close to carry on.<\u002Fp>' +\n      '<h4 class=\"guide-hd\">The four colors<\u002Fh4>' +\n      '<div class=\"gtags\">' +\n        '<div class=\"gtag gt-r\"><b>Red<\u002Fb> Immediate. A life threat you can fix. Move first.<\u002Fdiv>' +\n        '<div class=\"gtag gt-y\"><b>Yellow<\u002Fb> Delayed. Serious, but can wait a while.<\u002Fdiv>' +\n        '<div class=\"gtag gt-g\"><b>Green<\u002Fb> Minor. Walking wounded.<\u002Fdiv>' +\n        '<div class=\"gtag gt-b\"><b>Black<\u002Fb> Deceased, or beyond saving with what you have.<\u002Fdiv>' +\n      '<\u002Fdiv>' +\n      '<h4 class=\"guide-hd\">START, in order<\u002Fh4>' +\n      '<ol class=\"guide-steps\">' +\n        '<li>Can they walk? Yes, then Green.<\u002Fli>' +\n        '<li>Breathing? Not at all, open the airway. Still nothing, then Black. Breathing returns, then Red.<\u002Fli>' +\n        '<li>Breathing faster than 30 a minute? Red.<\u002Fli>' +\n        '<li>No radial pulse, or capillary refill over 2 seconds? Red.<\u002Fli>' +\n        '<li>Cannot follow a simple command? Red. Otherwise Yellow.<\u002Fli>' +\n      '<\u002Fol>' +\n      '<p class=\"guide-note\">For children, use JumpSTART. A child who is not breathing but has a pulse gets five rescue breaths before you decide.<\u002Fp>' +\n      '<h4 class=\"guide-hd\">Why the tools matter<\u002Fh4>' +\n      '<p class=\"guide-why\"><b>Taking vital signs<\u002Fb> is what makes triage accurate, the color follows the numbers, not a guess. On the monitor, the breathing rate and the perfusion set the color, together with the field checks under them. Heart rate, oxygen, and blood pressure are clinical context, not part of the START sort, so do not wait on them.<\u002Fp>' +\n      '<p class=\"guide-why\"><b>Asking for updates on the radio<\u002Fb> tells you what is coming before it lands. Pull the report on an inbound wave and you can plan who to hold and who to move, instead of being surprised.<\u002Fp>' +\n      '<p class=\"guide-why\"><b>The deterioration warning<\u002Fb> flags a red or yellow whose time is running short. When a card turns red at the top, that patient is getting worse, so treat or move them now.<\u002Fp>' +\n    '<\u002Fdiv>';\n  return '<div class=\"v3d-overlay guide-overlay\" data-act=\"guide-close\"><div class=\"v3d-card guide-card\" data-act=\"noop\">' + b + '<\u002Fdiv><\u002Fdiv>';\n}\n\n/* ---------------- Board ---------------- */\nfunction tally(){\n  var sim = S.sim, alive=0, died=0;\n  sim.cas.forEach(function(c){\n    if (c.status==='delivered'||c.status==='discharged'||c.status==='stable') alive++;\n    else if (c.status==='deceased' && c.outcome==='died') died++;\n  });\n  return { alive:alive, died:died };\n}\nfunction boardHeader(){\n  var sim = S.sim, t = tally();\n  var teamCell = sim.allowTreat\n    ? '<div class=\"res-i\"><span class=\"res-v mono\">' + sim.teamsFree + '/' + sim.teamsTotal + '<\u002Fspan><span class=\"res-k\">Teams<\u002Fspan><\u002Fdiv>' : '';\n  var unitK = sim.mode==='sar' ? 'Stretchers' : 'Ambulances';\n  return '<header class=\"bhd\">' +\n    '<div class=\"bhd-top\"><div class=\"clock2\">' + fmtClock(sim.t) + '<\u002Fdiv>' +\n      '<div class=\"bhd-ctrl\">' +\n        '<button class=\"ic-btn\" data-act=\"pause\">' + (sim.running ? 'Pause' : 'Resume') + '<\u002Fbutton>' +\n        '<button class=\"ic-btn\" data-act=\"speed\">' + (S.speed===2?'2x':'1x') + '<\u002Fbutton>' +\n        '<button class=\"ic-btn danger\" data-act=\"end\">End<\u002Fbutton><\u002Fdiv><\u002Fdiv>' +\n    '<div class=\"res\">' + teamCell +\n      '<div class=\"res-i\"><span class=\"res-v mono\">' + sim.unitsFree + '/' + sim.unitsTotal + '<\u002Fspan><span class=\"res-k\">' + unitK + '<\u002Fspan><\u002Fdiv>' +\n      '<div class=\"res-i\"><span class=\"res-v mono ok\">' + t.alive + '<\u002Fspan><span class=\"res-k\">Alive<\u002Fspan><\u002Fdiv>' +\n      '<div class=\"res-i\"><span class=\"res-v mono ' + (t.died?'bad':'') + '\">' + t.died + '<\u002Fspan><span class=\"res-k\">Lost<\u002Fspan><\u002Fdiv>' +\n    '<\u002Fdiv>' +\n    '<div class=\"tabs\"><button class=\"tab' + (S.boardTab==='cards'?' on':'') + '\" data-act=\"boardtab\" data-val=\"cards\">Casualties<\u002Fbutton>' +\n      '<button class=\"tab' + (S.boardTab==='dashboard'?' on':'') + '\" data-act=\"boardtab\" data-val=\"dashboard\">Dashboard<\u002Fbutton><\u002Fdiv>' +\n    '<\u002Fheader>';\n}\nfunction radioModal(){\n  var r = S.sim.radio; if (!r) return '';\n  var kindLabel = r.kind==='initial' ? 'Incident brief' : (r.kind==='incoming' ? 'Radio, casualties inbound' : (r.kind==='arrived' ? 'Search and rescue arrived' : (r.kind==='inject' ? 'Radio, command update' : 'Radio, sector cleared')));\n  var reportBlock = !r.report ? '' : (r.reportShown\n    ? '<div class=\"radio-report\"><span class=\"rr-h\">Initial injury report<\u002Fspan><p>' + esc(r.report) + '<\u002Fp><\u002Fdiv>'\n    : '<button class=\"btn btn-ghost radio-ask\" data-act=\"radio-report\">Ask for the initial injury report<\u002Fbutton>');\n  return '<div class=\"radio-wrap\"><div class=\"radio-card\">' +\n    '<div class=\"radio-h\"><span class=\"radio-dot\"><\u002Fspan>' + esc(kindLabel) + '<\u002Fdiv>' +\n    '<p class=\"radio-text\">' + esc(r.text) + '<\u002Fp>' +\n    (r.eta ? '<p class=\"radio-eta mono\">Time out about ' + r.eta + ' seconds<\u002Fp>' : '') +\n    reportBlock +\n    '<button class=\"btn btn-primary radio-go\" data-act=\"radio-dismiss\">Received, continue<\u002Fbutton>' +\n    '<\u002Fdiv><\u002Fdiv>';\n}\nfunction avpuText(v){\n  var map = { A:'Alert', V:'To voice', P:'To pain', U:'Unresponsive' };\n  var base = map[v.avpu] || v.avpu;\n  if (v.ambulatory || v.avpu==='A') return base + ', follows commands';\n  return base + (v.obeys ? ', follows commands' : ', cannot follow commands');\n}\nfunction ecgSvg(hr){\n  var W = 300, H = 56, mid = H/2;\n  if (!hr || hr <= 0){\n    var fl = 'M0 ' + mid + ' L' + W + ' ' + mid;\n    return '<div class=\"ecg\"><span class=\"lead\">Lead II<\u002Fspan><div class=\"ecgTrack flat\">' +\n      '<svg viewBox=\"0 0 ' + W + ' ' + H + '\" preserveAspectRatio=\"none\"><path d=\"' + fl + '\"/><\u002Fsvg>' +\n      '<svg viewBox=\"0 0 ' + W + ' ' + H + '\" preserveAspectRatio=\"none\"><path d=\"' + fl + '\"/><\u002Fsvg><\u002Fdiv><\u002Fdiv>';\n  }\n  var K = Math.max(2, Math.min(9, Math.round(hr / 18))), seg = W / K, d = 'M0 ' + mid;\n  for (var i = 0; i < K; i++){\n    var x = i * seg;\n    d += ' L' + (x + seg*0.06).toFixed(1) + ' ' + mid;\n    d += ' Q' + (x + seg*0.15).toFixed(1) + ' ' + (mid-6) + ' ' + (x + seg*0.24).toFixed(1) + ' ' + mid;\n    d += ' L' + (x + seg*0.34).toFixed(1) + ' ' + (mid+4);\n    d += ' L' + (x + seg*0.40).toFixed(1) + ' ' + (mid-20);\n    d += ' L' + (x + seg*0.46).toFixed(1) + ' ' + (mid+8);\n    d += ' L' + (x + seg*0.54).toFixed(1) + ' ' + mid;\n    d += ' Q' + (x + seg*0.72).toFixed(1) + ' ' + (mid-9) + ' ' + (x + seg*0.88).toFixed(1) + ' ' + mid;\n    d += ' L' + (x + seg).toFixed(1) + ' ' + mid;\n  }\n  var Dur = (60 * K / hr), delay = -((Date.now()/1000) % Dur);\n  var st = 'animation-duration:' + Dur.toFixed(2) + 's;animation-delay:' + delay.toFixed(2) + 's';\n  return '<div class=\"ecg\"><span class=\"lead\">Lead II<\u002Fspan><div class=\"ecgTrack\" style=\"' + st + '\">' +\n    '<svg viewBox=\"0 0 ' + W + ' ' + H + '\" preserveAspectRatio=\"none\"><path d=\"' + d + '\"/><\u002Fsvg>' +\n    '<svg viewBox=\"0 0 ' + W + ' ' + H + '\" preserveAspectRatio=\"none\"><path d=\"' + d + '\"/><\u002Fsvg><\u002Fdiv><\u002Fdiv>';\n}\nfunction mTile(name, unit, value, color, alarm, role){\n  var rc = role === 'start' ? ' mt-start' : (role === 'ctx' ? ' mt-ctx' : '');\n  var tag = role === 'ctx' ? '<span class=\"mt-tag\">context<\u002Fspan>' : '';\n  return '<div class=\"mtile' + (alarm ? ' alarm' : '') + rc + '\" style=\"--vc:' + color + '\">' +\n    '<div class=\"mlab\"><span class=\"mname\">' + name + tag + '<\u002Fspan><span class=\"munit\">' + unit + '<\u002Fspan><\u002Fdiv>' +\n    '<div class=\"mval\">' + value + '<\u002Fdiv><\u002Fdiv>';\n}\nfunction mChip(k, val, bad){\n  return '<span class=\"mchip' + (bad ? ' bad' : '') + '\"><span class=\"ck\">' + k + '<\u002Fspan><span class=\"cv\">' + esc(val) + '<\u002Fspan><\u002Fspan>';\n}\nfunction vitalsPanel(c){\n  if (!c.assessed) return '';\n  var v = c.vitals;\n  var rrFlag = (v.breathing && v.rr>30) || (v.child && v.breathing && (v.rr<15||v.rr>45));\n  if (S.vitalsCollapsed[c.cid]){\n    var sum = 'RR ' + (v.breathing ? v.rr : 0) + ' \\u00B7 cap ' + v.crt + 's \\u00B7 ' +\n      (v.radialPulse ? 'radial ok' : 'no radial') + ' \\u00B7 ' + v.avpu;\n    return '<div class=\"monitor collapsed\"><div class=\"mon-h\" data-act=\"vitals-collapse\" data-val=\"' + c.cid + '\">' +\n      '<span class=\"mon-t\">Vitals<\u002Fspan><span class=\"mon-sum mono\">' + esc(sum) + '<\u002Fspan><span class=\"mon-x\">Show<\u002Fspan><\u002Fdiv><\u002Fdiv>';\n  }\n  var tiles =\n    mTile('Heart rate', 'bpm', (v.hr ? v.hr : '--'), '#4ADE80', false, 'ctx') +\n    mTile('SpO2', '%', (v.spo2 ? v.spo2 : '--'), '#22D3EE', false, 'ctx') +\n    mTile('Resp rate', '/min', (v.breathing ? v.rr : 0), '#EAF1FA', rrFlag || !v.breathing, 'start') +\n    mTile('NIBP sys', 'mmHg', (v.sbp ? v.sbp : '--'), '#F6A833', false, 'ctx') +\n    mTile('Perfusion', 'cap refill', (v.crt + 's'), '#22D3EE', v.crt > 2, 'start');\n  var chips =\n    mChip('Ambulatory', v.ambulatory ? 'Yes' : 'No', false) +\n    mChip('Breathing', v.breathing ? 'Yes' : (v.breathesAfterAirway ? 'After airway' : 'None'), !v.breathing) +\n    mChip('Radial pulse', v.radialPulse ? 'Present' : 'Absent', !v.radialPulse) +\n    mChip('Mental', avpuText(v), (!v.obeys && !v.ambulatory));\n  return '<div class=\"monitor\"><div class=\"mon-h\" data-act=\"vitals-collapse\" data-val=\"' + c.cid + '\">' +\n    '<span class=\"mon-t\">Vital signs monitor<\u002Fspan><span class=\"mon-live\"><span class=\"mon-dot\"><\u002Fspan>Monitoring<\u002Fspan>' +\n    '<span class=\"mon-x\">Hide<\u002Fspan><\u002Fdiv>' +\n    ecgSvg(v.hr) +\n    '<div class=\"mtiles\">' + tiles + '<\u002Fdiv>' +\n    '<div class=\"mon-fld\">Field findings, all part of the START sort<\u002Fdiv>' +\n    '<div class=\"mchips\">' + chips + '<\u002Fdiv>' +\n    '<div class=\"mon-legend\"><span class=\"mlg\"><span class=\"mlg-sw start\"><\u002Fspan>Decides the START color<\u002Fspan>' +\n    '<span class=\"mlg\"><span class=\"mlg-sw ctx\"><\u002Fspan>Clinical context, not used for the sort<\u002Fspan><\u002Fdiv>' +\n    '<\u002Fdiv>';\n}\nfunction bar(c){\n  if (c.clock == null) return '';\n  var pctv = Math.max(0, Math.min(100, Math.round((c.clock / c.clock0) * 100)));\n  var held = (c.status==='treating' || c.status==='stable' || c.status==='enroute');\n  var cls = held ? 'held' : (c.trueTag==='RED' ? 'red' : 'amber');\n  var label = held ? 'clock held' : fmtClock(c.clock) + ' left';\n  return '<div class=\"lifebar\"><div class=\"lifebar-t ' + cls + '\"><i style=\"width:' + pctv + '%\"><\u002Fi><\u002Fdiv><span class=\"lifebar-l\">' + label + '<\u002Fspan><\u002Fdiv>';\n}\nfunction transitBar(c){\n  var total = S.sim.transitSec;\n  var remain = Math.max(0, (c.transitDoneAt||0) - S.sim.t);\n  var pctv = Math.max(0, Math.min(100, Math.round((1 - remain/total) * 100)));\n  return '<div class=\"lifebar\"><div class=\"lifebar-t transit\"><i style=\"width:' + pctv + '%\"><\u002Fi><\u002Fdiv><span class=\"lifebar-l\">SAR arriving, ' + fmtClock(remain) + '<\u002Fspan><\u002Fdiv>';\n}\nfunction statusChip(c){\n  var map = { treating:'Team working', stable:'Stabilized, holding', enroute:'Moving to ' + S.sim.echelon,\n    delivered:'Reached ' + S.sim.echelon, discharged:'Sent to walking wounded',\n    deceased:(c.outcome==='dead'?'Deceased on arrival':'Died waiting'), transit:'Inbound from SAR' };\n  var cls = (c.status==='delivered'||c.status==='discharged') ? 'ok' : (c.status==='deceased' ? (c.outcome==='died'?'bad':'grey') : 'work');\n  var extra = '';\n  if (c.status==='enroute'){ var tp = S.sim.transports.filter(function(x){ return x.cid===c.cid; })[0]; if (tp && !tp.arrived) extra = ', ETA ' + fmtClock(tp.arrivesAt - S.sim.t); }\n  return '<span class=\"stchip ' + cls + '\">' + esc(map[c.status]||c.status) + extra + '<\u002Fspan>';\n}\nfunction tagChip(tag){ return '<span class=\"tag2 t-' + tag.toLowerCase() + '\">' + tag + '<\u002Fspan>'; }\nfunction assessing(c){ return S.sim.assessments.some(function(a){ return a.cid===c.cid; }); }\nfunction assessRemain(c){ var a = S.sim.assessments.filter(function(x){ return x.cid===c.cid; })[0]; return a ? Math.max(0, Math.round(a.doneAt - S.sim.t)) : 0; }\n\nfunction actionsFor(c){\n  var sim = S.sim;\n  if (c.status === 'transit') return '';\n  if (c.status === 'scene'){\n    if (assessing(c)) return '<div class=\"assessing\">Taking vital signs, ' + assessRemain(c) + 's<\u002Fdiv>';\n    if (S.triageOpen === c.cid){\n      var tags = [['RED','Immediate'],['YELLOW','Delayed'],['GREEN','Minor'],['BLACK','Deceased']];\n      return '<div class=\"tagpick\">' + tags.map(function(t){\n        return '<button class=\"tp-b t-' + t[0].toLowerCase() + '\" data-act=\"triage\" data-val=\"' + c.cid + ':' + t[0] + '\"><b>' + t[0] + '<\u002Fb><span>' + t[1] + '<\u002Fspan><\u002Fbutton>'; }).join('') + '<\u002Fdiv>';\n    }\n    var assessBtn = c.assessed ? '' : '<button class=\"cbtn\" data-act=\"assess\" data-val=\"' + c.cid + '\">Take vital signs<\u002Fbutton>';\n    var triBtn = '<button class=\"cbtn primary\" data-act=\"triage-open\" data-val=\"' + c.cid + '\">Give a triage tag<\u002Fbutton>';\n    return '<div class=\"cactions\">' + assessBtn + triBtn + '<\u002Fdiv>';\n  }\n  if (c.status === 'waiting'){\n    if (c.playerTag === 'GREEN') return '<div class=\"cactions\"><button class=\"cbtn\" data-act=\"discharge\" data-val=\"' + c.cid + '\">Send to walking wounded<\u002Fbutton><\u002Fdiv>';\n    var btns = '';\n    if (sim.allowTreat) btns += '<button class=\"cbtn' + (sim.teamsFree>0?'':' off') + '\" data-act=\"treat\" data-val=\"' + c.cid + '\"' + (sim.teamsFree>0?'':' disabled') + '>Assign a team<\u002Fbutton>';\n    btns += '<button class=\"cbtn' + (sim.unitsFree>0?'':' off') + '\" data-act=\"transport\" data-val=\"' + c.cid + '\"' + (sim.unitsFree>0?'':' disabled') + '>' + esc(sim.deliverVerb) + '<\u002Fbutton>';\n    return '<div class=\"cactions\">' + btns + '<\u002Fdiv>';\n  }\n  if (c.status === 'stable'){\n    return '<div class=\"cactions\"><button class=\"cbtn' + (sim.unitsFree>0?'':' off') + '\" data-act=\"transport\" data-val=\"' + c.cid + '\"' + (sim.unitsFree>0?'':' disabled') + '>' + esc(sim.deliverVerb) + '<\u002Fbutton><\u002Fdiv>';\n  }\n  return '';\n}\n/* ----- eadOnArrival);\n  L.push('  Immediate (red) saved: ' + rep.redsSaved + ' of ' + rep.redTotal);\n  L.push('');\n  L.push('TRIAGE');\n  L.push('  Accuracy: ' + rep.tagAcc + '% (' + rep.exact + ' of ' + rep.triagedCount + ')');\n  L.push('  Under-triage: ' + rep.underRate + '% (target under 5%)');\n  L.push('  Over-triage: ' + rep.overRate + '%');\n  L.push('  Vitals measured on: ' + rep.assessedCount + ' of ' + rep.n);\n  if (rep.accWithVitals!=null) L.push('  Accuracy after measuring: ' + rep.accWithVitals + '%');\n  if (rep.accBlind!=null) L.push('  Accuracy tagging on sight: ' + rep.accBlind + '%');\n  L.push('');\n  L.push('TRIAGE ERRORS');\n  if (!rep.mistriaged.length) L.push('  None, every tag was correct.');\n  else rep.mistriaged.forEach(function(e){ L.push('  ' + e.code + '  you tagged ' + e.playerTag + ', should be ' + e.trueTag + '  (' + e.dir + '-triage)'); });\n  L.push('');\n  L.push('ACCOUNTABILITY, MOVED TO ' + sim.echelon.toUpperCase());\n  db.delivered.forEach(function(r){ L.push('  ' + r.code + '  ' + (r.tag||'') + '  at ' + fmtClock(r.at)); });\n  if (!db.delivered.length) L.push('  none');\n  L.push('');\n  L.push('READ OF THE INCIDENT');\n  L.push('  ' + vd.text);\n  return L.join('\\n');\n}\nfunction exportReport(){\n  var blob = new Blob([reportText()], {type:'text/plain'});\n  var a = document.createElement('a'); a.href = URL.createObjectURL(blob);\n  var slug = (S.sim.participant && S.sim.participant.name ? S.sim.participant.name.replace(/[^a-z0-9]+/gi,'-').toLowerCase() + '-' : '');\n  a.download = 'incident-report-' + slug + S.sim.seed + '.txt'; a.click();\n}\n\n/* ---------------- PDF export (self-contained, no library) ---------------- */\nfunction pdfEsc(s){ return String(s).replace(/[^\\x20-\\x7E\\xA0-\\xFF]/g,'').replace(/\\\\/g,'\\\\\\\\').replace(/\\(/g,'\\\\(').replace(/\\)/g,'\\\\)'); }\nfunction pdfWrap(text, max){\n  var words = String(text).split(/\\s+/), lines = [], line = '';\n  words.forEach(function(w){\n    if ((line ? line + ' ' + w : w).length > max){ if (line) lines.push(line); line = w; }\n    else line = line ? line + ' ' + w : w;\n  });\n  if (line) lines.push(line); return lines;\n}\nfunction buildReportLines(){\n  var sim = S.sim, rep = buildReport(sim), vd = verdict(rep), p = sim.participant, db = dashboard(sim), out = [];\n  var deliveredLabel = sim.mode === 'sar' ? 'Evacuated to safety' : 'Reached hospital';\n  var meanLabel = sim.mode === 'sar' ? 'Mean time to safety, reds' : 'Mean time to hospital, reds';\n  function line(t, o){ o = o || {}; out.push({ t:t, b:!!o.b, size:o.size||10.5, indent:o.indent||0, before:o.before||0, gap:o.gap||0 }); }\n  function head(t){ line(t, { b:true, size:11.5, before:8, gap:2 }); }\n  line('Surge vs. Lifeline', { b:true, size:19, gap:2 });\n  line('After action report', { b:true, size:13, gap:3 });\n  line(sim.scaleName + '  |  ' + sim.modeName + '  |  ' + rep.n + ' casualties  |  ' + fmtClock(rep.elapsed), { size:10, gap:6 });\n  if (p && (p.name || p.role || p.org || p.team)){\n    head('Exercise record');\n    if (p.name) line('Name: ' + p.name);\n    if (p.role) line('Role: ' + p.role);\n    if (p.org) line('Organization: ' + p.org);\n    if (p.team) line('Team: ' + p.team);\n  }\n  head('Outcomes');\n  line('Alive: ' + rep.alive);\n  line('Preventable deaths: ' + rep.preventable);\n  line('Deceased on arrival: ' + rep.deadOnArrival);\n  line('Immediate (red) saved: ' + rep.redsSaved + ' of ' + rep.redTotal);\n  line(meanLabel + ': ' + (rep.meanRedTime != null ? fmtClock(rep.meanRedTime) : 'none reached'));\n  head('Triage');\n  line('Accuracy: ' + rep.tagAcc + '% (' + rep.exact + ' of ' + rep.triagedCount + ')');\n  line('Under-triage: ' + rep.underRate + '% (target under 5%)');\n  line('Over-triage: ' + rep.overRate + '%');\n  line('Vitals measured on: ' + rep.assessedCount + ' of ' + rep.n);\n  if (rep.accWithVitals != null) line('Accuracy after measuring: ' + rep.accWithVitals + '%');\n  if (rep.accBlind != null) line('Accuracy tagging on sight: ' + rep.accBlind + '%');\n  head('Triage errors');\n  if (!rep.mistriaged.length) line('None, every tag was correct.');\n  else rep.mistriaged.forEach(function(e){ line(e.code + ': you tagged ' + e.playerTag + ', should be ' + e.trueTag + ' (' + e.dir + '-triage)', { indent:6 }); });\n  head('Where everyone ended');\n  line(deliveredLabel + ': ' + rep.delivered);\n  line('Stabilized and held: ' + rep.held);\n  line('Walking wounded, discharged: ' + rep.discharged);\n  line('Preventable deaths: ' + rep.preventable);\n  line('Deceased on arrival: ' + rep.deadOnArrival);\n  head('Moved to ' + sim.echelon);\n  if (!db.delivered.length) line('None.');\n  else db.delivered.forEach(function(r){ line(r.code + '  ' + (r.tag || '') + '  at ' + fmtClock(r.at), { indent:6 }); });\n  head('Read of the incident');\n  pdfWrap(vd.text, 92).forEach(function(l){ line(l); });\n  head('Session code');\n  line(sim.seed, { b:true });\n  line('', { gap:6 });\n  line('Training simulation only. Invented casualties and generated timings. Not a decision aid for a real incident.', { size:8.5 });\n  line('Generated ' + new Date().toLocaleString(), { size:8.5 });\n  return out;\n}\nfunction makePdf(lines){\n  var pageW = 612, pageH = 792, mL = 54, mT = 56, mB = 54;\n  var pages = [], cur = [], y = pageH - mT;\n  lines.forEach(function(ln){\n    var size = ln.size || 10.5;\n    if (ln.before) y -= ln.before;\n    var adv = size * 1.35 + (ln.gap || 0);\n    if (y - size * 1.35 < mB){ pages.push(cur); cur = []; y = pageH - mT; }\n    if (ln.t !== '') cur.push({ t:ln.t, b:ln.b, size:size, x:mL + (ln.indent || 0), y:y });\n    y -= adv;\n  });\n  pages.push(cur);\n  var objs = [];\n  objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';\n  objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';\n  objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';\n  var num = 5, kids = [];\n  pages.forEach(function(pg){\n \n  if (g){ var exp = parseInt(g,10); if (!isNaN(exp) && daysSinceEpoch(Date.now()) > exp) expiredNote = '<p class=\"access-expired\">Your previous access expired on ' + esc(expiryDateStr(exp)) + '.<\u002Fp>'; }\n  var b =\n  '<section class=\"access-card\">' +\n    '<p class=\"eyebrow\">Access required<\u002Fp>' +\n    '<p>This exercise is released for a set period. Enter the access code your facilitator gave you. The code stops working once its time is up.<\u002Fp>' +\n    expiredNote +\n    '<div class=\"access-in\"><input id=\"access-code\" class=\"seedin access-field\" placeholder=\"MICE-XXXX-XX\" value=\"' + esc(S.access.code) + '\">' +\n    '<button class=\"btn btn-primary\" data-act=\"access-unlock\">Unlock<\u002Fbutton><\u002Fdiv>' +\n    (S.access.error ? '<p class=\"access-err\">' + esc(S.access.error) + '<\u002Fp>' : '') +\n    '<p class=\"access-foot muted small\"><button class=\"linkbtn\" data-go=\"learn\">Learn the triage system<\u002Fbutton> &nbsp;&middot;&nbsp; <button class=\"linkbtn\" data-go=\"credits\">Credits<\u002Fbutton> &nbsp;&middot;&nbsp; <button class=\"linkbtn\" data-go=\"feedback\">Send feedback<\u002Fbutton><\u002Fp>' +\n    '<p class=\"access-foot muted small\">Facilitator issuing codes for a course? <button class=\"linkbtn\" data-act=\"issue-open\">Issue a code<\u002Fbutton><\u002Fp>' +\n  '<\u002Fsection>' +\n  '<p class=\"disclaimer\">Access control is a simple time based gate for course use. It relies on this device clock and is not a security control.<\u002Fp>';\n  return shell('Surge vs. Lifeline', 'A disaster triage decision simulation.', b);\n}\nfunction viewIssue(){\n  var body;\n  if (S.issue.stage !== 'gen'){\n    body = '<section class=\"access-card\"><p class=\"eyebrow\">Facilitator<\u002Fp>' +\n      '<p>Enter the facilitator key to issue access codes.<\u002Fp>' +\n      '<div class=\"access-in\"><input id=\"issue-key\" class=\"seedin access-field\" type=\"password\" placeholder=\"Facilitator key\" value=\"' + esc(S.issu ion fbEndpoint(){ return String(lsGet('svl_fb_endpoint') || FEEDBACK_ENDPOINT || '').trim(); }\nfunction fbLoad(){ var raw = lsGet('svl_feedback'); if (raw){ try { var a = JSON.parse(raw); if (Array.isArray(a)) return a; } catch(e){} } return []; }\nfunction fbSaveQueue(a){ lsSet('svl_feedback', JSON.stringify(a)); }\nfunction fbCounts(){ var a = fbLoad(), p = 0, s = 0; a.forEach(function(x){ if (x.status === 'synced') s++; else p++; }); return { pending:p, synced:s, total:a.length }; }\nfunction fbAdd(rec){ var a = fbLoad(); a.push(rec); fbSaveQueue(a); }\nfunction fbSync(cb){\n  var url = fbEndpoint(), a = fbLoad(), pend = a.filter(function(x){ return x.status !== 'synced'; });\n  if (!url){ S.fb.status = 'No sync destination is set yet.'; if (cb) cb(); return; }\n  if (!pend.length){ S.fb.status = 'Everything is already synced.'; if (cb) cb(); return; }\n  if (typeof fetch === 'undefined' || (typeof navigator !== 'undefined' && navigator.onLine === false)){ S.fb.status = 'You are offline. Saved here and will sync later.'; if (cb) cb(); return; }\n  S.fb.status = 'Syncing ' + pend.length + ' item' + (pend.length > 1 ? 's' : '') + '...';\n  var done = 0, okc = 0;\n  pend.forEach(function(rec){\n    fetch(url, { method:'POST', mode:'no-cors', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify(rec) })\n      .then(function(){ rec.status = 'synced'; rec.syncedAt = Date.now(); okc++; })\n      .catch(function(){})\n      .then(function(){ done++; if (done === pend.length){ fbSaveQueue(a); var cc = fbCounts(); S.fb.status = okc + ' synced, ' + cc.pending + ' still pending.'; if (cb) cb(); } });\n  });\n}\n\n/* The lean pilot instrument. Keep these item ids in step with the Apps Script columns. */\nvar FB_PROFILE = [\n  { id:'role', label:'Your role', opts:['Responder','Student','Faculty','Trainer','Other'] },\n  { id:'experience', label:'Prior triage experience', opts:['None','Some','Trained'] },\n  { id:'device', label:'Device used', opts:['Phone','Tablet','Laptop'] },\n  { id:'scale', label:'Largest incident you tried', opts:['Bus crash','Building collapse','Transport','Stadium'] },\n  { id:'connectivity', label:'Connectivity', opts:['Offline','Online','Both'] }\n];\nvar FB_SECTIONS = [\n  { key:'Functionality', note:'Do the features work as expected', items:[\n    ['F1','The tutorial on START and JumpSTART worked as expected.'],\n    ['F2','Taking vital signs and reading the monitor worked as expected.'],\n    ['F3','Assigning triage tags worked reliably.'],\n    ['F4','Treating, transporting, and discharging casualties worked as expected.'],\n    ['F5','The after-action report and the PDF export worked correctly.'] ] },\n  { key:'Usability and UI/UX', note:'Is it clear and easy to use', items:[\n    ['U1','The app was easy to use overall.'],\n    ['U2','The buttons, labels, and layout were clear.'],\n    ['U3','Text and numbers were easy to read.'],\n    ['U4','The vital signs monitor was easy to read at a glance.'],\n    ['U5','When I made a mistake, it was easy to recover.'] ] },\n  { key:'Scalability', note:'Does it hold up as things grow', items:[\n    ['S1','The app stayed smooth as the incident size grew.'],\n    ['S2','The app ran well on the device I used.'],\n    ['S3','I could see one facilitator running this for many learners at once.'] ] },\n  { key:'Credibility and realism', note:'Is it believable and trustworthy', items:[\n    ['C1','The vital signs and monitor felt believable.'],\n    ['C2','The triage outcomes made sense to me.'],\n    ['C3','I trust that the app reflects sound triage practice.'] ] },\n  { key:'Learning value', note:'Does it teach', items:[\n    ['L1','The app improved my understanding of how to triage.'],\n    ['L2','It gave me useful practice deciding under time pressure.'],\n    ['L3','The after-action report helped me see where I went wrong.'],\n    ['L4','I would find this useful for disaster preparedness training.'] ] },\n  { key:'Accessibility and reach', note:'Can it reach people', items:[\n    ['A1','The app worked for me without a stable internet connection.'],\n    ['A2','The app worked well on my own device.'],\n    ['A3','The language was clear and I could use it without much help.'] ] },\n  { key:'Reliability', note:'Is it stable', items:[\n    ['R1','The app ran without freezing or crashing.'],\n    ['R2','The app did not lose my progress or data.'] ] },\n  { key:'Overall', note:'', items:[\n    ['O1','Overall, I am satisfied with the app.'],\n    ['O2','I would recommend it to a colleague or classmate.'] ] }\n];\nvar FB_SUS = [\n  ['K1','I think that I would like to use this app frequently.'],\n  ['K2','I found the app unnecessarily complex.'],\n  ['K3','I thought the app was easy to use.'],\n  ['K4','I think I would need the support of a technical person to use this app.'],\n  ['K5','I found the various functions in the app well integrated.'],\n  ['K6','I thought there was too much inconsistency in the app.'],\n  ['K7','I imagine most people would learn to use this app very quickly.'],\n  ['K8','I found the app very awkward to use.'],\n  ['K9','I felt very confident using the app.'],\n  ['K10','I needed to learn a lot of things before I could get going with this app.']\n];\nvar FB_OPEN = [\n  ['bugs','Any bugs or unexpected behavior, and when it happened'],\n  ['useful','The most useful feature, and why'],\n  ['friction','The biggest friction or confusion'],\n  ['suggestions','What to add or change']\n];\nfunction fbAllItemIds(){ var ids = []; FB_SECTIONS.forEach(function(s){ s.items.forEach(function(it){ ids.push(it[0]); }); }); return ids; }\nfunction fbAnswered(){ var r = S.fb.resp || {}, k = fbAllItemIds(), n = 0; k.forEach(function(id){ if (r[id]) n++; }); return n; }\nfunction fbSusScore(){ var s = S.fb.sus || {}, k = ['K1','K2','K3','K4','K5','K6','K7','K8','K9','K10'];\n  for (var i=0;i<10;i++){ if (!s[k[i]]) return ''; }\n  var sum = (s.K1-1)+(5-s.K2)+(s.K3-1)+(5-s.K4)+(s.K5-1)+(5-s.K6)+(s.K7-1)+(5-s.K8)+(s.K9-1)+(5-s.K10);\n  return sum * 2.5;\n}\nfunction fbDefault(){ return { code:'', role:'', experience:'', device:'', scale:'', connectivity:'',\n  resp:{}, sus:{}, open:{ bugs:'', useful:'', friction:'', suggestions:'' },\n  showSus:false, sent:false, mode:'form', authKey:'', authErr:'', status:'' }; }\nfunction fbHarvest(){ if (!S.fb) return;\n  var c = document.getElementById('fb-code'); if (c) S.fb.code = c.value;\n  FB_OPEN.forEach(function(o){ var el = document.getElementById('fb-open-' + o[0]); if (el) S.fb.open[o[0]] = el.value; }); }\n\nfunction fbLikertRow(id, statement, current, act){\n  var btns = '';\n  for (var i=1;i<=5;i++) btns += '<button class=\"lk-b' + (current===i?' on':'') + '\" data-act=\"' + act + '\" data-val=\"' + id + ':' + i + '\">' + i + '<\u002Fbutton>';\n  return '<div class=\"lk-row\"><div class=\"lk-q\">' + esc(statement) + '<\u002Fdiv><div class=\"lk-scale\">' + btns + '<\u002Fdiv><\u002Fdiv>';\n}\nfunction fbChipGroup(field, opts, current){\n  return '<div class=\"chips\">' + opts.map(function(o){\n    return '<button class=\"chip' + (current===o?' on':'') + '\" data-act=\"fb-prof\" data-val=\"' + field + ':' + esc(o) + '\">' + esc(o) + '<\u002Fbutton>'; }).join('') + '<\u002Fdiv>';\n}\nfunction fbGateModal(){\n  return '<div class=\"fbgate-overlay\" data-act=\"fbgate-close\"><div class=\"fbgate-card\" data-act=\"noop\">' +\n    '<div class=\"fbgate-icon\">!<\u002Fdiv>' +\n    '<div class=\"fbgate-t\">Play the game first<\u002Fdiv>' +\n    '<p class=\"fbgate-msg\">Please play the game, and send your feedback through filling up the form and sending your response.<\u002Fp>' +\n    '<button class=\"btn btn-primary\" data-act=\"fbgate-close\">Got it<\u002Fbutton><\u002Fdiv><\u002Fdiv>';\n}\nfunction viewFeedback(){\n  if (!S.fb) S.fb = fbDefault();\n  var mode = S.fb.mode || 'form', counts = fbCounts();\n  var back = '<button class=\"btn btn-ghost\" data-go=\"' + (S.unlocked ? 'about' : 'access') + '\">Back<\u002Fbutton>';\n  var b;\n  this in now. Please play a game before you send it.<\u002Fp>') +\n      '<div class=\"cta-row\"><button class=\"btn btn-primary btn-lg\" data-act=\"fb-submit\">Submit assessment<\u002Fbutton><\u002Fdiv><\u002Fsection>';\n    var sync = '<section class=\"card\"><p class=\"eyebrow\">On this device<\u002Fp>' +\n      '<p class=\"muted small\">' + counts.total + ' saved, ' + counts.synced + ' synced, ' + counts.pending + ' pending.<\u002Fp>' +\n      '<div class=\"cta-row\"><button class=\"btn btn-ghost\" data-act=\"fb-sync\">Sync now<\u002Fbutton>' +\n      '<button class=\"btn btn-ghost tiny\" data-act=\"fb-config\">Configure sync (facilitator)<\u002Fbutton><\u002Fdiv>' +\n      (fbEndpoint() ? '' : '<p class=\"muted small\">Sync is not set up yet, so responses stay on this device for now.<\u002Fp>') + '<\u002Fsection>';\n    b = thanks + profile + sections + susBlock + open + submit + sync + '<div class=\"cta-row\">' + back + '<\u002Fdiv>' + (S.fb.gate ? fbGateModal() : '');\n  }\n  return shell('Pilot assessment', 'Offline first, syncs to the shared sheet when online', b);\n}\n\nvar DEFAULT_TEAM = [\n  { name:'Engr. Edward Andrew A. Dionido', role:'Lead, Science Research Specialist II', affiliations:['UPRI'] },\n  { name:'Franklin Joshua G. Gali', role:'Science Research Specialist II', affiliations:['UPRI'] },\n  { name:'Jerzyne Anne A. Corpuz', role:'Junior Project Officer', affiliations:['UPRI'] },\n  { name:'Carlos Primero D. Gundran, MD, MScDM, FPCEM', role:'Director for Institution Building', affiliations:['UPRI'] },\n  { name:'Trisha Mae Hilario', role:'Project Technical Specialist', affiliations:['UPM DRRM-H'] }\n];\nfunction cloneTeam(t){ return t.map(function(m){ return { name:m.name, role:m.role, affiliations:(m.affiliations||[]).slice() }; }); }\nfunction loadTeam(){\n  var raw = lsGet('svl_team');\n  if (raw){ try { var t = JSON.parse(raw); if (t && t.length) return t.map(function(m){ return { name:String(m.name||''), role:String(m.role||''), affiliatio gin = '0'; card.style.zIndex = '90'; card.style.pointerEvents = 'none';\n  function move(ev){\n    card.style.top = (ev.clientY - offY) + 'px';\n    var sibs = box.querySelectorAll('.mem-card:not(.dragging)'), placed = false;\n    for (var i = 0; i < sibs.length; i++){\n      var r = sibs[i].getBoundingClientRect();\n      if (ev.clientY < r.top + r.height / 2){ box.insertBefore(ph, sibs[i]); placed = true; break; }\n    }\n    if (!placed) box.appendChild(ph);\n  }\n  function up(){\n    document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up);\n    card.classList.remove('dragging');\n    card.style.position = ''; card.style.left = ''; card.style.width = ''; card.style.top = ''; card.style.margin = ''; card.style.zIndex = ''; card.style.pointerEvents = '';\n    box.insertBefore(card, ph); box.removeChild(ph);\n    harvestTeam();\n    var order = [], cards = box.querySelectorAll('.mem-card');\n    for (var i = 0; i < cards.length; i++){ order.push(parseInt(cards[i].getAttribute('data-mi'), 10)); }\n    if (S.teamEdit && order.length === S.teamEdit.length && order.indexOf(NaN) < 0){\n      S.teamEdit = order.map(function(idx){ return S.teamEdit[idx]; });\n    }\n    render();\n  }\n  document.addEventListener('pointermove', move); document.addEventListener('pointerup', up);\n}\n\nfunction viewCredits(){\n  if (!S.team) S.team = loadTeam();\n  var mode = S.creditsMode || 'view';\n  var back = '<button class=\"btn btn-ghost\" data-go=\"' + (S.unlocked ? 'about' : 'access') + '\">Back<\u002Fbutton>';\n  var instHead =\n    '<section class=\"card\"><p class=\"eyebrow\">Developed by<\u002Fp>' +\n      '<p class=\"cred-inst\">University of the Philippines Resilience Institute (UPRI)<\u002Fp>' +\n      '<p class=\"cred-collab\">in collaboration with<\u002Fp>' +\n      '<p class=\"cred-inst\">University of the Philippines Manila Disaster Risk Reduction and Management in Health (UPM DRRM-H)<\u002Fp><\u002Fsection>';\n  var b;\n  if (mode === 'auth'){\n    b = instHead +\n      '<section class=\"card\"><p class=\"eyebrow\">Edit the development team<\u002Fp>' +\n        '<p class=\"muted small\">Editing is limited to facilitators. Enter your facilitator key to continue.<\u002Fp>' +\n        '<input id=\"team-key\" class=\"tin\" type=\"text\" placeholder=\"Facilitator key\" value=\"' + esc(S.teamAuthKey || '') + '\">' +\n        (S.teamAuthErr ? '<p class=\"err-line\">' + esc(S.teamAuthErr) + '<\u002Fp>' : '') +\n        '<div class=\"cta-row\"><button class=\"btn btn-primary\" data-act=\"team-auth\">Unlock editing<\u002Fbutton>' +\n        '<button class=\"btn btn-ghost\" data-act=\"team-cancel\">Cancel<\u002Fbutton><\u002Fdiv><\u002Fsection>';\n  } else if (mode === 'edit'){\n    var cards = S.teamEdit.map(creditMemberEdit).join('');\n    b = '<section class=\"card\"><p class=\"eyebrow\">Editing team' + (S.teamEditBy ? ', signed in as ' + esc(S.teamEditBy) : '') + '<\u002Fp>' +\n        '<p class=\"muted small\">Drag the grip at the left of a member to reorder the authors. The new order is kept when you tap Save changes.<\u002Fp>' +\n        '<div id=\"team-editor\">' + cards + '<\u002Fdiv>' +\n        '<button class=\"btn btn-ghost addmem\" data-act=\"team-add-member\">Add a member<\u002Fbutton><\u002Fsection>' +\n      '<div class=\"cta-row\"><button class=\"btn btn-primary\" data-act=\"team-save\">Save changes<\u002Fbutton>' +\n        '<button class=\"btn btn-ghost\" data-act=\"team-cancel\">Cancel<\u002Fbutton>' +\n        '<button class=\"btn btn-ghost\" data-act=\"team-reset\">Reset to default<\u002Fbutton><\u002Fdiv>';\n  } else {\n    var rows = S.team.map(creditMemberView).join('');\n    b = instHead +\n      '<section class=\"card\"><p class=\"eyebrow\">Development team<\u002Fp><div class=\"cred-list\">' + rows + '<\u002Fdiv>' +\n        '<button class=\"btn btn-ghost tiny editteam\" data-act=\"team-edit-start\">Edit team<\u002Fbutton><\u002Fsection>' +\n      '<section class=\"card\"><p class=\"muted small\">This is a training simulation, never a clinical or command decision aid for a real incident.<\u002Fp><\u002Fsection>' +\n      '<div class=\"cta-row\">' + back + '<\u002Fdiv>';\n  }\n  return shell('Credits', mode === 'edit' ? 'Editing the development team' : 'Developer acknowledgement', b);\n}\n\nfunction init(){\n  S.unlocked = true;\n  S.screen = 'about';\n  render();\n}\nif (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);\nelse init();\n\n<\u002Fscript>\n\n<script>\n/* DRRM operations field. A hazard map under the UI: intensity contours, a radar\n   sweep that pings sites as it passes, dispatch units running corridors, and a\n   seismic strip along the bottom edge. Pointer = scan reticle; press = incident\n   epicentre (intensity rings push the network and spike the trace). */\n(function(){\n  var cv=document.getElementById('mesh'); if(!cv||!cv.getContext) return;\n  var ctx=cv.getContext('2d');\n  var W=0,H=0,raf=0,tick=0,nextAuto=520;\n  var sites=[],units=[],incidents=[],contours=[],trace=[],spike=0;\n  var pts=new Map(), held=new Set();\n  var calm=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);\n  var LINK=148, REACH=172, TRACE_N=210;\n  var radar={x:0,y:0,a:0};\n  var CY='78,224,232', AM='232,131,74', GR='55,208,126';\n\n  function norm(a){ while(a>Math.PI)a-=6.283185; while(a<-Math.PI)a+=6.283185; return a; }\n  function count(){ return Math.round(Math.min(62,Math.max(22,(W*H)/19500))); }\n\n  function newUnit(){\n    var n=sites.length;\n    if(n<2) return {from:0,to:0,t:1,sp:.002,hue:CY};\n    var f=Math.floor(Math.random()*n), to=f, guard=0;\n    while(to===f&&guard++<8) to=Math.floor(Math.random()*n);\n    return {from:f,to:to,t:0,sp:.0013+Math.random()*.0019,hue:Math.random()<.22?AM:CY};\n  }\n\n  function seed(){\n    var n=count();\n    sites=[];\n    for(var i=0;i<n;i++){\n      var roll=Math.random();\n      sites.push({\n        x:Math.random()*W, y:Math.random()*H,\n        vx:(Math.random()-.5)*.10, vy:(Math.random()-.5)*.10,\n        kind: roll<.11?'hub' : roll<.32?'center' : 'node',\n        e:0, ping:0, ph:Math.random()*6.283\n      });\n    }\n    contours=[];\n    var cc=2+Math.round(Math.random());\n    for(var c=0;c<cc;c++) contours.push({\n      x:(.14+Math.random()*.72)*W, y:(.14+Math.random()*.72)*H,\n      rx:74+Math.random()*130, ry:52+Math.random()*98, rot:Math.random()*3.14,\n      bands:3+Math.round(Math.random()*2),\n      dx:(Math.random()-.5)*.055, dy:(Math.random()-.5)*.055, dr:(Math.random()-.5)*.0007\n    });\n    units=[];\n    for(var u=0;u<Math.max(2,Math.round(n/13));u++){ var uu=newUnit(); uu.t=Math.random(); units.push(uu); }\n    radar.x=W*(.34+Math.random()*.32); radar.y=H*(.36+Math.random()*.28); radar.a=Math.random()*6.283;\n    trace=[]; for(var s=0;s<TRACE_N;s++) trace.push(0);\n  }\n\n  function degenerate(){\n    if(!sites.length) return true;\n    var x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;\n    for(var i=0;i<sites.length;i++){\n      var n=sites[i];\n      if(!isFinite(n.x)||!isFinite(n.y)) return true;\n      if(n.x<x0)x0=n.x; if(n.x>x1)x1=n.x; if(n.y<y0)y0=n.y; if(n.y>y1)y1=n.y;\n    }\n    return (x1-x0)<8 || (y1-y0)<8;\n  }\n\n  function resize(){\n    var w=cv.clientWidth||document.documentElement.clientWidth||window.innerWidth||0;\n    var hgt=cv.clientHeight||document.documentElement.clientHeight||window.innerHeight||0;\n    if(!w||!hgt){ requestAnimationFrame(resize); return; }\n    W=w; H=hgt;\n    var d=Math.min(window.devicePixelRatio||1,2);\n    cv.width=Math.round(W*d); cv.height=Math.round(H*d);\n    ctx.setTransform(d,0,0,d,0,0);\n    if(degenerate()||Math.abs(count()-sites.length)>8) seed();\n    else {\n      for(var i=0;i<sites.length;i++){\n        if(sites[i].x>W) sites[i].x=Math.random()*W;\n        if(sites[i].y>H) sites[i].y=Math.random()*H;\n      }\n      radar.x=Math.min(radar.x,W*.86); radar.y=Math.min(radar.y,H*.82);\n    }\n    step();\n  }\n\n  function incident(x,y,mag){\n    incidents.push({x:x,y:y,a:1,mag:mag,rings:[{r:0,sp:7.4},{r:0,sp:4.9},{r:0,sp:3.1}]});\n    spike=mag;\n  }\n\n  function step(){\n    tick++;\n    var list=[],k,i;\n    pts.forEach(function(p){list.push(p);});\n\n    if(!calm){\n      radar.a=norm(radar.a+.0115);\n      if(--nextAuto<=0){\n        incident(60+Math.random()*(W-120), 60+Math.random()*(H-120), 13+Math.random()*10);\n        nextAuto=540+Math.round(Math.random()*520);\n      }\n      for(i=0;i<contours.length;i++){\n        var co=contours[i];\n        co.x+=co.dx; co.y+=co.dy; co.rot+=co.dr;\n        if(co.x<-140)co.x=W+140; else if(co.x>W+140)co.x=-140;\n        if(co.y<-140)co.y=H+140; else if(co.y>H+140)co.y=-140;\n      }\n      for(i=0;i<units.length;i++){\n        units[i].t+=units[i].sp;\n        if(units[i].t>=1) units[i]=newUnit();\n      }\n    }\n\n    for(i=0;i<sites.length;i++){\n      var n=sites[i];\n      if(!calm){\n        n.x+=n.vx; n.y+=n.vy;\n        n.vx+=(Math.random()-.5)*.006; n.vy+=(Math.random()-.5)*.006;\n        var d2=norm(Math.atan2(n.y-radar.y,n.x-radar.x)-radar.a);\n        if(Math.abs(d2)<.05 && n.ping<.5) n.ping=1;\n      }\n      n.e*=.93; n.ping*=.962;\n      for(k=0;k<list.length;k++){\n        var p=list[k], dx=n.x-p.x, dy=n.y-p.y, d=Math.sqrt(dx*dx+dy*dy);\n        if(d<REACH&&d>.01){\n          var f=1-d/REACH;\n          n.vx+=dx/d*f*.04; n.vy+=dy/d*f*.04;\n          if(f>n.e) n.e=f;\n        }\n      }\n      for(k=0;k<incidents.length;k++){\n        var ic=incidents[k], ax=n.x-ic.x, ay=n.y-ic.y, ad=Math.sqrt(ax*ax+ay*ay)||1;\n        var band=Math.abs(ad-ic.rings[0].r);\n        if(band<56){\n          var g=(1-band/56)*ic.a;\n          n.vx+=ax/ad*g*.5; n.vy+=ay/ad*g*.5;\n          if(g>n.e) n.e=g;\n        }\n      }\n      n.vx*=.983; n.vy*=.983;\n      var sp=Math.sqrt(n.vx*n.vx+n.vy*n.vy);\n      if(sp>1.5){n.vx*=1.5/sp; n.vy*=1.5/sp;}\n      if(n.x<-24)n.x=W+24; else if(n.x>W+24)n.x=-24;\n      if(n.y<-24)n.y=H+24; else if(n.y>H+24)n.y=-24;\n    }\n\n    for(k=incidents.length-1;k>=0;k--){\n      var ii=incidents[k];\n      for(i=0;i<ii.rings.length;i++) ii.rings[i].r+=ii.rings[i].sp;\n      ii.a*=.962;\n      if(ii.a<.03) incidents.splice(k,1);\n    }\n\n    spike*=.941;\n    trace.shift();\n    trace.push(Math.sin(tick*.21)*(Math.random()*1.5+.7) + Math.sin(tick*.83)*spike);\n\n    /* ---------- draw ---------- */\n    ctx.clearRect(0,0,W,H);\n\n    /* intensity contours */\n    ctx.lineWidth=1;\n    for(i=0;i<contours.length;i++){\n      var cc2=contours[i];\n      for(var bd=0;bd<cc2.bands;bd++){\n        var f2=1+bd*.42;\n        ctx.strokeStyle='rgba('+CY+','+(.062-bd*.011).toFixed(3)+')';\n        ctx.beginPath();\n        ctx.ellipse(cc2.x,cc2.y,cc2.rx*f2,cc2.ry*f2,cc2.rot,0,6.2832);\n        ctx.stroke();\n      }\n    }\n\n    /* radar range rings + sweep afterglow */\n    var reach=Math.sqrt(W*W+H*H);\n    for(i=1;i<=3;i++){\n      ctx.strokeStyle='rgba('+CY+',.038)';\n      ctx.beginPath(); ctx.arc(radar.x,radar.y,reach*.22*i,0,6.2832); ctx.stroke();\n    }\n    for(i=0;i<26;i++){\n      var aa=radar.a-i*.021, al=(1-i/26)*.075;\n      ctx.strokeStyle='rgba('+CY+','+al.toFixed(3)+')';\n      ctx.lineWidth=i<2?1.6:1;\n      ctx.beginPath(); ctx.moveTo(radar.x,radar.y);\n      ctx.lineTo(radar.x+Math.cos(aa)*reach, radar.y+Math.sin(aa)*reach); ctx.stroke();\n    }\n    ctx.lineWidth=1;\n\n    /* comms / supply links */\n    for(var s1=0;s1<sites.length;s1++){\n      var na=sites[s1];\n      for(var s2=s1+1;s2<sites.length;s2++){\n        var nb=sites[s2], ldx=na.x-nb.x, ldy=na.y-nb.y;\n        if(ldx>LINK||ldx<-LINK||ldy>LINK||ldy<-LINK) continue;\n        var ld=Math.sqrt(ldx*ldx+ldy*ldy); if(ld>LINK) continue;\n        var lit=Math.max(Math.max(na.e,nb.e), Math.max(na.ping,nb.ping)*.7);\n        ctx.strokeStyle='rgba('+CY+','+((1-ld/LINK)*.15+lit*.5).toFixed(3)+')';\n        ctx.beginPath(); ctx.moveTo(na.x,na.y); ctx.lineTo(nb.x,nb.y); ctx.stroke();\n      }\n    }\n\n    /* dispatch corridors + units */\n    for(i=0;i<units.length;i++){\n      var u=units[i], A=sites[u.from], B=sites[u.to];\n      if(!A||!B) { units[i]=newUnit(); continue; }\n      ctx.setLineDash([3,7]);\n      ctx.strokeStyle='rgba('+CY+',.055)';\n      ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke();\n      ctx.setLineDash([]);\n      var fade=Math.min(1, Math.min(u.t,1-u.t)*9);\n      var ux=A.x+(B.x-A.x)*u.t, uy=A.y+(B.y-A.y)*u.t;\n      var t0=Math.max(0,u.t-.045);\n      ctx.strokeStyle='rgba('+u.hue+','+(.34*fade).toFixed(3)+')';\n      ctx.lineWidth=1.6;\n      ctx.beginPath(); ctx.moveTo(A.x+(B.x-A.x)*t0, A.y+(B.y-A.y)*t0); ctx.lineTo(ux,uy); ctx.stroke();\n      ctx.lineWidth=1;\n      ctx.fillStyle='rgba('+u.hue+','+(.62*fade).toFixed(3)+')';\n      ctx.beginPath(); ctx.arc(ux,uy,1.7,0,6.2832); ctx.fill();\n    }\n\n    /* incident epicentres — intensity zones */\n    for(k=0;k<incidents.length;k++){\n      var ic2=incidents[k];\n      for(i=0;i<ic2.rings.length;i++){\n        ctx.strokeStyle='rgba('+AM+','+(ic2.a*(.44-i*.11)).toFixed(3)+')';\n        ctx.lineWidth=i===0?1.7:1;\n        ctx.beginPath(); ctx.arc(ic2.x,ic2.y,ic2.rings[i].r,0,6.2832); ctx.stroke();\n      }\n      ctx.lineWidth=1;\n      var fl=ic2.a*ic2.a;\n      if(fl>.02){\n        ctx.fillStyle='rgba('+AM+','+(fl*.5).toFixed(3)+')';\n        ctx.beginPath(); ctx.arc(ic2.x,ic2.y,2.6+fl*3.4,0,6.2832); ctx.fill();\n        ctx.strokeStyle='rgba('+AM+','+(fl*.55).toFixed(3)+')';\n        ctx.beginPath();\n        ctx.moveTo(ic2.x-9,ic2.y); ctx.lineTo(ic2.x+9,ic2.y);\n        ctx.moveTo(ic2.x,ic2.y-9); ctx.lineTo(ic2.x,ic2.y+9); ctx.stroke();\n      }\n    }\n\n    /* scan reticle at each pointer */\n    for(k=0;k<list.length;k++){\n      var pp=list[k];\n      var gr=ctx.createRadialGradient(pp.x,pp.y,0,pp.x,pp.y,REACH);\n      gr.addColorStop(0,'rgba('+CY+',.13)'); gr.addColorStop(1,'rgba('+CY+',0)');\n      ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(pp.x,pp.y,REACH,0,6.2832); ctx.fill();\n      ctx.strokeStyle='rgba('+CY+',.2)';\n      ctx.beginPath(); ctx.arc(pp.x,pp.y,REACH*.52,0,6.2832); ctx.stroke();\n      ctx.strokeStyle='rgba('+CY+',.28)';\n      ctx.beginPath();\n      ctx.moveTo(pp.x-13,pp.y); ctx.lineTo(pp.x-5,pp.y);\n      ctx.moveTo(pp.x+5,pp.y); ctx.lineTo(pp.x+13,pp.y);\n      ctx.moveTo(pp.x,pp.y-13); ctx.lineTo(pp.x,pp.y-5);\n      ctx.moveTo(pp.x,pp.y+5); ctx.lineTo(pp.x,pp.y+13); ctx.stroke();\n      for(var m=0;m<sites.length;m++){\n        var nn=sites[m], ddx=nn.x-pp.x, ddy=nn.y-pp.y, dd=Math.sqrt(ddx*ddx+ddy*ddy);\n        if(dd<REACH){\n          ctx.strokeStyle='rgba('+(nn.kind==='hub'?AM:CY)+','+((1-dd/REACH)*.55).toFixed(3)+')';\n          ctx.beginPath(); ctx.moveTo(pp.x,pp.y); ctx.lineTo(nn.x,nn.y); ctx.stroke();\n        }\n      }\n    }\n\n    /* sites: EOC hubs, evacuation centres, barangay nodes */\n    for(k=0;k<sites.length;k++){\n      var nd=sites[k], lit2=Math.max(nd.e,nd.ping), al2=.3+lit2*.62;\n      var warm=nd.kind==='hub';\n      var col=warm?AM:CY;\n      if(lit2>.14){ ctx.shadowBlur=13*lit2; ctx.shadowColor=warm?'#e8834a':'#4ee0e8'; }\n      ctx.fillStyle='rgba('+col+','+al2.toFixed(3)+')';\n      ctx.strokeStyle='rgba('+col+','+al2.toFixed(3)+')';\n      if(warm){\n        var hs=3+lit2*1.9;\n        ctx.beginPath(); ctx.rect(nd.x-hs,nd.y-hs,hs*2,hs*2); ctx.stroke();\n        ctx.beginPath();\n        ctx.moveTo(nd.x-hs*.55,nd.y); ctx.lineTo(nd.x+hs*.55,nd.y);\n        ctx.moveTo(nd.x,nd.y-hs*.55); ctx.lineTo(nd.x,nd.y+hs*.55); ctx.stroke();\n      } else if(nd.kind==='center'){\n        var ts=3.4+lit2*2.2;\n        ctx.beginPath();\n        ctx.moveTo(nd.x,nd.y-ts); ctx.lineTo(nd.x+ts*.92,nd.y+ts*.72);\n        ctx.lineTo(nd.x-ts*.92,nd.y+ts*.72); ctx.closePath(); ctx.stroke();\n      } else {\n        var pulse=1+Math.sin(tick*.03+nd.ph)*.14;\n        ctx.beginPath(); ctx.arc(nd.x,nd.y,(1.25+lit2*1.8)*pulse,0,6.2832); ctx.fill();\n      }\n      ctx.shadowBlur=0;\n      if(nd.ping>.28){\n        ctx.strokeStyle='rgba('+(warm?AM:GR)+','+(nd.ping*.34).toFixed(3)+')';\n        ctx.beginPath(); ctx.arc(nd.x,nd.y,8+(1-nd.ping)*15,0,6.2832); ctx.stroke();\n      }\n    }\n\n    /* seismic strip along the bottom edge */\n    var baseY=H-26;\n    ctx.strokeStyle='rgba('+CY+',.07)';\n    ctx.beginPath(); ctx.moveTo(0,baseY); ctx.lineTo(W,baseY); ctx.stroke();\n    ctx.strokeStyle='rgba('+CY+','+(spike>1?.34:.19).toFixed(3)+')';\n    ctx.lineWidth=1.2;\n    ctx.beginPath();\n    for(i=0;i<trace.length;i++){\n      var tx=i/(trace.length-1)*W, ty=baseY-trace[i];\n      if(i===0) ctx.moveTo(tx,ty); else ctx.lineTo(tx,ty);\n    }\n    ctx.stroke();\n    ctx.lineWidth=1;\n  }\n\n  function loop(){ step(); raf=requestAnimationFrame(loop); }\n  function start(){ if(!raf) raf=requestAnimationFrame(loop); }\n  function stop(){ if(raf){cancelAnimationFrame(raf); raf=0;} }\n\n  function put(e){ pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); }\n  addEventListener('pointerdown',function(e){\n    held.add(e.pointerId); put(e);\n    incident(e.clientX,e.clientY,26);\n    start();\n  },{passive:true});\n  addEventListener('pointermove',function(e){\n    if(e.pointerType!=='mouse'&&!held.has(e.pointerId)) return;\n    put(e); start();\n  },{passive:true});\n  function drop(e){ held.delete(e.pointerId); if(e.pointerType!=='mouse') pts.delete(e.pointerId); }\n  addEventListener('pointerup',drop,{passive:true});\n  addEventListener('pointercancel',drop,{passive:true});\n  addEventListener('pointerout',function(e){ if(e.pointerType==='mouse') pts.delete(e.pointerId); },{passive:true});\n\n  addEventListener('resize',resize);\n  if(window.ResizeObserver) new ResizeObserver(resize).observe(document.documentElement);\n  document.addEventListener('visibilitychange',function(){\n    if(document.hidden){stop();} else {raf=0; step(); start();}\n  });\n\n  resize(); start();\n})();\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
