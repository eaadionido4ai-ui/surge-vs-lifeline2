document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<title>Surge vs. Lifeline (Self-Study, Feedback)<\u002Ftitle>\n<meta name=\"description\" content=\"Surge vs. Lifeline, an offline disaster triage decision simulation with vital signs, wave arrivals, and pseudonymized accountability.\">\n<style>\n/* Major Incident Exercise. Suite navy base, ISO tag colors, amber command accent. */\n:root{\n  --bg:#08131E; --panel:#10222F; --panel2:#16303F; --panel3:#1D3D50;\n  --line:#234456; --line2:#2E566B;\n  --ink:#E8F1F6; --ink2:#BDD2DE; --mute:#7D9AAB;\n  --accent:#F5A524; --accent2:#FBC46A;\n  --red:#E5484D; --yellow:#F5B325; --green:#35B673; --grey:#8891A8;\n  --sans:system-ui,-apple-system,\"Segoe UI\",Roboto,\"Helvetica Neue\",Arial,sans-serif;\n  --mono:ui-monospace,\"SF Mono\",\"Cascadia Mono\",Menlo,Consolas,\"Liberation Mono\",monospace;\n  --serif:\"Iowan Old Style\",\"Palatino Linotype\",Palatino,Georgia,serif;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0}\nbody{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;\n  -webkit-font-smoothing:antialiased;\n  background-image:radial-gradient(900px 520px at 50% -180px, rgba(245,165,36,.13), transparent 70%)}\n.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}\n.wrap{max-width:720px;margin:0 auto;padding:26px 20px 96px}\n.board-wrap{padding-top:0}\n.h1{font-family:var(--serif);font-size:clamp(26px,6vw,34px);font-weight:600;line-height:1.1;margin:6px 0 8px}\n.lede{font-size:16px;color:var(--ink2);margin:0 0 20px;max-width:56ch}\n.eyebrow{font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}\n.card,.hero-card,.block{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 14px}\n.hero-card{background:linear-gradient(180deg,rgba(245,165,36,.08),rgba(245,165,36,.02));border-color:rgba(245,165,36,.35)}\n.card p,.hero-card p{color:var(--ink2);margin:0 0 10px}.card p:last-child,.hero-card p:last-child{margin-bottom:0}\n.muted{color:var(--mute)} .small{font-size:13px} .strong{color:var(--ink);font-weight:700}\n.credit{background:#050D15}\n.steps-list{margin:0;padding-left:20px} .steps-list li{color:var(--ink2);margin-bottom:9px;padding-left:4px}\n.steps-list li:last-child{margin-bottom:0}\n.disclaimer{font-size:12.5px;color:var(--mute);text-align:center;margin:18px 8px 0;line-height:1.5}\n\n.btn{font:inherit;font-weight:700;border-radius:11px;padding:12px 18px;border:1px solid var(--line2);\n  background:var(--panel2);color:var(--ink);cursor:pointer;transition:border-color .15s,transform .1s}\n.btn:active{transform:scale(.98)}\n.btn-primary{background:var(--accent);border-color:var(--accent);color:#180E02}\n.btn-primary:hover{background:var(--accent2)}\n.btn-lg{padding:14px 24px;font-size:16px}\n.btn-ghost{background:transparent}\n.cta-row{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 0}\n\n.block .eyebrow{margin-bottom:12px}\n.opts{display:flex;flex-direction:column;gap:9px}\n.opt{display:flex;flex-direction:column;gap:3px;text-align:left;padding:15px;border-radius:13px;\n  border:1px solid var(--line2);background:var(--panel2);color:var(--ink);cursor:pointer;transition:border-color .15s}\n.opt:hover{border-color:var(--accent)} .opt.on{border-color:var(--accent);background:rgba(245,165,36,.12)}\n.opt-n{font-weight:700;font-size:16px} .opt-d{font-size:13.5px;color:var(--ink2)}\n.opt-meta{font-size:12px;color:var(--mute);margin-top:3px;font-family:var(--mono)}\n.hint{font-size:13px;color:var(--mute);margin:10px 0 0}\n.seedrow{display:flex;gap:9px}\n.seedin{flex:1;font:inherit;font-family:var(--mono);font-size:18px;letter-spacing:.22em;text-transform:uppercase;\n  text-align:center;padding:12px;border-radius:11px;border:1px solid var(--line2);background:#050D15;color:var(--ink);outline:none}\n.seedin:focus{border-color:var(--accent)}\n\n/* ---- Board header ---- */\n.bhd{position:sticky;top:0;z-index:20;background:rgba(8,19,30,.94);backdrop-filter:blur(8px);\n  border-bottom:1px solid var(--line);padding:12px 16px;margin:0 -20px 14px}\n.bhd-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}\n.clock2{font-family:var(--mono);font-size:26px;font-weight:800;color:var(--accent2);font-variant-numeric:tabular-nums}\n.bhd-ctrl{display:flex;gap:7px}\n.ic-btn{font:inherit;font-size:13px;font-weight:700;padding:8px 13px;border-radius:9px;border:1px solid var(--line2);\n  background:var(--panel2);color:var(--ink2);cursor:pointer}\n.ic-btn:hover{border-color:var(--accent);color:var(--ink)}\n.ic-btn.danger{color:#F3A9AC;border-color:rgba(229,72,77,.4)}\n.ic-btn.danger:hover{border-color:var(--red);color:#fff}\n.res{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}\n.res-i{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center}\n.res-v{display:block;font-size:19px;font-weight:800} .res-v.ok{color:var(--green)} .res-v.bad{color:var(--red)}\n.res-k{display:block;font-size:9.5px;color:var(--mute);letter-spacing:.05em;text-transform:uppercase;margin-top:2px}\n\n/* ---- Board sections + cards ---- */\n.bsec{margin:0 0 16px}\n.bsec-h{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:800;\n  letter-spacing:.13em;text-transform:uppercase;color:var(--mute);margin-bottom:9px}\n.bsec-n{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--ink2)}\n.bsec-note{font-size:12.5px;color:var(--mute);margin:0 0 10px}\n.ccard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:9px}\n.ccard.resolved{opacity:.72;padding:10px 13px}\n.ccard.died{border-color:rgba(229,72,77,.45)}\n.ccard-top{display:flex;gap:11px;align-items:flex-start}\n.ccard-fig{position:relative;flex:none;width:78px}\n.fig{width:100%;height:auto;display:block}\n.ch-tag{position:absolute;top:-4px;left:2px;font-size:8px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;\n  color:#180E02;background:var(--accent2);border-radius:99px;padding:1px 6px}\n.ccard-info{flex:1;min-width:0}\n.ccard-h{display:flex;align-items:center;gap:8px;margin-bottom:2px}\n.ccard-id{font-size:12px;color:var(--mute)}\n.ccard-label{font-weight:700;font-size:15px;margin:0}\n.ccard-person{font-size:12.5px;color:var(--mute);margin:1px 0 0}\n.ccard-signs{flex:none;display:flex;flex-direction:column;gap:6px}\n.sign-chip{display:flex;flex-direction:column;align-items:center;gap:2px;width:52px}\n.sign{width:34px;height:34px;display:block}\n.sign-l{font-size:9px;color:var(--ink2);text-align:center;line-height:1.2}\n\n.tag2{font-size:10px;font-weight:800;letter-spacing:.06em;padding:2px 8px;border-radius:99px}\n.t-red{background:var(--red);color:#fff}.t-yellow{background:var(--yellow);color:#0A0A0A}\n.t-green{background:var(--green);color:#04180E}.t-black{background:#41485C;color:#fff}\n\n.lifebar{display:flex;align-items:center;gap:9px;margin:11px 0 3px}\n.lifebar-t{flex:1;height:8px;border-radius:99px;background:#0A1A24;overflow:hidden;border:1px solid var(--line)}\n.lifebar-t i{display:block;height:100%;border-radius:99px;transition:width .5s linear}\n.lifebar-t.red i{background:linear-gradient(90deg,#E5484D,#F5883A)}\n.lifebar-t.amber i{background:var(--yellow)}\n.lifebar-t.held i{background:var(--grey)}\n.lifebar-l{font-size:11px;font-family:var(--mono);color:var(--mute);white-space:nowrap}\n.lifebar-t.red + .lifebar-l{color:#F3A9AC}\n\n.stchip{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;margin-top:6px;\n  background:var(--panel2);border:1px solid var(--line)}\n.stchip.ok{color:var(--green);border-color:rgba(53,182,115,.4)}\n.stchip.bad{color:var(--red);border-color:rgba(229,72,77,.4)}\n.stchip.grey{color:var(--mute)} .stchip.work{color:var(--accent2);border-color:rgba(245,165,36,.4)}\n\n.cactions{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}\n.cbtn{flex:1 1 auto;min-width:120px;font:inherit;font-size:13.5px;font-weight:700;padding:11px;border-radius:10px;\n  border:1px solid var(--line2);background:var(--panel2);color:var(--ink);cursor:pointer;transition:border-color .12s}\n.cbtn:hover{border-color:var(--accent)}\n.cbtn.primary{background:var(--accent);border-color:var(--accent);color:#180E02}\n.cbtn.off,.cbtn[disabled]{opacity:.4;cursor:not-allowed}\n.cbtn.off:hover{border-color:var(--line2)}\n\n.tagpick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:11px}\n.tp-b{font:inherit;display:flex;flex-direction:column;align-items:center;gap:1px;padding:11px;border-radius:10px;\n  border:2px solid;background:var(--panel2);cursor:pointer;color:var(--ink)}\n.tp-b b{font-size:14px;letter-spacing:.05em}.tp-b span{font-size:11px;color:var(--ink2)}\n.tp-b.t-red{border-color:var(--red)}.tp-b.t-red:hover{background:rgba(229,72,77,.15)}\n.tp-b.t-yellow{border-color:var(--yellow)}.tp-b.t-yellow:hover{background:rgba(245,179,37,.13)}\n.tp-b.t-green{border-color:var(--green)}.tp-b.t-green:hover{background:rgba(53,182,115,.13)}\n.tp-b.t-black{border-color:#5A6273}.tp-b.t-black:hover{background:rgba(90,98,115,.2)}\n\n.rgrid{display:flex;flex-wrap:wrap;gap:7px}\n.rchip{font-size:12px;padding:6px 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--ink2)}\n.rchip .mono{color:var(--mute);margin-right:3px}\n.rchip.r-alive{border-color:rgba(53,182,115,.4)}\n.rchip.r-died{border-color:rgba(229,72,77,.45);color:#F3A9AC}\n.rchip.r-dead{opacity:.6}\n\n/* ---- Report ---- */\n.report-hd{margin:0 0 12px}.rep-line{font-size:12px;color:var(--accent2);font-weight:700;margin:0}\n.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 14px}\n.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;text-align:center}\n.kpi.ok-soft{border-color:rgba(53,182,115,.4)}.kpi.bad-soft{border-color:rgba(229,72,77,.5)}\n.kv{display:block;font-size:30px;font-weight:800;line-height:1}\n.kk{display:block;font-size:11.5px;color:var(--mute);margin-top:6px}.kk i{color:var(--mute)}\n.v-good-soft{border-color:rgba(53,182,115,.5)}.v-ok-soft{border-color:rgba(245,179,37,.5)}.v-poor-soft{border-color:rgba(229,72,77,.5)}\n.endgrid{display:flex;flex-direction:column;gap:2px}\n.endrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}\n.endrow:last-child{border-bottom:none}\n.endrow-l{font-size:14px;color:var(--ink2)}\n.endrow-v{font-size:18px;font-weight:800}.endrow-v.ok{color:var(--green)}.endrow-v.bad{color:var(--red)}.endrow-v.grey{color:var(--mute)}\n.seedbig{font-size:26px;letter-spacing:.24em;color:var(--accent2);margin:4px 0 8px}\n\n@media (max-width:640px){\n  .wrap{padding:22px 15px 90px}.bhd{margin:0 -15px 14px}\n  .res{grid-template-columns:repeat(4,1fr);gap:5px}.res-v{font-size:16px}\n  .kpis{grid-template-columns:repeat(2,1fr)}\n  .ccard-signs{flex-direction:row}\n  .clock2{font-size:22px}\n  .cbtn{min-width:100px}\n}\n@media (max-width:400px){\n  .ccard-top{flex-wrap:wrap}.ccard-signs{flex-direction:row;width:100%;justify-content:flex-start;margin-top:4px}\n  .res{grid-template-columns:repeat(2,1fr)}\n}\n\n/* ============ Command edition additions ============ */\n.feat{margin:0;padding-left:20px}.feat li{color:var(--ink2);margin-bottom:9px;padding-left:4px}.feat li:last-child{margin-bottom:0}\n.toggles{display:grid;grid-template-columns:1fr 1fr;gap:9px}\n.tog{display:flex;flex-direction:column;gap:3px;text-align:left;padding:13px;border-radius:12px;border:1px solid var(--line2);\n  background:var(--panel2);color:var(--ink);cursor:pointer;transition:border-color .15s}\n.tog:hover{border-color:var(--accent)}.tog.on{border-color:var(--accent);background:rgba(245,165,36,.12)}\n.tog b{font-size:14.5px}.tog span{font-size:11.5px;color:var(--ink2)}\n.hint.on{color:var(--accent2)}\n\n/* Tabs in the board header */\n.tabs{display:flex;gap:6px;margin-top:10px}\n.tab{flex:1;font:inherit;font-size:13px;font-weight:700;padding:9px;border-radius:9px;border:1px solid var(--line);\n  background:var(--panel);color:var(--mute);cursor:pointer}\n.tab.on{background:var(--accent);border-color:var(--accent);color:#180E02}\n\n/* Radio pop-up */\n.radio-wrap{position:sticky;top:8px;z-index:30;margin:0 0 14px}\n.radio-card{background:linear-gradient(180deg,#132A1E,#0C1B24);border:1px solid rgba(53,182,115,.5);border-radius:15px;\n  padding:16px;box-shadow:0 14px 40px rgba(0,0,0,.5)}\n.radio-h{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--green);margin-bottom:8px}\n.radio-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:blip 1.4s infinite}\n@keyframes blip{0%,100%{opacity:1}50%{opacity:.35}}\n.radio-text{color:var(--ink);font-size:15px;margin:0 0 6px}\n.radio-eta{color:var(--accent2);font-size:12px;margin:0 0 10px}\n.radio-report{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:11px;margin:0 0 12px}\n.rr-h{display:block;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}\n.radio-report p{color:var(--ink2);margin:0;font-size:14px}\n.radio-ask{width:100%;margin:0 0 10px;font-size:14px}\n.radio-go{width:100%}\n\n/* Game master panel */\n.gm-panel{background:#160F02;border:1px solid rgba(245,165,36,.35);border-radius:14px;margin:0 0 16px;overflow:hidden}\n.gm-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;\n  font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}\n.gm-caret{color:var(--mute);letter-spacing:0;text-transform:none;font-size:12px}\n.gm-body{padding:0 14px 14px}\n.gm-note{color:var(--ink2);font-size:13.5px;margin:0}\n.gm-wave{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:9px}\n.gm-wave:last-child{margin-bottom:0}\n.gm-wave-i{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}\n.gm-wave-n{font-weight:800;font-size:14px}.gm-wave-c{color:var(--mute);font-size:12px}\n.gm-wave-r{color:var(--ink2);font-size:12.5px;margin:0 0 10px}\n\n/* Vital signs panel */\n.vitals{margin:11px 0 3px;background:#050D15;border:1px solid var(--line);border-radius:11px;padding:11px}\n.vitals-h{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2);margin-bottom:8px}\n.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}\n.vrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 8px;border-radius:7px;background:var(--panel)}\n.vrow.flag{background:rgba(229,72,77,.14);border:1px solid rgba(229,72,77,.4)}\n.vk{font-size:11px;color:var(--mute)}\n.vv{font-size:13px;font-weight:700;color:var(--ink)}\n.vrow.flag .vv{color:#F3A9AC}\n/* Monitor-style vital signs (integrated from triage tagging mini-game) */\n.monitor{margin:11px 0 3px;background:#070A10;border:1px solid var(--line);border-radius:12px;overflow:hidden}\n.mon-h{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;background:#0A0E16;border-bottom:1px solid var(--line);user-select:none}\n.monitor.collapsed .mon-h{border-bottom:none}\n.mon-t{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2);flex:none}\n.mon-live{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#5C6980;flex:none}\n.mon-dot{width:6px;height:6px;border-radius:50%;background:#4ADE80;animation:monDot 1.1s ease-in-out infinite}\n@keyframes monDot{0%,100%{opacity:.35}50%{opacity:1}}\n.mon-x{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding-left:10px;flex:none}\n.mon-sum{margin-left:auto;font-size:11px;color:var(--ink2);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}\n.ecg{position:relative;height:52px;border-bottom:1px solid var(--line);overflow:hidden;background:linear-gradient(#080C14,#0A0F18)}\n.ecg .lead{position:absolute;left:10px;top:6px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#5C6980;z-index:2}\n.ecgTrack{position:absolute;inset:0;width:200%;height:100%;display:flex;animation-name:ecgScroll;animation-timing-function:linear;animation-iteration-count:infinite;will-change:transform}\n.ecgTrack.flat{animation:none}\n.ecgTrack svg{width:50%;height:100%}\n.ecgTrack path{fill:none;stroke:#4ADE80;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(74,222,128,.5))}\n.ecgTrack.flat path{stroke:#39435A;filter:none}\n@keyframes ecgScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}\n.mtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);padding:1px}\n@media (max-width:520px){.mtiles{grid-template-columns:repeat(2,1fr)}}\n.mtile{background:#0A0E16;padding:9px 10px;min-height:56px;display:flex;flex-direction:column;justify-content:space-between}\n.mtile.alarm{background:rgba(226,59,59,.12);box-shadow:inset 0 0 0 1px rgba(226,59,59,.5)}\n.mlab{display:flex;align-items:baseline;justify-content:space-between;gap:6px}\n.mname{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#94A2B8}\n.munit{font-size:9px;color:#5C6980}\n.mval{font-size:24px;font-weight:800;line-height:1;letter-spacing:.5px;color:var(--vc);margin-top:5px;font-variant-numeric:tabular-nums}\n.mtile.alarm .mval{color:#F3A9AC}\n.mchips{display:flex;flex-wrap:wrap;gap:6px;padding:9px 10px}\n.mchip{display:flex;align-items:center;gap:6px;background:#0A0E16;border:1px solid var(--line);border-radius:8px;padding:4px 8px}\n.mchip.bad{border-color:rgba(226,59,59,.5);background:rgba(226,59,59,.1)}\n.mchip .ck{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#5C6980}\n.mchip .cv{font-size:11.5px;font-weight:700;color:var(--ink)}\n.mchip.bad .cv{color:#F3A9AC}\n\n.assessing{margin:11px 0 3px;padding:11px;border-radius:10px;border:1px dashed var(--line2);background:var(--panel2);\n  text-align:center;color:var(--accent2);font-size:13px;font-weight:700}\n.ccard.intransit{opacity:.86;border-style:dashed}\n.lifebar-t.transit i{background:linear-gradient(90deg,#3A7FC4,#5FA8E0)}\n\n/* Dashboard */\n.db-card{margin-bottom:12px}\n.db-rows{display:flex;flex-direction:column;gap:5px;margin-top:6px}\n.db-row{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;border-radius:9px;background:var(--panel2);border:1px solid var(--line)}\n.db-code{font-size:13px;font-weight:700;letter-spacing:.04em}\n.db-t{font-size:12px;color:var(--ink2)}\n.db-empty{color:var(--mute);font-size:13px;margin:6px 0 0}\n.db-bad{font-size:11px;font-weight:700;color:#F3A9AC}\n.db-grey{font-size:11px;color:var(--mute)}\n\n/* Registration form */\n.form{display:flex;flex-direction:column;gap:11px;margin-top:6px}\n.fl{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:.02em}\n.fin{font:inherit;font-weight:400;font-size:15px;padding:11px;border-radius:10px;border:1px solid var(--line2);background:#050D15;color:var(--ink);outline:none}\n.fin:focus{border-color:var(--accent)}\n.who{display:flex;flex-direction:column;gap:7px}\n.who>div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}\n.who>div:last-child{border-bottom:none;padding-bottom:0}\n.who-k{color:var(--mute);font-size:13px}\n\n/* ============ Access gate + issue ============ */\n.access-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin:0 0 14px}\n.access-card p{color:var(--ink2);margin:0 0 12px} work{color:var(--accent2);border-color:rgba(46,198,216,.4)}\n\n/* cards get a faint console edge */\n.card,.block,.hero-card{box-shadow:inset 0 1px 0 rgba(255,255,255,.02), 0 6px 22px rgba(0,0,0,.28)}\n.ccard{box-shadow:0 4px 16px rgba(0,0,0,.26)}\n.bhd{border-bottom:1px solid var(--line)}\n\n/* neon triage tags */\n.tag2.t-red{box-shadow:0 0 9px rgba(242,74,79,.5)}\n.tag2.t-yellow{box-shadow:0 0 9px rgba(245,197,49,.4)}\n.tag2.t-green{box-shadow:0 0 9px rgba(55,208,126,.4)}\n\n/* neon triage picker */\n.tp-b{background:#0B1A23;border-width:1.5px;transition:box-shadow .15s,background .15s,border-color .15s}\n.tp-b.t-red{box-shadow:inset 0 0 18px rgba(242,74,79,.10),0 0 8px rgba(242,74,79,.18)}\n.tp-b.t-red b{color:#FF8E92}\n.tp-b.t-red:hover{background:rgba(242,74,79,.12);box-shadow:inset 0 0 22px rgba(242,74,79,.20),0 0 20px rgba(242,74,79,.5)}\n.tp-b.t-yellow{box-shadow:inset 0 0 18px rgba(245,197,49,.09),0 0 8px rgba(245,197,49,.15)}\n.tp-b.t-yellow b{color:#FBD65E}\n.tp-b.t-yellow:hover{background:rgba(245,197,49,.11);box-shadow:inset 0 0 22px rgba(245,197,49,.16),0 0 20px rgba(245,197,49,.42)}\n.tp-b.t-green{box-shadow:inset 0 0 18px rgba(55,208,126,.09),0 0 8px rgba(55,208,126,.15)}\n.tp-b.t-green b{color:#66E39B}\n.tp-b.t-green:hover{background:rgba(55,208,126,.11);box-shadow:inset 0 0 22px rgba(55,208,126,.16),0 0 20px rgba(55,208,126,.42)}\n.tp-b.t-black{border-color:#4A5568;box-shadow:inset 0 0 18px rgba(120,132,150,.08)}\n.tp-b.t-black b{color:#AEB8CC}\n.tp-b.t-black:hover{background:rgba(120,132,150,.14);box-shadow:0 0 14px rgba(120,132,150,.3)}\n\n/* logo as a framed hero banner (full image) */\n.logo-wrap{display:flex;justify-content:center;margin:2px 0 18px}\n.app-logo{width:100%;max-width:460px;height:auto;display:block;border-radius:16px;border:1px solid var(--line2);\n  box-shadow:0 12px 36px rgba(0,0,0,.5), 0 0 0 1px rgba(46,198,216,.10), 0 0 26px rgba(46,198,216,.12)}\n\n/* FIX 1: triage guide button stays pinned while scrolling the board */\n.guide-bar{position:sticky;top:0;z-index:25;margin:0 -20px 12px;padding:10px 20px;\n  background:rgba(7,14,20,.94);border-bottom:1px solid var(--line);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}\n.guide-bar .btn{box-shadow:0 0 14px rgba(46,198,216,.18)}\n\n/* FIX 2: solid, non-overlapping sticky header inside the guide overlay */\n.guide-card{padding-top:0}\n.guide-h{background:var(--panel);margin:0 -14px 10px;padding:14px 14px 10px;border-bottom:1px solid var(--line);\n  border-radius:16px 16px 0 0;z-index:3}\n\n/* Injury highlight on the 3D figure + per-card guide icon */\n.inj-halo{fill:rgba(255,86,58,.22);stroke:none;animation:injHalo 1.5s ease-in-out infinite}\n.inj-ring{fill:none;stroke:#FFFFFF;stroke-width:1.6;stroke-dasharray:4 3;animation:injMarch 1.5s linear infinite}\n@keyframes injHalo{0%,100%{opacity:.45}50%{opacity:.85}}\n@keyframes injMarch{to{stroke-dashoffset:-28}}\n.v3d-inj{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#FFC98A;margin:11px 0 2px}\n.inj-dot{width:9px;height:9px;border-radius:50%;border:2px solid #FFB454;flex:none}\n.card-guide{margin-left:auto;flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center;\n  border-radius:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--accent2);cursor:pointer;padding:0}\n.card-guide:hover{border-color:var(--accent);color:var(--accent)}\n.card-guide svg{width:15px;height:15px;display:block}\n\n\n/* START-critical vitals vs clinical context (visual split) */\n.mt-start{box-shadow:inset 0 2px 0 var(--accent)}\n.mt-start .mval{text-shadow:0 0 12px rgba(46,198,216,.22)}\n.mt-ctx{opacity:.5}\n.mt-tag{font-size:8px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#5C6980;border:1px solid #2A3E4C;border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:middle}\n.mon-fld{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent2);padding:9px 10px 0}\n.mon-legend{displ ex;align-items:center;justify-content:center;padding:18px;\n  background:rgba(56,86,96,.36);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}\n.ts-modal{width:100%;max-width:400px;max-height:84vh;overflow-y:auto;border:1px solid #B4C6CD;border-radius:16px;color:#3E5A66;\n  background:linear-gradient(180deg,#FCFEFE,#EDF3F5);box-shadow:0 22px 54px rgba(40,70,80,.4)}\n.ts-modal-h{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;\n  background:linear-gradient(180deg,#E7EEF1,#D6E1E6);border-bottom:1px solid #B4C6CD;border-radius:16px 16px 0 0}\n.ts-modal-t{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#5B93AD}\n.ts-modal-x{border:1px solid #A6BCC4;background:linear-gradient(180deg,#F7FBFC,#DAE4E8);color:#4E6B77;font:inherit;\n  font-size:12px;font-weight:700;border-radius:8px;padding:5px 12px;cursor:pointer}\n.ts-modal-x:hover{border-color:#6FB6CE;color:#3E5A66}\n.ts-modal-b{padding:16px}\n.ts-modal-b p{margin:0 0 12px;font-size:14px;line-height:1.6;color:#43606C}\n.ts-lead{font-size:11px !important;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#5B93AD !important;margin-bottom:10px !important}\n.ts-credit{font-size:13px !important;color:#557079 !important}\n.ts-disc{font-size:11.5px !important;color:#8AA3AE !important;margin-bottom:0 !important}\n.ts-feat{margin:0;padding-left:18px}\n.ts-feat li{font-size:13.5px;line-height:1.55;color:#43606C;margin-bottom:9px}\n.ts-feat li:last-child{margin-bottom:0}\n.ts-feat strong{color:#2E4C58}\n\n/* Incoming wave: blur inbound patients, keep the countdown readable */\n.ccard.intransit{position:relative}\n.ccard.intransit .ccard-top{filter:blur(4.5px);opacity:.78;pointer-events:none;transition:filter .35s ease,opacity .35s ease}\n.ccard.intransit .lifebar{position:relative;z-index:2}\n.ccard.intransit::after{content:\"Inbound\";position:absolute;top:10px;right:12px;z-index:3;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent2);background:rgba(46,198,216,.12);border:1px solid rgba(46,198,216,.4);border-radius:6px;padding:2px 7px}\n/* Feedback play-first prompt */\n.fbgate-overlay{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(6,13,20,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}\n.fbgate-card{max-width:360px;width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:22px 20px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}\n.fbgate-icon{width:44px;height:44px;margin:0 auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(46,198,216,.14);border:1px solid rgba(46,198,216,.45);color:var(--accent2);font-size:22px;font-weight:800}\n.fbgate-t{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:8px}\n.fbgate-msg{font-size:14px;line-height:1.55;color:var(--ink2);margin-bottom:16px}\n\n\n/* ===== Learn: guided course redesign ===== */\n.lp-bar{display:flex;align-items:center;margin:2px 0 18px}\n.lp-dot{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line2);background:var(--panel2);color:var(--mute);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s,background .2s,border-color .2s,color .2s;padding:0}\n.lp-dot.done{border-color:var(--accent);color:var(--accent2);background:rgba(46,198,216,.12)}\n.lp-dot.on{border-color:var(--accent);color:#05141a;background:var(--accent);box-shadow:0 0 14px rgba(46,198,216,.45);transform:scale(1.1)}\n.lp-line{flex:1;height:2px;background:var(--line2);min-width:5px}\n.lchap{display:flex;align-items:center;gap:13px;margin-bottom:14px;padding:14px 15px;border-radius:14px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--lac);box-shadow:0 6px 20px rgba(0,0,0,.25)}\n.lchap-ic{flex:none;width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--line2);color:var(--lac)}\n.lchap-ic svg{width:27px;height:27px;display:block}\n.lchap-tx{display:flex;flex-direction:column;gap:3px;min-width:0}\n.lchap-n{font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--lac)}\n.lchap-t{font-size:18px;font-weight:800;color:var(--ink);line-height:1.15}\n.lb-rich{counter-reset:flowc;padding:0}\n.lb-rich > p{color:var(--ink2);line-height:1.65;margin:0 0 13px;font-size:14.5px}\n.lb-rich strong{color:var(--ink)}\n.lb-rich .tag-legend{gap:9px;margin:8px 0 15px}\n.lb-rich .tl-row{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px 13px;align-items:center;gap:12px}\n.lb-rich .tl-row:has(.t-red){border-left:4px solid #F24A4F}\n.lb-rich .tl-row:has(.t-yellow){border-left:4px solid #F5C531}\n.lb-rich .tl-row:has(.t-green){border-left:4px solid #37D07E}\n.lb-rich .tl-row:has(.t-black){border-left:4px solid #5A6472}\n.lb-rich .tl-row > span:last-child{color:var(--ink2);font-size:13.5px;line-height:1.5}\n.lb-rich .flow-step{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px 14px 13px 46px;margin:0 0 13px;counter-increment:flowc}\n.lb-rich .flow-step::before{content:counter(flowc);position:absolute;left:12px;top:12px;width:24px;height:24px;border-radius:50%;background:var(--lac);color:#05141a;font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center;z-index:1}\n.lb-rich .flow-step:not(:last-of-type)::after{content:\"\";position:absolute;left:23px;bottom:-13px;width:2px;height:13px;background:var(--line2)}\n.lb-rich .flow-q{font-weight:700;color:var(--ink);margin-bottom:7px;font-size:14.5px;line-height:1.4}\n.lb-rich .flow-a{color:var(--ink2);font-size:13.5px;line-height:1.55}\n.lb-rich .flow-a .tag2{margin:0 1px}\n.lb-rich .qcheck{background:linear-gradient(135deg,rgba(46,198,216,.09),var(--panel2));border:1px solid rgba(46,198,216,.35);border-radius:11px;padding:13px 15px;margin-top:15px}\n.lb-rich .qcheck summary{cursor:pointer;font-weight:700;color:var(--accent2);list-style:none;display:flex;align-items:flex-start;gap:9px;font-size:14px;line-height:1.4}\n.lb-rich .qcheck summary::-webkit-details-marker{display:none}\n.lb-rich .qcheck summary::before{content:\"?\";flex:none;width:22px;height:22px;border-radius:50%;background:rgba(46,198,216,.18);border:1px solid rgba(46,198,216,.5);color:var(--accent2);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px;margin-top:1px}\n.lb-rich .qcheck[open] summary{margin-bottom:11px}\n.lb-rich .qcheck p{margin:0;color:var(--ink2);font-size:13.5px;line-height:1.55}\n.lnav{display:flex;gap:10px;margin-top:18px}\n.lnav .btn{flex:1}\n.sources{margin-top:16px}\n\n/* ================= Clinical light re-skin (title-art reference) ================= */\n:root{\n  --bg:#E3EBEE; --panel:#F7FAFB; --panel2:#E9F0F2; --panel3:#DCE6EA;\n  --line:#C4D3D9; --line2:#A7BDC6;\n  --ink:#23414D; --ink2:#3E5A66; --mute:#7B96A2;\n  --accent:#2F86A0; --accent2:#1D6A80;\n  --red:#CE3A3F; --yellow:#D0911A; --green:#1F9159; --grey:#71808C;\n  --slate:#2B3A41; --bevel:linear-gradient(180deg,#FCFEFE,#DCE6EA);\n}\nbody{\n  color:var(--ink);background-color:#E3EBEE;\n  background-image:\n    radial-gradient(1000px 560px at 50% -240px, rgba(255,255,255,.85), transparent 62%),\n    linear-gradient(170deg,#EFF4F6 0%,#E1E9EC 55%,#D5E0E4 100%);\n  background-attachment:fixed;\n}\nbody::before{opacity:1;\n  background-image:\n    repeating-linear-gradient(0deg, rgba(104,138,151,.07) 0 1px, transparent 1px 42px),\n    repeating-linear-gradient(90deg, rgba(104,138,151,.06) 0 1px, transparent 1px 42px)}\n::-webkit-scrollbar-thumb{background:#B4C7CE;border-color:#E3EBEE}\n::-webkit-scrollbar-thumb:hover{background:#93AEB9}\n\n/* surfaces */\n.card,.block,.hero-card,.access-card{background:linear-gradient(180deg,#FCFEFE,#EDF3F5);border-color:var(--line);\n  box-shadow:inset 0 1px 0 #fff,0 2px 6px rgba(70,100,112,.10)}\n.hero-card{background:linear-gradient(180deg,#F1F8FA,#DFEDF1);border-color:#9CC6D4}\n.card p,.hero-card p,.access-card p{color:var(--ink2)}\n.credit{background:linear-gradient(180deg,#F4F8F9,#E7EEF1)}\n.h1{color:#1F4A5A;text-shadow:0 1px 0 #fff}\n.lede,.steps-list li,.feat li{color:var(--ink2)}\n.disclaimer{color:var(--mute)}\n.eyebrow{color:var(--accent2)}\n.app-logo{border:none;box-shadow:none;filter:drop-shadow(0 3px 8px rgba(80,110,120,.18))}\n\n/* beveled controls */\n.btn{background:var(--bevel);border:1px solid #A6BCC4;color:#2A4B58;font-weight:800;\n  box-shadow:inset 0 1px 0 #fff,0 2px 5px rgba(80,110,120,.22)}\n.btn:hover{border-color:#6FA8BD;background:linear-gradient(180deg,#FFFFFF,#E4EDF0)}\n.btn:active{transform:translateY(1px);box-shadow:inset 0 2px 4px rgba(80,110,120,.25)}\n.btn-primary,.cbtn.primary,.tab.on,.rate-b.on,.lk-b.on{background:linear-gradient(180deg,#3E9CB6,#25718A);\n  border-color:#1F6D86;color:#FFFFFF;box-shadow:inset 0 1px 0 rgba(255,255,255,.32),0 2px 6px rgba(31,109,134,.32)}\n.btn-primary:hover{background:linear-gradient(180deg,#4BAAC4,#2A7C96);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 10px rgba(31,109,134,.4)}\n.btn-ghost{background:linear-gradient(180deg,#F2F7F9,#E2EBEE);color:#4E6B77}\n.linkbtn{color:var(--accent2)}\n.opt,.tog{background:var(--bevel);border-color:#B4C7CE;color:var(--ink);box-shadow:inset 0 1px 0 #fff}\n.opt:hover,.tog:hover{border-color:#6FA8BD}\n.opt.on,.tog.on{border-color:#2F86A0;background:linear-gradient(180deg,#E9F5F8,#D3E7ED);box-shadow:inset 0 0 0 1px rgba(47,134,160,.25)}\n.opt-d,.tog span{color:var(--ink2)}\n.hint.on{color:var(--accent2)}\n.seedin,.fin,.tin,.access-field{background:#FFFFFF;border-color:#B4C7CE;color:var(--ink);\n  box-shadow:inset 0 2px 4px rgba(90,120,132,.13)}\n.seedin:focus,.fin:focus,.tin:focus{border-color:#2F86A0}\n.fl,.tlbl{color:#54727E}\n\n/* board chrome */\n.bhd{background:linear-gradient(180deg,rgba(248,251,252,.96),rgba(233,240,242,.94));\n  border-bottom:2px solid #3E7C93;box-shadow:0 2px 10px rgba(70,100,112,.14)}\n.clock2{color:#1B6379;text-shadow:0 1px 0 #fff}\n.ic-btn,.tab,.gm-step,.step-b,.v3d-b,.v3d-x,.rate-b,.chip,.lk-b,.cbtn{background:var(--bevel);border-color:#A6BCC4;\n  color:#3B5C68;box-shadow:inset 0 1px 0 #fff}\n.ic-btn:hover,.cbtn:hover,.gm-step:hover,.step-b:hover,.v3d-b:hover,.v3d-x:hover{border-color:#2F86A0;color:#1B4B5B}\n.ic-btn{white-space:nowrap}\n.ic-btn.danger{color:#B3282D;border-color:rgba(206,58,63,.45)}\n.ic-btn.danger:hover{border-color:var(--red);color:#8E1F23}\n.res-i,.kpi{background:linear-gradient(180deg,#FCFEFE,#EAF1F3);border-color:var(--line);box-shadow:inset 0 1px 0 #fff}\n.res-v.ok,.endrow-v.ok{color:#17804C}.res-v.bad,.endrow-v.bad{color:#C22C31}\n.kv{color:#1F4A5A}\n.bsec-n{background:#E9F0F2;border-color:var(--line);color:#4E6B77}\n.guide-bar{background:linear-gradient(180deg,rgba(248,251,252,.96),rgba(233,240,242,.94));border-bottom-color:#B9CBD2}\n.guide-bar .btn{box-shadow:inset 0 1px 0 #fff,0 2px 5px rgba(80,110,120,.22)}\n\n/* casualty cards */\n.ccard{background:linear-gradient(180deg,#FCFEFE,#EFF4F6);border-color:var(--line);box-shadow:0 2px 6px rgba(70,100,112,.10)}\n.ccard.died{border-color:rgba(206,58,63,.5)}\n.ch-tag,.fig3d-badge{background:#2F86A0;color:#fff}\n.sign-l{color:#54727E}\n.stchip{background:#EDF3F5;border-color:var(--line);color:#4E6B77}\n.stchip.ok{color:#17804C;border-color:rgba(31,145,89,.45)}\n.stchip.bad{color:#C22C31;border-color:rgba(206,58,63,.45)}\n.stchip.work{color:#1D6A80;border-color:rgba(47,134,160,.5)}\n.lifebar-t{background:#D6E1E6;border-color:#BCCCD3}\n.lifebar-t.red + .lifebar-l{color:#C22C31}\n.ccard-warn{background:rgba(206,58,63,.10);border-color:rgba(206,58,63,.5);color:#B3282D}\n.warn-dot{background:#CE3A3F}\n.ccard.intransit::after{color:#1D6A80;background:#E4F1F5;border-color:rgba(47,134,160,.45)}\n.assessing{background:#EAF4F7;border-color:#9CC6D4;color:#1D6A80}\n.card-guide{background:var(--bevel);border-color:#A6BCC4;color:#1D6A80}\n.card-guide:hover{border-color:#2F86A0;color:#155A6E}\n\n/* triage tags + picker */\n.tag2{box-shadow:none}\n.tag2.t-red{background:#CE3A3F;color:#fff}.tag2.t-yellow{background:#E0A31C;color:#2A1D00}\n.tag2.t-green{background:#1F9159;color:#fff}.tag2.t-black{background:#4C5866;color:#fff}\n.tp-b{background:linear-gradient(180deg,#FCFEFE,#E9F0F2);color:var(--ink);box-shadow:inset 0 1px 0 #fff,0 2px 5px rgba(80,110,120,.18)}\n.tp-b span{color:#5D7A86}\n.tp-b.t-red{border-color:#CE3A3F}.tp-b.t-red b{color:#B3282D}\n.tp-b.t-red:hover{background:linear-gradient(180deg,#FEF1F1,#F7DEDF);box-shadow:inset 0 1px 0 #fff,0 0 0 2px rgba(206,58,63,.28)}\n.tp-b.t-yellow{border-color:#D0911A}.tp-b.t-yellow b{color:#9A6A0C}\n.tp-b.t-yellow:hover{background:linear-gradient(180deg,#FEF8EA,#F6E9CC);box-shadow:inset 0 1px 0 #fff,0 0 0 2px rgba(208,145,26,.28)}\n.tp-b.t-green{border-color:#1F9159}.tp-b.t-green b{color:#177246}\n.tp-b.t-green:hover{background:linear-gradient(180deg,#EFFAF4,#D9EFE4);box-shadow:inset 0 1px 0 #fff,0 0 0 2px rgba(31,145,89,.28)}\n.tp-b.t-black{border-color:#7B8794}.tp-b.t-black b{color:#4C5866}\n.tp-b.t-black:hover{background:linear-gradient(180deg,#F4F6F8,#E0E5EA);box-shadow:inset 0 1px 0 #fff,0 0 0 2px rgba(123,135,148,.28)}\n\n/* radio + game master */\n.radio-card{background:linear-gradient(180deg,#F3FBF7,#E3F0E9);border-color:rgba(31,145,89,.45);box-shadow:0 12px 32px rgba(60,90,100,.22)}\n.radio-h{color:#17804C}.radio-dot{box-shadow:0 0 8px rgba(31,145,89,.6)}\n.radio-text{color:var(--ink)}.radio-eta{color:#1D6A80}\n.radio-report{background:rgba(255,255,255,.72);border-color:var(--line)}\n.radio-report p{color:var(--ink2)}\n.gm-panel{background:linear-gradient(180deg,#F3F9FB,#E6F0F3);border-color:rgba(47,134,160,.42)}\n.gm-h{color:var(--accent2)}\n.gm-wave{background:#FFFFFF;border-color:var(--line)}\n.gm-note,.gm-wave-r{color:var(--ink2)}\n.gm-res-l,.set-l,.db-code,.err-code{color:var(--ink)}\n.gm-body .gm-sub:not(:first-child){border-top-color:var(--line)}\n.setrow{border-top-color:var(--line)}\n\n/* vitals (monitor stays a dark device screen) */\n.vitals{background:#FFFFFF;border-color:var(--line)}\n.vitals-h{color:var(--accent2)}\n.vrow{background:#EFF4F6}\n.vrow.flag{background:rgba(206,58,63,.10);border-color:rgba(206,58,63,.4)}\n.vv{color:var(--ink)}.vrow.flag .vv{color:#B3282D}\n.monitor{border-color:#8FA6AE;box-shadow:0 3px 12px rgba(60,90,100,.26)}\n\n/* report + dashboard */\n.rep-line,.seedbig{color:var(--accent2)}\n.endrow{border-bottom-color:var(--line)}\n.endrow-l{color:var(--ink2)}\n.errrow,.db-row,.rchip{background:#F3F8F9;border-color:var(--line)}\n.errrow.under{background:rgba(206,58,63,.07);border-color:rgba(206,58,63,.45)}\n.err-dir.bad,.db-bad,.rchip.r-died,.err-line,.access-err{color:#B3282D}\n.rchip{color:#4E6B77}\n.db-t{color:var(--ink2)}\n.who>div,.cred-row{border-bottom-color:var(--line)}\n.cred-name,.cred-inst{color:var(--ink)}\n.issued{background:#F1FBF5;border-color:rgba(31,145,89,.45)}\n.issued-code,.signed-in{color:#17804C}\n.issued-exp{color:var(--ink2)}\n.mem-card{background:#F5FAFB;border-color:var(--line)}\n.mem-card.dragging{background:#FFFFFF;border-color:#2F86A0;box-shadow:0 14px 34px rgba(60,90,100,.28)}\n.mem-placeholder{border-color:#2F86A0;background:rgba(47,134,160,.08)}\n.mem-n{color:var(--accent2)}\n.mem-grip:hover{background:#E9F0F2;color:#4E6B77}\n\n/* feedback */\n.chip.on{background:linear-gradient(180deg,#E9F5F8,#D3E7ED);border-color:#2F86A0;color:#1D6A80}\n.lk-q{color:var(--ink)}.lk-row{border-top-color:var(--line)}\n.lk-b:hover{border-color:#2F86A0}\n\n/* learn */\n.lesson-t,.flow-q,.lchap-t,.gtag b,.guide-why b,.lb-rich strong{color:var(--ink)}\n.lesson-body p,.flow-a,.tl-row span:last-child,.lb-rich > p,.lb-rich .flow-a,.ref,.guide-steps li,.guide-why{color:var(--ink2)}\n.flow-step,.lb-rich .flow-step{background:#F5FAFB;border-col function(a){ return a.correctTag===tag; }); }\n\n/* ---------- START / JumpSTART evaluation from measured vitals ---------- */\nfunction startEvaluate(v){\n  if (v.ambulatory) return { tag:'GREEN', reason:'Able to get up and walk, which clears them as minor at the first step of the sort.' };\n  if (!v.breathing){\n    if (v.child){\n      if (v.breathesAfterAirway) return { tag:'RED', reason:'A child who is not breathing but breathes once you open the airway is immediate under JumpSTART.' };\n      return { tag:'BLACK', reason:'A child with no breathing after opening the airway and rescue breaths is deceased under JumpSTART.' };\n    }\n    if (v.breathesAfterAirway) return { tag:'RED', reason:'Not breathing until the airway is opened, then breathing returns. That is immediate.' };\n    return { tag:'BLACK', reason:'Not breathing, and still no breathing after the airway is opened. Deceased.' };\n  }\n  if (v.child){\n    if (v.rr < 15 || v.rr > 45) return { tag:'RED', reason:'A child breathing rate outside fifteen to forty five per minute is immediate under JumpSTART.' };\n    if (!v.radialPulse) return { tag:'RED', reason:'No palpable pulse. Immediate.' };\n    if (!v.obeys) return { tag:'RED', reason:'The child does not respond appropriately, which fails the mental status check. Immediate.' };\n    return { tag:'YELLOW', reason:'Breathing in range, a pulse present, and responding. Delayed.' };\n  }\n  if (v.rr > 30) return { tag:'RED', reason:'Breathing faster than thirty per minute is immediate under START on its own.' };\n  if (!v.radialPulse || v.crt > 2) return { tag:'RED', reason:'Perfusion fails, a weak or absent radial pulse or capillary refill over two seconds. Immediate.' };\n  if (!v.obeys) return { tag:'RED', reason:'Cannot follow a simple command, which fails the mental status check. Immediate.' };\n  return { tag:'YELLOW', reason:'Breathing thirty or under, perfusion intact, and following commands. Delayed.' };\n}\n\n/* Sample a set of vitals from an archetype envelope. */\nfunction sampleVitals(rng, a){\n  return {\n    rr: ri(rng, a.env.rr[0], a.env.rr[1]),\n    hr: ri(rng, a.env.hr[0], a.env.hr[1]),\n    sbp: ri(rng, a.env.sbp[0], a.env.sbp[1]),\n    spo2: ri(rng, a.env.spo2[0], a.env.spo2[1]),\n    crt: ri(rng, a.env.crt[0], a.env.crt[1]),\n    gcs: ri(rng, a.env.gcs[0], a.env.gcs[1]),\n    avpu: a.avpu,\n    ambulatory: a.ambulatory, breathing: a.breathing,\n    breathesAfterAirway: a.breathesAfterAirway, radialPulse: a.radialPulse,\n    obeys: a.obeys, child: a.child\n  };\n}\n\n/* ---------- Modes and scales ---------- */\nvar MODES = {\n  medical: { key:'medical', name:'Triage and medical area',\n    blurb:'Casualties are brought to you by search and rescue. Assess, treat to hold them, and move them to hospital.',\n    echelon:'hospital', deliverVerb:'Send to hospital', transitSec:45, roundtripSec:95,\n    allowTreat:true, arrivals:true },\n  sar: { key:'sar', name:'On scene with search and rescue',\n    blurb:'You are triaging at the point of rescue. No time to treat. Sort fast and get people moved to the safe area.',\n    echelon:'safe area', deliverVerb:'Evacuate to safety', transitSec:25, roundtripSec:55,\n    allowTreat:false, arrivals:false }\n};\nvar SCALES = {\n  small:    { key:'small', name:'Bus crash', count:8,  teams:2, units:2, waves:1 },\n  standard: { key:'standard', name:'Building collapse', count:12, teams:3, units:3, waves:2 },\n  large:    { key:'large', name:'Transport disaster', count:18, teams:3, units:4, waves:3 },\n  mass:     { key:'mass', name:'Stadium crush', count:24, teams:4, units:5, waves:4 }\n};\nvar SCALE_ORDER = ['small','standard','large','mass'];\n\nvar ASSESS_SEC = 8;    // time to take a set of vitals on one casualty\nvar TREAT_SEC = 30;\n\nfunction survivalFor(rng, tag, child){\n  if (tag === 'RED')    return child ? ri(rng,90,150) : ri(rng,130,240);\n  if (tag === 'YELLOW') return ri(rng,460,820);\n  return null;\n}\n\n/* Realistic category mix. */\nfunction pickRoster(rng, n){\n  var want = {\n    RED: Math.max(1, Math.round(n*0.28)),\n    BLACK: Math.max(1, Math.round(n*0.10)),\n    GREEN: Math.round(n*0.34)\n  };\n  want.YELLOW = n - want.RED - want.BLACK - want.GREEN;\n  if (want.YELLOW < 1){ want.YELLOW = 1; want.GREEN = n - want.RED - want.BLACK - want.YELLOW; }\n  var chosen = [];\n  ['RED','YELLOW','GREEN','BLACK'].forEach(function(tag){\n    var bag = archByTag(tag).slice();\n    for (var i=0;i<want[tag];i++){\n      if (bag.length === 0) bag = archByTag(tag).slice();       // refill if we need more than the variety\n      var idx = Math.floor(rng()*bag.length);\n      chosen.push(bag[idx]);\n      bag.splice(idx,1);                                        // prefer distinct archetypes first\n    }\n  });\n  // deterministic shuffle so categories interleave\n  for (var j=chosen.length-1;j>0;j--){ var k = Math.floor(rng()*(j+1)); var t=chosen[j]; chosen[j]=chosen[k]; chosen[k]=t; }\n  return chosen;\n}\n\n/* Coded, pseudonymous callsign per casualty. */\nfunction codenames(rng, n){\n  var used = {}, out = [];\n  for (var i=0;i<n;i++){\n    var name;\n    do { name = PHON[Math.floor(rng()*PHON.length)] + '-' + ri(rng,10,99); } while (used[name]);\n    used[name] = true; out.push(name);\n  }\n  return out;\n}\n\n/* Gross observed injury summary for a wave, the kind of report SAR would radio in. */\nfunction injuryReport(cids, cas){\n  var list = cids.map(function(id){ return cas[id-1]; });\n  var walk = list.filter(function(c){ return c.vitals.ambulatory; }).length;\n  var apnea = list.filter(function(c){ return c.signs.indexOf('apnea')>=0; }).length;\n  var bleed = list.filter(function(c){ return c.signs.indexOf('bleed')>=0 || c.signs.indexOf('wound')>=0; }).length;\n  var burn = list.filter(function(c){ return c.signs.indexOf('burn')>=0; }).length;\n  var frac = list.filter(function(c){ return c.signs.indexOf('fracture')>=0; }).length;\n  var chest = list.filter(function(c){ return c.signs.indexOf('chest')>=0 || c.signs.indexOf('head')>=0 || c.signs.indexOf('abdomen')>=0; }).length;\n  var parts = [];\n  parts.push(list.length + ' casualties');\n  if (walk) parts.push(walk + ' walking');\n  if (bleed) parts.push(bleed + ' with heavy bleeding');\n  if (apnea) parts.push(apnea + ' not breathing or unresponsive');\n  if (burn) parts.push(burn + ' with burns');\n  if (frac) parts.push(frac + ' with obvious fractures');\n  if (chest) parts.push(chest + ' with chest, head or belly injuries');\n  return 'SAR reports about ' + parts.join(', ') + '.';\n}\n\n/* ---------- Build an incident ---------- */\nfunction makeIncident(seedCode, scaleKey, modeKey, supervised, team, opts){\n  var sc = SCALES[scaleKey] || SCALES.standard;\n  opts = opts || {};\n  var pmode = opts.practiceMode || 'expert';\n  var guided = pmode === 'guided';\n  var eff = { count: sc.count, teams: sc.teams, units: sc.units, waves: sc.waves };\n  if (pmode === 'custom' && opts.custom){\n    eff.teams = Math.max(0, Math.min(12, opts.custom.teams|0));\n    eff.units = Math.max(1, Math.min(12, opts.custom.units|0));\n    eff.waves = Math.max(1, Math.min(8, opts.custom.waves|0));\n  }\n  var glimit = Math.max(1, Math.min(eff.count, (opts.guidedLimit|0) || 3));\n  var md = MODES[modeKey] || MODES.medical;\n  var rng = mulberry32(hashSeed(seedCode + '::' + sc.key + '::' + md.key));\n  var archs = pickRoster(rng, eff.count);\n  var codes = codenames(rng, eff.count);\n  var cas = archs.map(function(a, idx){\n    var v = sampleVitals(rng, a);\n    return {\n      cid: idx+1, code: codes[idx], arch: a.id, label: a.label, person: a.person,\n      signs: a.signs, child: a.child, need: a.need,\n      trueTag: a.correctTag, playerTag: null,\n      vitals: v, assessed:false, assessDoneAt:null,\n      status:'hidden',                    // hidden until its wave is dispatched\n      clock: survivalFor(rng, a.correctTag, a.child), clock0:null,\n      stabilized:false, deliveredAt:null, diedAt:null, triagedAt:null, wave:0\n    };\n  });\n  cas.forEach(function(c){ c.clock0 = c.clock; });\n\n  // partition into waves\n  var nWaves;\n  if (guided){ nWaves = 1; }\n  else { nWaves = md.arrivals ? eff.waves : (supervised ? eff.waves : 1); if (!md.arrivals && !supervised) nWaves = 1; }\n  var waves = [];\n  var per = Math.ceil(cas.length / nWaves);\n  for (var w=0; w<nWaves; w++){\n    var slice = cas.slice(w*per, (w+1)*per);\n    slice.forEach(function(c){ c.wave = w; });\n    waves.push({\n      idx:w, at: w*55,                        // later waves arrive on these clock marks when unsupervised\n      cids: slice.map(function(c){ return c.cid; }),\n      dispatched:false, reportShown:false\n    });\n  }\n\n  var S = {\n    seed:seedCode, scale:sc.key, scaleName:sc.name, mode:md.key, modeName:md.name,\n    supervised:!!supervised, team:!!team,\n    echelon:md.echelon, deliverVerb:md.deliverVerb, transitSec:md.transitSec,\n    roundtripSec:md.roundtripSec, allowTreat:md.allowTreat, arrivals:md.arrivals,\n    t:0, running:false, done:false,\n    teamsTotal: md.allowTreat ? eff.teams : 0, teamsFree: md.allowTreat ? eff.teams : 0,\n    unitsTotal: eff.units, unitsFree: eff.units,\n    guided: guided, guidedLimit: glimit,\n    cas:cas, waves:waves, assessments:[], treatments:[], transports:[],\n    pendingTeamRemove:0, pendingUnitRemove:0,\n    radio:null, events:[], participant:null\n  };\n\n  // wave 0 is the initial load, already at the scene, with an opening report\n  waves[0].dispatched = true;\n  if (guided){\n    var firstN = cas.slice(0, glimit);\n    firstN.forEach(function(c){ c.status = 'scene'; });\n    S.radio = { kind:'initial', at:0, n:firstN.length, wave:0, eta:0,\n      text: 'Guided practice. ' + firstN.length + ' casualt' + (firstN.length===1?'y is':'ies are') + ' with you. Work each one, and the next is brought in as you go.',\n      report: injuryReport(firstN.map(function(c){ return c.cid; }), cas), reportShown:false };\n  } else {\n    waves[0].cids.forEach(function(id){ cas[id-1].status = 'scene'; });\n    S.radio = { kind:'initial', at:0, n:waves[0].cids.length, wave:0, eta:0,\n      text: (md.arrivals\n        ? 'First casualties are with you at the medical area now, ' + waves[0].cids.length + ' of them.'\n        : 'First sector searched. ' + waves[0].cids.length + ' casualties located and ready for triage.'),\n      report: injuryReport(waves[0].cids, cas), reportShown:false };\n  }\n\n  return S;\n}\n\nfunction byId(S, cid){ for (var i=0;i<S.cas.length;i++){ if (S.cas[i].cid===cid) return S.cas[i]; } return null; }\nfunction logEvent(S, text){ S.events.push({ t: Math.round(S.t), text: text }); if (S.events.length>80) S.events.shift(); }\n\n/* Reveal a wave: casualties appear, in transit for medical, on scene for SAR. */\nfunction dispatchWave(S, idx){\n  var wv = S.waves[idx]; if (!wv || wv.dispatched) return false;\n  wv.dispatched = true;\n  var incoming = wv.cids.map(function(id){ return byId(S,id); });\n  if (S.arrivals){\n    incoming.forEach(function(c){ c.status = 'transit'; c.transitDoneAt = S.t + S.transitSec; });\n    S.radio = { kind:'incoming', at:Math.round(S.t), n:incoming.length, wave:idx,\n      eta:S.transitSec, text:'SAR to Medical. We are sending you ' + incoming.length + ' casualties. Time out about ' + S.transitSec + ' seconds.', report:injuryReport(wv.cids, S.cas), reportShown:false };\n  } else {\n    incoming.forEach(function(c){ c.status = 'scene'; });\n    S.radio = { kind:'found', at:Math.round(S.t), n:incoming.length, wave:idx,\n      eta:0, text:'Sector cleared. ' + incoming.length + ' casualties located and ready for triage.', report:injuryReport(wv.cids, S.cas), reportShown:false };\n  }\n  logEvent(S, 'Wave ' + (idx+1) + ' dispatched, ' + incoming.length + ' casualties.');\n  return true;\n}\nfunction revealReport(S){ if (S.radio) S.radio.reportShown = true; }\nfunction dismissRadio(S){ S.radio = null; }\n\n/* ---------- The one true clock ---------- */\nfunction stepSim(S, dt){\n  if (S.done) return S;\n  S.t += dt;\n\n  // unsupervised auto dispatch by scheduled time\n  if (!S.supervised){\n    S.waves.forEach(function(wv){ if (!wv.dispatched && wv.at != null && S.t >= wv.at) dispatchWave(S, wv.idx); });\n  }\n\n  // transit arrivals (medical): when SAR lands, prompt and reveal\n  var justArrived = [];\n  S.cas.forEach(function(c){\n    if (c.status === 'transit' && c.transitDoneAt != null && S.t >= c.transitDoneAt){\n      c.status = 'scene'; justArrived.push(c);\n      logEvent(S, c.code + ' arrived at the medical area.');\n    }\n  });\n  if (justArrived.length && !S.radio){\n    S.radio = { kind:'arrived', at:Math.round(S.t), n:justArrived.length, eta:0,\n      text:'Search and rescue has arrived with ' + justArrived.length + ' casualt' + (justArrived.length===1?'y':'ies') + '. They are on scene now and ready for triage.',\n      report:'', reportShown:true };\n  }\n\n  // deterioration for exposed casualties on scene or waiting\n  S.cas.forEach(function(c){\n    if ((c.status === 'scene' || c.status === 'waiting') && c.clock != null){\n      c.clock -= dt;\n      if (c.clock <= 0){ c.clock = 0; c.status='deceased'; c.outcome='died'; c.diedAt=Math.round(S.t);\n        logEvent(S, c.code + ' died waiting.'); }\n    }\n  });\n\n  // guided practice: top up the active set and flag deteriorating reds and yellows\n  if (S.guided){\n    var activeN = 0, hiddenList = [];\n    S.cas.forEach(function(c){ if (c.status==='scene'||c.status==='waiting') activeN++; else if (c.status==='hidden') hiddenList.push(c); });\n    for (var gi=0; gi<hiddenList.length && activeN<S.guidedLimit; gi++){ hiddenList[gi].status='scene'; activeN++; logEvent(S, hiddenList[gi].code + ' brought in.'); }\n    S.cas.forEach(function(c){\n      if ((c.status==='scene'||c.status==='waiting') && c.clock!=null && c.clock0 && (c.trueTag==='RED'||c.trueTag==='YELLOW') && (c.clock/c.clock0)<=0.4 && !c.complication){\n        c.complication = true; S.complicationPing = true; logEvent(S, c.code + ' is deteriorating, act now.');\n      }\n    });\n  }\n  // assessments complete\n  S.assessments = S.assessments.filter(function(as){\n    if (as.doneAt <= S.t){ var c = byId(S, as.cid); if (c && !c.assessed){ c.assessed = true; logEvent(S, c.code + ' assessed, vitals in.'); } return false; }\n    return true;\n  });\n\n  // treatments complete\n  S.treatments = S.treatments.filter(function(tr){\n    if (tr.endsAt <= S.t){ var c = byId(S, tr.cid); if (c && c.status==='treating'){ c.status='stable'; c.stabilized=true; logEvent(S, c.code + ' stabilized.'); }\n      if (S.pendingTeamRemove > 0){ S.pendingTeamRemove--; S.teamsTotal = Math.max(0, S.teamsTotal-1); }\n      else S.teamsFree++;\n      return false; }\n    return true;\n  });\n\n  // transports: arrival at echelon, then the unit returns\n  S.transports.forEach(function(tp){\n    if (!tp.arrived && tp.arrivesAt <= S.t){ tp.arrived = true; var c = byId(S, tp.cid);\n      if (c){ c.status='delivered'; c.outcome='survived'; c.deliveredAt=Math.round(S.t); logEvent(S, c.code + ' reached the ' + S.echelon + '.'); } }\n  });\n  S.transports = S.transports.filter(function(tp){ if (tp.returnsAt <= S.t){\n    if (S.pendingUnitRemove > 0){ S.pendingUnitRemove--; S.unitsTotal = Math.max(0, S.unitsTotal-1); }\n    else S.unitsFree++;\n    return false; } return true; });\n\n  // end when everything visible is resolved and all waves are out\n  var allOut = S.waves.every(function(wv){ return wv.dispatched; });\n  var noneHidden = S.cas.every(function(c){ return c.status !== 'hidden'; });\n  var settled = S.cas.every(function(c){ return c.status==='delivered' || c.status==='discharged' || c.status==='deceased'; });\n  if (allOut && noneHidden && settled){ S.done = true; S.running = false; }\n  return S;\n}\n\n/* ---------- Actions ---------- */\nfunction actAssess(S, cid){\n  var c = byId(S, cid); if (!c || c.status !== 'scene' || c.assessed) return false;\n  if (S.assessments.some(function(a){ return a.cid===cid; })) return false;\n
