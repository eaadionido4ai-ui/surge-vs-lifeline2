<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Surge vs. Lifeline (Self-Study)</title>
<meta name="description" content="Surge vs. Lifeline, an offline disaster triage decision simulation with vital signs, wave arrivals, and pseudonymized accountability.">
<style>
/* Major Incident Exercise. Suite navy base, ISO tag colors, amber command accent. */
:root{
  --bg:#08131E; --panel:#10222F; --panel2:#16303F; --panel3:#1D3D50;
  --line:#234456; --line2:#2E566B;
  --ink:#E8F1F6; --ink2:#BDD2DE; --mute:#7D9AAB;
  --accent:#F5A524; --accent2:#FBC46A;
  --red:#E5484D; --yellow:#F5B325; --green:#35B673; --grey:#8891A8;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 520px at 50% -180px, rgba(245,165,36,.13), transparent 70%)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding:26px 20px 96px}
.board-wrap{padding-top:0}
.h1{font-family:var(--serif);font-size:clamp(26px,6vw,34px);font-weight:600;line-height:1.1;margin:6px 0 8px}
.lede{font-size:16px;color:var(--ink2);margin:0 0 20px;max-width:56ch}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.card,.hero-card,.block{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 14px}
.hero-card{background:linear-gradient(180deg,rgba(245,165,36,.08),rgba(245,165,36,.02));border-color:rgba(245,165,36,.35)}
.card p,.hero-card p{color:var(--ink2);margin:0 0 10px}.card p:last-child,.hero-card p:last-child{margin-bottom:0}
.muted{color:var(--mute)} .small{font-size:13px} .strong{color:var(--ink);font-weight:700}
.credit{background:#050D15}
.steps-list{margin:0;padding-left:20px} .steps-list li{color:var(--ink2);margin-bottom:9px;padding-left:4px}
.steps-list li:last-child{margin-bottom:0}
.disclaimer{font-size:12.5px;color:var(--mute);text-align:center;margin:18px 8px 0;line-height:1.5}

.btn{font:inherit;font-weight:700;border-radius:11px;padding:12px 18px;border:1px solid var(--line2);
  background:var(--panel2);color:var(--ink);cursor:pointer;transition:border-color .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#180E02}
.btn-primary:hover{background:var(--accent2)}
.btn-lg{padding:14px 24px;font-size:16px}
.btn-ghost{background:transparent}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 0}

.block .eyebrow{margin-bottom:12px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;flex-direction:column;gap:3px;text-align:left;padding:15px;border-radius:13px;
  border:1px solid var(--line2);background:var(--panel2);color:var(--ink);cursor:pointer;transition:border-color .15s}
.opt:hover{border-color:var(--accent)} .opt.on{border-color:var(--accent);background:rgba(245,165,36,.12)}
.opt-n{font-weight:700;font-size:16px} .opt-d{font-size:13.5px;color:var(--ink2)}
.opt-meta{font-size:12px;color:var(--mute);margin-top:3px;font-family:var(--mono)}
.hint{font-size:13px;color:var(--mute);margin:10px 0 0}
.seedrow{display:flex;gap:9px}
.seedin{flex:1;font:inherit;font-family:var(--mono);font-size:18px;letter-spacing:.22em;text-transform:uppercase;
  text-align:center;padding:12px;border-radius:11px;border:1px solid var(--line2);background:#050D15;color:var(--ink);outline:none}
.seedin:focus{border-color:var(--accent)}

/* ---- Board header ---- */
.bhd{position:sticky;top:0;z-index:20;background:rgba(8,19,30,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:12px 16px;margin:0 -20px 14px}
.bhd-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.clock2{font-family:var(--mono);font-size:26px;font-weight:800;color:var(--accent2);font-variant-numeric:tabular-nums}
.bhd-ctrl{display:flex;gap:7px}
.ic-btn{font:inherit;font-size:13px;font-weight:700;padding:8px 13px;border-radius:9px;border:1px solid var(--line2);
  background:var(--panel2);color:var(--ink2);cursor:pointer}
.ic-btn:hover{border-color:var(--accent);color:var(--ink)}
.ic-btn.danger{color:#F3A9AC;border-color:rgba(229,72,77,.4)}
.ic-btn.danger:hover{border-color:var(--red);color:#fff}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.res-i{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center}
.res-v{display:block;font-size:19px;font-weight:800} .res-v.ok{color:var(--green)} .res-v.bad{color:var(--red)}
.res-k{display:block;font-size:9.5px;color:var(--mute);letter-spacing:.05em;text-transform:uppercase;margin-top:2px}

/* ---- Board sections + cards ---- */
.bsec{margin:0 0 16px}
.bsec-h{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:800;
  letter-spacing:.13em;text-transform:uppercase;color:var(--mute);margin-bottom:9px}
.bsec-n{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--ink2)}
.bsec-note{font-size:12.5px;color:var(--mute);margin:0 0 10px}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:9px}
.ccard.resolved{opacity:.72;padding:10px 13px}
.ccard.died{border-color:rgba(229,72,77,.45)}
.ccard-top{display:flex;gap:11px;align-items:flex-start}
.ccard-fig{position:relative;flex:none;width:78px}
.fig{width:100%;height:auto;display:block}
.ch-tag{position:absolute;top:-4px;left:2px;font-size:8px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:#180E02;background:var(--accent2);border-radius:99px;padding:1px 6px}
.ccard-info{flex:1;min-width:0}
.ccard-h{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.ccard-id{font-size:12px;color:var(--mute)}
.ccard-label{font-weight:700;font-size:15px;margin:0}
.ccard-person{font-size:12.5px;color:var(--mute);margin:1px 0 0}
.ccard-signs{flex:none;display:flex;flex-direction:column;gap:6px}
.sign-chip{display:flex;flex-direction:column;align-items:center;gap:2px;width:52px}
.sign{width:34px;height:34px;display:block}
.sign-l{font-size:9px;color:var(--ink2);text-align:center;line-height:1.2}

.tag2{font-size:10px;font-weight:800;letter-spacing:.06em;padding:2px 8px;border-radius:99px}
.t-red{background:var(--red);color:#fff}.t-yellow{background:var(--yellow);color:#0A0A0A}
.t-green{background:var(--green);color:#04180E}.t-black{background:#41485C;color:#fff}

.lifebar{display:flex;align-items:center;gap:9px;margin:11px 0 3px}
.lifebar-t{flex:1;height:8px;border-radius:99px;background:#0A1A24;overflow:hidden;border:1px solid var(--line)}
.lifebar-t i{display:block;height:100%;border-radius:99px;transition:width .5s linear}
.lifebar-t.red i{background:linear-gradient(90deg,#E5484D,#F5883A)}
.lifebar-t.amber i{background:var(--yellow)}
.lifebar-t.held i{background:var(--grey)}
.lifebar-l{font-size:11px;font-family:var(--mono);color:var(--mute);white-space:nowrap}
.lifebar-t.red + .lifebar-l{color:#F3A9AC}

.stchip{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;margin-top:6px;
  background:var(--panel2);border:1px solid var(--line)}
.stchip.ok{color:var(--green);border-color:rgba(53,182,115,.4)}
.stchip.bad{color:var(--red);border-color:rgba(229,72,77,.4)}
.stchip.grey{color:var(--mute)} .stchip.work{color:var(--accent2);border-color:rgba(245,165,36,.4)}

.cactions{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.cbtn{flex:1 1 auto;min-width:120px;font:inherit;font-size:13.5px;font-weight:700;padding:11px;border-radius:10px;
  border:1px solid var(--line2);background:var(--panel2);color:var(--ink);cursor:pointer;transition:border-color .12s}
.cbtn:hover{border-color:var(--accent)}
.cbtn.primary{background:var(--accent);border-color:var(--accent);color:#180E02}
.cbtn.off,.cbtn[disabled]{opacity:.4;cursor:not-allowed}
.cbtn.off:hover{border-color:var(--line2)}

.tagpick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:11px}
.tp-b{font:inherit;display:flex;flex-direction:column;align-items:center;gap:1px;padding:11px;border-radius:10px;
  border:2px solid;background:var(--panel2);cursor:pointer;color:var(--ink)}
.tp-b b{font-size:14px;letter-spacing:.05em}.tp-b span{font-size:11px;color:var(--ink2)}
.tp-b.t-red{border-color:var(--red)}.tp-b.t-red:hover{background:rgba(229,72,77,.15)}
.tp-b.t-yellow{border-color:var(--yellow)}.tp-b.t-yellow:hover{background:rgba(245,179,37,.13)}
.tp-b.t-green{border-color:var(--green)}.tp-b.t-green:hover{background:rgba(53,182,115,.13)}
.tp-b.t-black{border-color:#5A6273}.tp-b.t-black:hover{background:rgba(90,98,115,.2)}

.rgrid{display:flex;flex-wrap:wrap;gap:7px}
.rchip{font-size:12px;padding:6px 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--ink2)}
.rchip .mono{color:var(--mute);margin-right:3px}
.rchip.r-alive{border-color:rgba(53,182,115,.4)}
.rchip.r-died{border-color:rgba(229,72,77,.45);color:#F3A9AC}
.rchip.r-dead{opacity:.6}

/* ---- Report ---- */
.report-hd{margin:0 0 12px}.rep-line{font-size:12px;color:var(--accent2);font-weight:700;margin:0}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;text-align:center}
.kpi.ok-soft{border-color:rgba(53,182,115,.4)}.kpi.bad-soft{border-color:rgba(229,72,77,.5)}
.kv{display:block;font-size:30px;font-weight:800;line-height:1}
.kk{display:block;font-size:11.5px;color:var(--mute);margin-top:6px}.kk i{color:var(--mute)}
.v-good-soft{border-color:rgba(53,182,115,.5)}.v-ok-soft{border-color:rgba(245,179,37,.5)}.v-poor-soft{border-color:rgba(229,72,77,.5)}
.endgrid{display:flex;flex-direction:column;gap:2px}
.endrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.endrow:last-child{border-bottom:none}
.endrow-l{font-size:14px;color:var(--ink2)}
.endrow-v{font-size:18px;font-weight:800}.endrow-v.ok{color:var(--green)}.endrow-v.bad{color:var(--red)}.endrow-v.grey{color:var(--mute)}
.seedbig{font-size:26px;letter-spacing:.24em;color:var(--accent2);margin:4px 0 8px}

@media (max-width:640px){
  .wrap{padding:22px 15px 90px}.bhd{margin:0 -15px 14px}
  .res{grid-template-columns:repeat(4,1fr);gap:5px}.res-v{font-size:16px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .ccard-signs{flex-direction:row}
  .clock2{font-size:22px}
  .cbtn{min-width:100px}
}
@media (max-width:400px){
  .ccard-top{flex-wrap:wrap}.ccard-signs{flex-direction:row;width:100%;justify-content:flex-start;margin-top:4px}
  .res{grid-template-columns:repeat(2,1fr)}
}

/* ============ Command edition additions ============ */
.feat{margin:0;padding-left:20px}.feat li{color:var(--ink2);margin-bottom:9px;padding-left:4px}.feat li:last-child{margin-bottom:0}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tog{display:flex;flex-direction:column;gap:3px;text-align:left;padding:13px;border-radius:12px;border:1px solid var(--line2);
  background:var(--panel2);color:var(--ink);cursor:pointer;transition:border-color .15s}
.tog:hover{border-color:var(--accent)}.tog.on{border-color:var(--accent);background:rgba(245,165,36,.12)}
.tog b{font-size:14.5px}.tog span{font-size:11.5px;color:var(--ink2)}
.hint.on{color:var(--accent2)}

/* Tabs in the board header */
.tabs{display:flex;gap:6px;margin-top:10px}
.tab{flex:1;font:inherit;font-size:13px;font-weight:700;padding:9px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel);color:var(--mute);cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:#180E02}

/* Radio pop-up */
.radio-wrap{position:sticky;top:8px;z-index:30;margin:0 0 14px}
.radio-card{background:linear-gradient(180deg,#132A1E,#0C1B24);border:1px solid rgba(53,182,115,.5);border-radius:15px;
  padding:16px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.radio-h{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--green);margin-bottom:8px}
.radio-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:blip 1.4s infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.35}}
.radio-text{color:var(--ink);font-size:15px;margin:0 0 6px}
.radio-eta{color:var(--accent2);font-size:12px;margin:0 0 10px}
.radio-report{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:11px;margin:0 0 12px}
.rr-h{display:block;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.radio-report p{color:var(--ink2);margin:0;font-size:14px}
.radio-ask{width:100%;margin:0 0 10px;font-size:14px}
.radio-go{width:100%}

/* Game master panel */
.gm-panel{background:#160F02;border:1px solid rgba(245,165,36,.35);border-radius:14px;margin:0 0 16px;overflow:hidden}
.gm-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;
  font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
.gm-caret{color:var(--mute);letter-spacing:0;text-transform:none;font-size:12px}
.gm-body{padding:0 14px 14px}
.gm-note{color:var(--ink2);font-size:13.5px;margin:0}
.gm-wave{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:9px}
.gm-wave:last-child{margin-bottom:0}
.gm-wave-i{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.gm-wave-n{font-weight:800;font-size:14px}.gm-wave-c{color:var(--mute);font-size:12px}
.gm-wave-r{color:var(--ink2);font-size:12.5px;margin:0 0 10px}

/* Vital signs panel */
.vitals{margin:11px 0 3px;background:#050D15;border:1px solid var(--line);border-radius:11px;padding:11px}
.vitals-h{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2);margin-bottom:8px}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.vrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 8px;border-radius:7px;background:var(--panel)}
.vrow.flag{background:rgba(229,72,77,.14);border:1px solid rgba(229,72,77,.4)}
.vk{font-size:11px;color:var(--mute)}
.vv{font-size:13px;font-weight:700;color:var(--ink)}
.vrow.flag .vv{color:#F3A9AC}

.assessing{margin:11px 0 3px;padding:11px;border-radius:10px;border:1px dashed var(--line2);background:var(--panel2);
  text-align:center;color:var(--accent2);font-size:13px;font-weight:700}
.ccard.intransit{opacity:.86;border-style:dashed}
.lifebar-t.transit i{background:linear-gradient(90deg,#3A7FC4,#5FA8E0)}

/* Dashboard */
.db-card{margin-bottom:12px}
.db-rows{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.db-row{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;border-radius:9px;background:var(--panel2);border:1px solid var(--line)}
.db-code{font-size:13px;font-weight:700;letter-spacing:.04em}
.db-t{font-size:12px;color:var(--ink2)}
.db-empty{color:var(--mute);font-size:13px;margin:6px 0 0}
.db-bad{font-size:11px;font-weight:700;color:#F3A9AC}
.db-grey{font-size:11px;color:var(--mute)}

/* Registration form */
.form{display:flex;flex-direction:column;gap:11px;margin-top:6px}
.fl{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:.02em}
.fin{font:inherit;font-weight:400;font-size:15px;padding:11px;border-radius:10px;border:1px solid var(--line2);background:#050D15;color:var(--ink);outline:none}
.fin:focus{border-color:var(--accent)}
.who{display:flex;flex-direction:column;gap:7px}
.who>div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.who>div:last-child{border-bottom:none;padding-bottom:0}
.who-k{color:var(--mute);font-size:13px}

/* ============ Access gate + issue ============ */
.access-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin:0 0 14px}
.access-card p{color:var(--ink2);margin:0 0 12px}
.access-in{display:flex;gap:9px;margin:14px 0 6px;flex-wrap:wrap}
.access-field{flex:1 1 180px;letter-spacing:.14em;min-width:0}
.access-err{color:#F3A9AC;font-size:13.5px;font-weight:600;margin:8px 0 0}
.access-expired{color:var(--accent2);font-size:13.5px}
.access-foot{margin:14px 0 0}
.linkbtn{background:none;border:none;color:var(--accent2);font:inherit;font-weight:700;cursor:pointer;text-decoration:underline;padding:0}
.daysrow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin:12px 0}
.daysrow .fl{flex:1 1 140px}
.issued{display:flex;flex-direction:column;gap:4px;background:#050D15;border:1px solid rgba(53,182,115,.4);border-radius:12px;padding:14px;margin:6px 0 12px}
.issued-code{font-size:22px;font-weight:800;letter-spacing:.16em;color:var(--green);word-break:break-all}
.issued-exp{font-size:12.5px;color:var(--ink2)}

/* ============ GM resource controls ============ */
.gm-sub{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);margin:4px 0 8px}
.gm-body .gm-sub:not(:first-child){margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.gm-res-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.gm-res-l{font-size:14px;color:var(--ink)}
.gm-res-ctrl{display:flex;align-items:center;gap:10px}
.gm-step{width:38px;height:38px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);
  font-size:20px;font-weight:800;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.gm-step:hover{border-color:var(--accent);color:var(--accent2)}
.gm-res-v{min-width:44px;text-align:center;font-size:15px;font-weight:800}
.gm-hint{font-size:11.5px;color:var(--mute);margin:8px 0 0}

/* ============ Flexible sizing + scrolling polish ============ */
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden;overflow-y:scroll;overscroll-behavior-y:contain}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--panel3)}
.wrap{width:100%;max-width:min(720px,100%);overflow-wrap:break-word}
.h1{overflow-wrap:break-word;hyphens:auto}
.kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.vgrid{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.ccard-label,.ccard-person,.radio-text,.radio-report p{overflow-wrap:break-word}
.seedin,.fin,.access-field{max-width:100%}
/* keep the radio message usable on short screens */
.radio-card{max-height:min(70vh,560px);overflow-y:auto}
/* the game master panel can grow tall on big incidents */
.gm-body{max-height:min(60vh,520px);overflow-y:auto}
/* larger tap targets everywhere on touch */
@media (pointer:coarse){

/* ---------- Seeded RNG (numeric hash, matches suite) ---------- */
function hashSeed(str){
  var h = 1779033703 ^ str.length;
  for (var i=0;i<str.length;i++){
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return (h >>> 0);
}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeSeedCode(){
  var a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = '';
  for (var i=0;i<6;i++) s += a[Math.floor(Math.random()*a.length)];
  return s;
}
function ri(rng, lo, hi){ return lo + Math.floor(rng()*(hi-lo+1)); }

function archById(id){ for (var i=0;i<ARCH.length;i++){ if (ARCH[i].id===id) return ARCH[i]; } return null; }
function archByTag(tag){ return ARCH.filter(function(a){ return a.correctTag===tag; }); }

/* ---------- START / JumpSTART evaluation from measured vitals ---------- */
function startEvaluate(v){
  if (v.ambulatory) return { tag:'GREEN', reason:'Able to get up and walk, which clears them as minor at the first step of the sort.' };
  if (!v.breathing){
    if (v.child){
      if (v.breathesAfterAirway) return { tag:'RED', reason:'A child who is not breathing but breathes once you open the airway is immediate under JumpSTART.' };
      return { tag:'BLACK', reason:'A child with no breathing after opening the airway and rescue breaths is deceased under JumpSTART.' };
    }
    if (v.breathesAfterAirway) return { tag:'RED', reason:'Not breathing until the airway is opened, then breathing returns. That is immediate.' };
    return { tag:'BLACK', reason:'Not breathing, and still no breathing after the airway is opened. Deceased.' };
  }
  if (v.child){
    if (v.rr < 15 || v.rr > 45) return { tag:'RED', reason:'A child breathing rate outside fifteen to forty five per minute is immediate under JumpSTART.' };
    if (!v.radialPulse) return { tag:'RED', reason:'No palpable pulse. Immediate.' };
    if (!v.obeys) return { tag:'RED', reason:'The child does not respond appropriately, which fails the mental status check. Immediate.' };
    return { tag:'YELLOW', reason:'Breathing in range, a pulse present, and responding. Delayed.' };
  }
  if (v.rr > 30) return { tag:'RED', reason:'Breathing faster than thirty per minute is immediate under START on its own.' };
  if (!v.radialPulse || v.crt > 2) return { tag:'RED', reason:'Perfusion fails, a weak or absent radial pulse or capillary refill over two seconds. Immediate.' };
  if (!v.obeys) return { tag:'RED', reason:'Cannot follow a simple command, which fails the mental status check. Immediate.' };
  return { tag:'YELLOW', reason:'Breathing thirty or under, perfusion intact, and following commands. Delayed.' };
}

/* Sample a set of vitals from an archetype envelope. */
function sampleVitals(rng, a){
  return {
    rr: ri(rng, a.env.rr[0], a.env.rr[1]),
    hr: ri(rng, a.env.hr[0], a.env.hr[1]),
    sbp: ri(rng, a.env.sbp[0], a.env.sbp[1]),
    spo2: ri(rng, a.env.spo2[0], a.env.spo2[1]),
    crt: ri(rng, a.env.crt[0], a.env.crt[1]),
    gcs: ri(rng, a.env.gcs[0], a.env.gcs[1]),
    avpu: a.avpu,
    ambulatory: a.ambulatory, breathing: a.breathing,
    breathesAfterAirway: a.breathesAfterAirway, radialPulse: a.radialPulse,
    obeys: a.obeys, child: a.child
  };
}

};

function survivalFor(rng, tag, child){
  if (tag === 'RED')    return child ? ri(rng,90,150) : ri(rng,130,240);
  if (tag === 'YELLOW') return ri(rng,460,820);
  return null;
}

/* Realistic category mix. */
function pickRoster(rng, n){
  var want = {
    RED: Math.max(1, Math.round(n*0.28)),
    BLACK: Math.max(1, Math.round(n*0.10)),
    GREEN: Math.round(n*0.34)
  };
  want.YELLOW = n - want.RED - want.BLACK - want.GREEN;
  if (want.YELLOW < 1){ want.YELLOW = 1; want.GREEN = n - want.RED - want.BLACK - want.YELLOW; }
  var chosen = [];
  ['RED','YELLOW','GREEN','BLACK'].forEach(function(tag){
    var bag = archByTag(tag).slice();
    for (var i=0;i<want[tag];i++){
      if (bag.length === 0) bag = archByTag(tag).slice();       // refill if we need more than the variety
      var idx = Math.floor(rng()*bag.length);
      chosen.push(bag[idx]);
      bag.splice(idx,1);                                        // prefer distinct archetypes first
    }
  });
  // deterministic shuffle so categories interleave
  for (var j=chosen.length-1;j>0;j--){ var k = Math.floor(rng()*(j+1)); var t=chosen[j]; chosen[j]=chosen[k]; chosen[k]=t; }
  return chosen;
}

/* Coded, pseudonymous callsign per casualty. */
function codenames(rng, n){
  var used = {}, out = [];
  for (var i=0;i<n;i++){
    var name;
    do { name = PHON[Math.floor(rng()*PHON.length)] + '-' + ri(rng,10,99); } while (used[name]);
    used[name] = true; out.push(name);
  }
  return out;
}

/* Gross observed injury summary for a wave, the kind of report SAR would radio in. */
function injuryReport(cids, cas){
  var list = cids.map(function(id){ return cas[id-1]; });
  var walk = list.filter(function(c){ return c.vitals.ambulatory; }).length;
  var apnea = list.filter(function(c){ return c.signs.indexOf('apnea')>=0; }).length;
  var bleed = list.filter(function(c){ return c.signs.indexOf('bleed')>=0 || c.signs.indexOf('wound')>=0; }).length;
  var burn = list.filter(function(c){ return c.signs.indexOf('burn')>=0; }).length;
  var frac = list.filter(function(c){ return c.signs.indexOf('fracture')>=0; }).length;
  var chest = list.filter(function(c){ return c.signs.indexOf('chest')>=0 || c.signs.indexOf('head')>=0 || c.signs.indexOf('abdomen')>=0; }).length;
  var parts = [];
  parts.push(list.length + ' casualties');
  if (walk) parts.push(walk + ' walking');
  if (bleed) parts.push(bleed + ' with heavy bleeding');
  if (apnea) parts.push(apnea + ' not breathing or unresponsive');
  if (burn) parts.push(burn + ' with burns');
  if (frac) parts.push(frac + ' with obvious fractures');
  if (chest) parts.push(chest + ' with chest, head or belly injuries');
  return 'SAR reports about ' + parts.join(', ') + '.';
}

/* ---------- Build an incident ---------- */
function makeIncident(seedCode, scaleKey, modeKey, supervised, team){
  var sc = SCALES[scaleKey] || SCALES.standard;
  var md = MODES[modeKey] || MODES.medical;
  var rng = mulberry32(hashSeed(seedCode + '::' + sc.key + '::' + md.key));
  var archs = pickRoster(rng, sc.count);
  var codes = codenames(rng, sc.count);
  var cas = archs.map(function(a, idx){
    var v = sampleVitals(rng, a);
    return {
      cid: idx+1, code: codes[idx], arch: a.id, label: a.label, person: a.person,
      signs: a.signs, child: a.child, need: a.need,
      trueTag: a.correctTag, playerTag: null,
      vitals: v, assessed:false, assessDoneAt:null,
      status:'hidden',                    // hidden until its wave is dispatched
      clock: survivalFor(rng, a.correctTag, a.child), clock0:null,
      stabilized:false, deliveredAt:null, diedAt:null, triagedAt:null, wave:0
    };
  });
  cas.forEach(function(c){ c.clock0 = c.clock; });

  // partition into waves
  var nWaves = md.arrivals ? sc.waves : (supervised ? sc.waves : 1);
  if (!md.arrivals && !supervised) nWaves = 1;         // on scene, unsupervised: everyone found at once
  var waves = [];
  var per = Math.ceil(cas.length / nWaves);
  for (var w=0; w<nWaves; w++){
    var slice = cas.slice(w*per, (w+1)*per);
    slice.forEach(function(c){ c.wave = w; });
    waves.push({
      idx:w, at: w*55,                        // later waves arrive on these clock marks when unsupervised
      cids: slice.map(function(c){ return c.cid; }),
      dispatched:false, reportShown:false
    });
  }

  var S = {
    seed:seedCode, scale:sc.key, scaleName:sc.name, mode:md.key, modeName:md.name,
    supervised:!!supervised, team:!!team,
    echelon:md.echelon, deliverVerb:md.deliverVerb, transitSec:md.transitSec,
    roundtripSec:md.roundtripSec, allowTreat:md.allowTreat, arrivals:md.arrivals,
    t:0, running:false, done:false,
    teamsTotal: md.allowTreat ? sc.teams : 0, teamsFree: md.allowTreat ? sc.teams : 0,
    unitsTotal: sc.units, unitsFree: sc.units,
    cas:cas, waves:waves, assessments:[], treatments:[], transports:[],
    pendingTeamRemove:0, pendingUnitRemove:0,
    radio:null, events:[], participant:null
  };

  // wave 0 is the initial load, already at the scene, with an opening report
  waves[0].dispatched = true;
  waves[0].cids.forEach(function(id){ cas[id-1].status = 'scene'; });
  S.radio = { kind:'initial', at:0, n:waves[0].cids.length, wave:0, eta:0,
    text: (md.arrivals
      ? 'First casualties are with you at the medical area now, ' + waves[0].cids.length + ' of them.'
      : 'First sector searched. ' + waves[0].cids.length + ' casualties located and ready for triage.'),
    report: injuryReport(waves[0].cids, cas), reportShown:false };

  return S;
}

function byId(S, cid){ for (var i=0;i<S.cas.length;i++){ if (S.cas[i].cid===cid) return S.cas[i]; } return null; }
function logEvent(S, text){ S.events.push({ t: Math.round(S.t), text: text }); if (S.events.length>80) S.events.shift(); }

/* Reveal a wave: casualties appear, in transit for medical, on scene for SAR. */
function dispatchWave(S, idx){
  var wv = S.waves[idx]; if (!wv || wv.dispatched) return false;
  wv.dispatched = true;
  var incoming = wv.cids.map(function(id){ return byId(S,id); });
  if (S.arrivals){
    incoming.forEach(function(c){ c.status = 'transit'; c.transitDoneAt = S.t + S.transitSec; });
    S.radio = { kind:'incoming', at:Math.round(S.t), n:incoming.length, wave:idx,
      eta:S.transitSec, text:'SAR to Medical. We are sending you ' + incoming.length + ' casualties. Time out about ' + S.transitSec + ' seconds.', report:injuryReport(wv.cids, S.cas), reportShown:false };
  } else {
    incoming.forEach(function(c){ c.status = 'scene'; });
    S.radio = { kind:'found', at:Math.round(S.t), n:incoming.length, wave:idx,
      eta:0, text:'Sector cleared. ' + incoming.length + ' casualties located and ready for triage.', report:injuryReport(wv.cids, S.cas), reportShown:false };
  }
  logEvent(S, 'Wave ' + (idx+1) + ' dispatched, ' + incoming.length + ' casualties.');
  return true;
}
function revealReport(S){ if (S.radio) S.radio.reportShown = true; }
function dismissRadio(S){ S.radio = null; }

/* ---------- The one true clock ---------- */
function stepSim(S, dt){
  if (S.done) return S;
  S.t += dt;

  // unsupervised auto dispatch by scheduled time
  if (!S.supervised){
    S.waves.forEach(function(wv){ if (!wv.dispatched && wv.at != null && S.t >= wv.at) dispatchWave(S, wv.idx); });
  }

  // transit arrivals (medical)
  S.cas.forEach(function(c){
    if (c.status === 'transit' && c.transitDoneAt != null && S.t >= c.transitDoneAt){
      c.status = 'scene';
      logEvent(S, c.code + ' arrived at the medical area.');
    }
  });

  // deterioration for exposed casualties on scene or waiting
  S.cas.forEach(function(c){
    if ((c.status === 'scene' || c.status === 'waiting') && c.clock != null){
      c.clock -= dt;
      if (c.clock <= 0){ c.clock = 0; c.status='deceased'; c.outcome='died'; c.diedAt=Math.round(S.t);
        logEvent(S, c.code + ' died waiting.'); }
    }
  });

  // assessments complete
  S.assessments = S.assessments.filter(function(as){
    if (as.doneAt <= S.t){ var c = byId(S, as.cid); if (c && !c.assessed){ c.assessed = true; logEvent(S, c.code + ' assessed, vitals in.'); } return false; }
    return true;
  });

  // treatments complete
  S.treatments = S.treatments.filter(function(tr){
    if (tr.endsAt <= S.t){ var c = byId(S, tr.cid); if (c && c.status==='treating'){ c.status='stable'; c.stabilized=true; logEvent(S, c.code + ' stabilized.'); }
      if (S.pendingTeamRemove > 0){ S.pendingTeamRemove--; S.teamsTotal = Math.max(0, S.teamsTotal-1); }
      else S.teamsFree++;
      return false; }
    return true;
  });

  // transports: arrival at echelon, then the unit returns
  S.transports.forEach(function(tp){
    if (!tp.arrived && tp.arrivesAt <= S.t){ tp.arrived = true; var c = byId(S, tp.cid);
      if (c){ c.status='delivered'; c.outcome='survived'; c.deliveredAt=Math.round(S.t); logEvent(S, c.code + ' reached the ' + S.echelon + '.'); } }
  });
  S.transports = S.transports.filter(function(tp){ if (tp.returnsAt <= S.t){
    if (S.pendingUnitRemove > 0){ S.pendingUnitRemove--; S.unitsTotal = Math.max(0, S.unitsTotal-1); }
    else S.unitsFree++;
    return false; } return true; });

  // end when everything visible is resolved and all waves are out
  var allOut = S.waves.every(function(wv){ return wv.dispatched; });
  var noneHidden = S.cas.every(function(c){ return c.status !== 'hidden'; });
  var settled = S.cas.every(function(c){ return c.status==='delivered' || c.status==='discharged' || c.status==='deceased'; });
  if (allOut && noneHidden && settled){ S.done = true; S.running = false; }
  return S;
}

/* ---------- Actions ---------- */
function actAssess(S, cid){
  var c = byId(S, cid); if (!c || c.status !== 'scene' || c.assessed) return false;
  if (S.assessments.some(function(a){ return a.cid===cid; })) return false;
  S.assessments.push({ cid:cid, doneAt: S.t + ASSESS_SEC });
  return true;
}
function actTriage(S, cid, tag){
  var c = byId(S, cid); if (!c || c.status !== 'scene') return false;
  c.playerTag = tag; c.triagedAt = Math.round(S.t);
  if (c.trueTag === 'BLACK'){ c.status='deceased'; c.outcome='dead'; return true; }
  if (tag === 'BLACK'){ c.status='deceased'; c.outcome='died'; c.diedAt=Math.round(S.t); logEvent(S, c.code + ' left as deceased but was still savable.'); return true; }
  c.status = 'waiting';
  return true;
}
function actTreat(S, cid){
  if (!S.allowTreat) return false;
  var c = byId(S, cid); if (!c || c.status !== 'waiting') return false;
  if (S.teamsFree <= 0) return false;
  S.teamsFree--; c.status='treating'; S.treatments.push({ cid:cid, endsAt: S.t + TREAT_SEC });
  logEvent(S, 'Team on ' + c.code + '.'); return true;
}
function actTransport(S, cid){
  var c = byId(S, cid); if (!c || (c.status !== 'waiting' && c.status !== 'stable')) return false;
  if (S.unitsFree <= 0) return false;
  S.unitsFree--; c.status='enroute';
  S.transports.push({ cid:cid, arrivesAt: S.t + S.transitSec, returnsAt: S.t + S.roundtripSec, arrived:false });
  logEvent(S, c.code + ' moving to ' + S.echelon + '.'); return true;
}
function actDischarge(S, cid){
  var c = byId(S, cid); if (!c || c.status !== 'waiting') return false;
  c.status='discharged'; c.outcome='minor'; return true;
}

/* ---------- Grouping and dashboard ---------- */
function groups(S){
  var g = { transit:[], scene:[], waiting:[], progress:[], resolved:[] };
  S.cas.forEach(function(c){
    if (c.status === 'hidden') return;
    if (c.status === 'transit') g.transit.push(c);
    else if (c.status === 'scene') g.scene.push(c);
    else if (c.status === 'waiting') g.waiting.push(c);
    else if (c.status === 'treating' || c.status === 'stable' || c.status === 'enroute') g.progress.push(c);
    else g.resolved.push(c);
  });
  return g;
}
function dashboard(S){
  var tagged = S.cas.filter(function(c){ return c.playerTag && c.status !== 'transit'; })
    .map(function(c){ return { code:c.code, tag:c.playerTag, at:c.triagedAt, status:c.status }; });
  var delivered = S.cas.filter(function(c){ return c.status === 'delivered'; })
    .map(function(c){ return { code:c.code, tag:c.playerTag, at:c.deliveredAt }; });
  var deceased = S.cas.filter(function(c){ return c.status === 'deceased'; })
    .map(function(c){ return { code:c.code, preventable:c.outcome==='died', at:c.diedAt }; });
  return { tagged:tagged, delivered:delivered, deceased:deceased };
}

/* Classify a triage decision. Under-triage (calling someone less urgent than
   they are) is the dangerous direction. Black-tagging a savable patient counts
   as under-triage since it denies care, and working a deceased patient counts
   as over-triage since it spends resources on the beyond help. */
function classifyTriage(playerTag, trueTag){
  if (!playerTag || playerTag === trueTag) return null;
  if (playerTag === 'BLACK' && trueTag !== 'BLACK') return 'under';
  if (trueTag === 'BLACK' && playerTag !== 'BLACK') return 'over';
  var sev = { GREEN:0, YELLOW:1, RED:2 };
  return sev[playerTag] < sev[trueTag] ? 'under' : 'over';
}

/* ---------- After action report ---------- */
function buildReport(S){
  var n = S.cas.length;
  var delivered = S.cas.filter(function(c){ return c.status==='delivered'; }).length;
  var held = S.cas.filter(function(c){ return c.status==='stable'; }).length;
  var discharged = S.cas.filter(function(c){ return c.status==='discharged'; }).length;
  var preventable = S.cas.filter(function(c){ return c.outcome==='died'; }).length;
  var deadOnArrival = S.cas.filter(function(c){ return c.outcome==='dead'; }).length;
  var alive = delivered + held + discharged;

  var triaged = S.cas.filter(function(c){ return c.playerTag; });
  var mistriaged = [];
  triaged.forEach(function(c){
    var dir = classifyTriage(c.playerTag, c.trueTag);
    if (dir) mistriaged.push({ code:c.code, playerTag:c.playerTag, trueTag:c.trueTag, dir:dir });
  });
  var exact = triaged.length - mistriaged.length;
  var under = mistriaged.filter(function(e){ return e.dir==='under'; }).length;
  var over = mistriaged.filter(function(e){ return e.dir==='over'; }).length;

  var reds = S.cas.filter(function(c){ return c.trueTag==='RED'; });
  var redsSaved = reds.filter(function(c){ return c.status==='delivered' || c.status==='stable'; }).length;
  var redDelivered = S.cas.filter(function(c){ return c.trueTag==='RED' && c.deliveredAt != null; });
  var meanRedTime = redDelivered.length ? Math.round(redDelivered.reduce(function(a,c){ return a+c.deliveredAt; },0)/redDelivered.length) : null;

  var assessedCount = S.cas.filter(function(c){ return c.assessed; }).length;
  var taggedWithVitals = triaged.filter(function(c){ return c.assessed; });
  var taggedBlind = triaged.filter(function(c){ return !c.assessed; });
  var accWithVitals = taggedWithVitals.length ? Math.round(taggedWithVitals.filter(function(c){ return c.playerTag===c.trueTag; }).length / taggedWithVitals.length * 100) : null;
  var accBlind = taggedBlind.length ? Math.round(taggedBlind.filter(function(c){ return c.playerTag===c.trueTag; }).length / taggedBlind.length * 100) : null;

  return {
    n:n, elapsed:Math.round(S.t), echelon:S.echelon, mode:S.mode,
    delivered:delivered, held:held, discharged:discharged, alive:alive,
    preventable:preventable, deadOnArrival:deadOnArrival,
    triagedCount:triaged.length, exact:exact,
    tagAcc: triaged.length ? Math.round(exact/triaged.length*100) : 0,
    underRate: triaged.length ? Math.round(under/triaged.length*100) : 0,
    overRate: triaged.length ? Math.round(over/triaged.length*100) : 0,
    redTotal:reds.length, redsSaved:redsSaved, meanRedTime:meanRedTime,
    assessedCount:assessedCount, accWithVitals:accWithVitals, accBlind:accBlind,
    withVitalsCount:taggedWithVitals.length, blindCount:taggedBlind.length,
    mistriaged:mistriaged
  };
}
function verdict(rep){
  if (rep.preventable === 0 && rep.underRate <= 5)
    return { band:'good', text:'A clean run. No preventable deaths, and your sort held up. Fast triage, the right people held, and transport spent where it counted.' };
  if (rep.preventable <= Math.max(1, Math.round(rep.redTotal*0.34)))
    return { band:'ok', text:'A workable run with room to tighten. A few who could have lived did not. Look at where your resources were when their clocks ran out, and whether measuring vitals earlier would have caught them.' };
  return { band:'poor', text:'The incident got ahead of you. Too many savable people died waiting. Sort faster, measure the ones you are unsure about, and move the immediate cases before anyone else.' };
}

/* ---------- Game master resource injection ---------- */
function gmResource(S, kind, delta){
  if (kind === 'team' && !S.allowTreat) return false;
  if (delta === 0) return false;
  if (kind === 'team'){
    if (delta > 0){ S.teamsTotal += delta; S.teamsFree += delta; }
    else { var rem = -delta, take = Math.min(rem, S.teamsFree); S.teamsFree -= take; S.teamsTotal -= take; S.pendingTeamRemove += (rem - take); }
  } else {
    if (delta > 0){ S.unitsTotal += delta; S.unitsFree += delta; }
    else { var r2 = -delta, t2 = Math.min(r2, S.unitsFree); S.unitsFree -= t2; S.unitsTotal -= t2; S.pendingUnitRemove += (r2 - t2); }
  }
  var word = kind === 'team' ? 'treatment team' : (S.mode === 'sar' ? 'stretcher team' : 'ambulance');
  var n = Math.abs(delta), pl = n > 1 ? 's' : '';
  var text = delta > 0
    ? 'Command. ' + n + ' more ' + word + pl + ' ' + (n > 1 ? 'are' : 'is') + ' with you now.'
    : 'Command. We are pulling ' + n + ' ' + word + pl + ' to another sector. ' + (n > 1 ? 'They' : 'It') + ' will stand down after the current run.';
  S.radio = { kind:'inject', at:Math.round(S.t), text:text, report:null, reportShown:true, eta:0 };
  logEvent(S, 'Injection: ' + (delta > 0 ? '+' : '') + delta + ' ' + word + pl + '.');
  return true;
}

var ACCESS_EPOCH = Date.UTC(2024, 0, 1);
function _pad2(s){ return ('00' + s).slice(-2); }
function _b36(n){ return n.toString(36).toUpperCase(); }
function _chk(days){ return _pad2(_b36(hashSeed(ACCESS_SECRET + ':' + days) % 1296)); }
function daysSinceEpoch(ms){ return Math.floor((ms - ACCESS_EPOCH) / 86400000); }
function expiryDateStr(expiryDays){ return new Date(ACCESS_EPOCH + expiryDays * 86400000).toISOString().slice(0,10); }
function issueCode(days, nowMs){
  var exp = daysSinceEpoch(nowMs || Date.now()) + Math.max(1, days | 0);
  return ACCESS_PREFIX + '-' + _b36(exp) + '-' + _chk(exp);
}
function decodeCode(str, nowMs){
  if (!str) return { valid:false };
  var parts = String(str).toUpperCase().replace(/\s+/g,'').split('-');
  if (parts.length !== 3 || parts[0] !== ACCESS_PREFIX) return { valid:false };
  var exp = parseInt(parts[1], 36);
  if (isNaN(exp) || _chk(exp) !== parts[2]) return { valid:false };
  var today = daysSinceEpoch(nowMs || Date.now());
  return { valid:true, expiryDays:exp, expired: today > exp, expiryDate: expiryDateStr(exp) };
}

/* ---------------- Real-time loop ---------------- */
function startTick(){
  stopTick();
  S.sim.running = true;
  S.tickId = setInterval(function(){
    if (S.sim.radio) return;                 // paused while a radio message is on the screen
    stepSim(S.sim, S.speed);
    if (S.sim.done){ stopTick(); go('register'); return; }
    var y = window.pageYOffset || 0; render(); window.scrollTo(0, y);
  }, 1000);
}
function stopTick(){ if (S.tickId){ clearInterval(S.tickId); S.tickId = null; } if (S.sim) S.sim.running = false; }

/* ---------------- Render ---------------- */
function render(){
  if (!S.unlocked && S.screen !== 'access' && S.screen !== 'issue' && S.screen !== 'credits' && S.screen !== 'learn') S.screen = 'access';
  var m = { access:viewAccess, issue:viewIssue, credits:viewCredits, learn:viewLearn, about:viewAbout, setup:viewSetup, board:viewBoard, register:viewRegister, report:viewReport };
  app().innerHTML = (m[S.screen] || viewAbout)();
  bind();
}
function bind(){
  app().querySelectorAll('[data-act],[data-go]').forEach(function(el){
    el.onclick = function(e){
      e.preventDefault(); e.stopPropagation();
      var g = el.getAttribute('data-go'); if (g){ go(g); return; }
      handle(el.getAttribute('data-act'), el.getAttribute('data-val'), el);
    };
  });
  var seedEl = document.getElementById('seedin');
  if (seedEl) seedEl.oninput = function(){ S.seed = seedEl.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6); };
  ['name','role','org','team'].forEach(function(f){
    var el = document.getElementById('reg-'+f);
    if (el) el.oninput = function(){ S.reg[f] = el.value; };
  });
  var ac = document.getElementById('access-code');
  if (ac) ac.oninput = function(){ S.access.code = ac.value; };
  var ik = document.getElementById('issue-key');
  if (ik) ik.oninput = function(){ S.issue.key = ik.value; };
  var idd = document.getElementById('issue-days');
  if (idd) idd.oninput = function(){ S.issue.days = parseInt(idd.value,10) || 1; };
}
function handle(a, v){
  if (a === 'access-unlock'){
    var f = document.getElementById('access-code'); var code = f ? f.value : S.access.code;
    var d = decodeCode(code);
    if (!d.valid){ S.access.error = 'That code is not recognized. Check for typing mistakes.'; render(); return; }
    if (d.expired){ S.access.error = 'That code expired on ' + d.expiryDate + '. Ask your facilitator for a new one.'; render(); return; }
    lsSet('mice_grant', String(d.expiryDays)); S.unlocked = true; S.grantExpiry = d.expiryDays; S.access.error = ''; go('about'); return;
  }
  if (a === 'issue-open'){ S.issue = { stage:'key', key:'', days:2, code:'', err:'', facilitator:'' }; go('issue'); return; }
  if (a === 'issue-key'){ var fac = facilitatorFor(S.issue.key); if (fac){ S.issue.stage = 'gen'; S.issue.facilitator = fac; S.issue.err = ''; } else { S.issue.err = 'Facilitator key not recognized.'; } render(); return; }
  if (a === 'issue-gen'){ S.issue.code = issueCode(S.issue.days); render(); return; }
  if (a === 'issue-back'){ go('access'); return; }
  if (a === 'mode'){ S.mode = v; render(); }
  if (a === 'scale'){ S.scale = v; render(); }
  if (a === 'newseed'){ S.seed = makeSeedCode(); render(); }
  if (a === 'begin'){
    var f = document.getElementById('seedin'); if (f) S.seed = f.value;
    S.seed = (S.seed||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6); if (!S.seed) S.seed = makeSeedCode();
    S.sim = makeIncident(S.seed, S.scale, S.mode, false, false);
    S.triageOpen = null; S.speed = 1; S.boardTab = 'cards'; S.gmOpen = true;
    go('board'); startTick();
  }
  if (a === 'pause'){ if (S.sim.running) stopTick(); else startTick(); render(); }
  if (a === 'speed'){ S.speed = (S.speed === 1 ? 2 : 1); render(); }
  if (a === 'end'){ stopTick(); go('register'); }
  if (a === 'boardtab'){ S.boardTab = v; render(); }
  if (a === 'about-new-toggle'){ S.aboutNewOpen = !S.aboutNewOpen; render(); }
  if (a === 'learn-toggle'){ var li = parseInt(v,10); S.learnOpen = (S.learnOpen === li ? -1 : li); render(); }
  if (a === 'radio-report'){ revealReport(S.sim); render(); }
  if (a === 'radio-dismiss'){ dismissRadio(S.sim); if (!S.sim.running && !S.sim.done) startTick(); render(); }
  if (a === 'assess'){ actAssess(S.sim, parseInt(v,10)); render(); }
  if (a === 'triage-open'){ S.triageOpen = (S.triageOpen === parseInt(v,10) ? null : parseInt(v,10)); render(); }
  if (a === 'triage'){ var p = v.split(':'); actTriage(S.sim, parseInt(p[0],10), p[1]); S.triageOpen = null; render(); }
  if (a === 'treat'){ actTreat(S.sim, parseInt(v,10)); render(); }
  if (a === 'transport'){ actTransport(S.sim, parseInt(v,10)); render(); }
  if (a === 'discharge'){ actDischarge(S.sim, parseInt(v,10)); render(); }
  if (a === 'reg-submit'){ S.sim.participant = { name:S.reg.name, role:S.reg.role, org:S.reg.org, team:S.reg.team }; go('report'); }
  if (a === 'reg-skip'){ S.sim.participant = null; go('report'); }
  if (a === 'restart'){ S.sim = null; S.seed = ''; go('setup'); }
  if (a === 'exporttxt'){ exportReport(); }
  if (a === 'exportpdf'){ exportPdf(); }
}

}

/* ---------------- Tutorial, START and JumpSTART ---------------- */
var LESSONS = [
  { t:'Triage in one minute', h:
    '<p>In an everyday emergency, one patient gets the full attention of the whole team. A mass casualty incident flips that. There are more injured people than there are hands, and the sickest are slipping away while you work. Triage is how you make that manageable. You sort people quickly into a few priority groups so the limited help goes where it saves the most lives.</p>' +
    '<p>Two ideas run through every triage system. First, do the greatest good for the greatest number, which sometimes means passing someone who cannot be saved so that others who can be are not lost. Second, a triage tag is not permanent. People get better or worse, so you re-check them whenever you can.</p>' +
    '<p>This game uses the two systems most widely taught, START for adults and JumpSTART for children. Work through these short lessons, then use them under pressure in the practice game.</p>' },
  { t:'The four colors', h:
    '<p>Almost every field triage system sorts people into the same four groups, shown as colors.</p>' +
    '<div class="tag-legend">' +
      '<div class="tl-row"><span class="tag2 t-red">RED</span><span>Immediate. Life-threatening but savable with prompt care. Treat and move these first.</span></div>' +
      '<div class="tl-row"><span class="tag2 t-yellow">YELLOW</span><span>Delayed. Serious injuries, but they can wait a while without dying.</span></div>' +
      '<div class="tl-row"><span class="tag2 t-green">GREEN</span><span>Minor. The walking wounded, who can wait and often help themselves.</span></div>' +
      '<div class="tl-row"><span class="tag2 t-black">BLACK</span><span>Deceased, or beyond saving with the resources at hand.</span></div>' +
    '</div>' +
    '<p>The whole skill of triage is deciding, quickly and correctly, which color each person is. START and JumpSTART give you a reliable way to do exactly that.</p>' },
  { t:'START, the adult sort', h:
    '<p>START, Simple Triage and Rapid Treatment (Super, 1984; Benson et al., 1996), sorts an adult in under a minute using things you can check fast: whether they walk, their breathing, their perfusion, and their mental status. Work the steps in order and stop at the first one that gives a color.</p>' +
    '<div class="flow-step"><div class="flow-q">1. Can they get up and walk?</div><div class="flow-a"><span class="tag2 t-green">GREEN</span> if yes. Direct them to the walking wounded area. If no, go on.</div></div>' +
    '<div class="flow-step"><div class="flow-q">2. Are they breathing?</div><div class="flow-a">If not, open the airway. Breathing returns, <span class="tag2 t-red">RED</span>. Still no breathing, <span class="tag2 t-black">BLACK</span>. If breathing, go on.</div></div>' +
    '<div class="flow-step"><div class="flow-q">3. Is the breathing rate over 30 a minute?</div><div class="flow-a"><span class="tag2 t-red">RED</span> if yes. If no, go on.</div></div>' +
    '<div class="flow-step"><div class="flow-q">4. Is perfusion failing, a radial pulse you cannot feel or capillary refill slower than 2 seconds?</div><div class="flow-a"><span class="tag2 t-red">RED</span> if yes. If no, go on.</div></div>' +
    '<div class="flow-step"><div class="flow-q">5. Can they follow a simple command, such as squeeze my hand?</div><div class="flow-a"><span class="tag2 t-red">RED</span> if they cannot. <span class="tag2 t-yellow">YELLOW</span> if they can.</div></div>' +
    '<p class="muted small">A quick way to hold it: walk, breathing, rate, perfusion, mental status. The first step that fits decides the tag.</p>' +
    '<details class="qcheck"><summary>Quick check: a man is breathing 36 times a minute, has a strong radial pulse, and follows commands. What tag?</summary><p><span class="tag2 t-red">RED</span>. The breathing rate over 30 makes him immediate, even though his pulse and mental status are fine. The first failing step decides it.</p></details>' },
  { t:'JumpSTART, the children\u2019s sort', h:
    '<p>Children are not small adults. Their normal breathing is faster, and a child whose breathing stops often still has a beating heart, so a few rescue breaths can bring them back. JumpSTART adapts START for this (Romig, 2002). Use it for children who look to be roughly one to eight years old.</p>' +
    '<div class="flow-step"><div class="flow-q">1. Can they walk?</div><div class="flow-a"><span class="tag2 t-green">GREEN</span> if yes. A child too young to walk is assessed where they lie.</div></div>' +
    '<div class="flow-step"><div class="flow-q">2. Are they breathing?</div><div class="flow-a">If not, open the airway. Breathing returns, <span class="tag2 t-red">RED</span>. If still not, check for a pulse. No pulse, <span class="tag2 t-black">BLACK</span>. If there is a pulse, give five rescue breaths. Breathing starts, <span class="tag2 t-red">RED</span>. Still nothing, <span class="tag2 t-black">BLACK</span>.</div></div>' +
    '<div class="flow-step"><div class="flow-q">3. Is the breathing rate under 15 or over 45 a minute?</div><div class="flow-a"><span class="tag2 t-red">RED</span> if yes. A child\u2019s normal range is wider than an adult\u2019s.</div></div>' +
    '<div class="flow-step"><div class="flow-q">4. Can you feel a pulse?</div><div class="flow-a">No pulse, <span class="tag2 t-red">RED</span>. If there is one, go on.</div></div>' +
    '<div class="flow-step"><div class="flow-q">5. How do they respond? Use AVPU: Alert, responds to Voice, responds to Pain, Unresponsive.</div><div class="flow-a">If they respond to pain abnormally or not at all, <span class="tag2 t-red">RED</span>. If alert or responding normally, <span class="tag2 t-yellow">YELLOW</span>.</div></div>' +
    '<details class="qcheck"><summary>Quick check: a small child is not breathing, then starts again the moment you open the airway. What tag?</summary><p><span class="tag2 t-red">RED</span>. In JumpSTART, breathing that returns with a simple airway maneuver is immediate.</p></details>' },
  { t:'The one error that kills', h:
    '<p>Two kinds of mistake matter, and they are not equal.</p>' +
    '<p><strong>Under-triage</strong> is calling someone less urgent than they really are, for example tagging a red patient as green. This is the dangerous one. That person waits, gets worse, and can die of an injury that was survivable. In the practice game, this is what the report flags in red.</p>' +

    ['Resp rate', rrText, (v.breathing && v.rr>30) || (v.child && v.breathing && (v.rr<15||v.rr>45)) ? 'flag' : ''],
    ['Radial pulse', v.radialPulse ? 'Present' : 'Absent', v.radialPulse ? '' : 'flag'],
    ['Cap refill', v.crt + ' s', v.crt>2 ? 'flag' : ''],
    ['Pulse rate', v.hr ? (v.hr + ' bpm') : 'None', ''],
    ['SpO2', v.spo2 ? (v.spo2 + '%') : 'n/a', ''],

  ];
  return '<div class="vitals"><div class="vitals-h">Vital signs</div><div class="vgrid">' +
    rows.map(function(r){ return '<div class="vrow ' + r[2] + '"><span class="vk">' + esc(r[0]) + '</span><span class="vv mono">' + esc(r[1]) + '</span></div>'; }).join('') +
    '</div></div>';
}
function bar(c){
  if (c.clock == null) return '';
  var pctv = Math.max(0, Math.min(100, Math.round((c.clock / c.clock0) * 100)));
  var held = (c.status==='treating' || c.status==='stable' || c.status==='enroute');
  var cls = held ? 'held' : (c.trueTag==='RED' ? 'red' : 'amber');
  var label = held ? 'clock held' : fmtClock(c.clock) + ' left';
  return '<div class="lifebar"><div class="lifebar-t ' + cls + '"><i style="width:' + pctv + '%"></i></div><span class="lifebar-l">' + label + '</span></div>';
}
function transitBar(c){
  var total = S.sim.transitSec;
  var remain = Math.max(0, (c.transitDoneAt||0) - S.sim.t);
  var pctv = Math.max(0, Math.min(100, Math.round((1 - remain/total) * 100)));
  return '<div class="lifebar"><div class="lifebar-t transit"><i style="width:' + pctv + '%"></i></div><span class="lifebar-l">inbound, ' + fmtClock(remain) + '</span></div>';
}
function statusChip(c){
  var map = { treating:'Team working', stable:'Stabilized, holding', enroute:'Moving to ' + S.sim.echelon,
    delivered:'Reached ' + S.sim.echelon, discharged:'Sent to walking wounded',
    deceased:(c.outcome==='dead'?'Deceased on arrival':'Died waiting'), transit:'Inbound from SAR' };
  var cls = (c.status==='delivered'||c.status==='discharged') ? 'ok' : (c.status==='deceased' ? (c.outcome==='died'?'bad':'grey') : 'work');
  var extra = '';
  if (c.status==='enroute'){ var tp = S.sim.transports.filter(function(x){ return x.cid===c.cid; })[0]; if (tp && !tp.arrived) extra = ', ETA ' + fmtClock(tp.arrivesAt - S.sim.t); }
  return '<span class="stchip ' + cls + '">' + esc(map[c.status]||c.status) + extra + '</span>';
}
function tagChip(tag){ return '<span class="tag2 t-' + tag.toLowerCase() + '">' + tag + '</span>'; }
function assessing(c){ return S.sim.assessments.some(function(a){ return a.cid===c.cid; }); }
function assessRemain(c){ var a = S.sim.assessments.filter(function(x){ return x.cid===c.cid; })[0]; return a ? Math.max(0, Math.round(a.doneAt - S.sim.t)) : 0; }

function actionsFor(c){

    if (assessing(c)) return '<div class="assessing">Taking vital signs, ' + assessRemain(c) + 's</div>';
    if (S.triageOpen === c.cid){
      var tags = [['RED','Immediate'],['YELLOW','Delayed'],['GREEN','Minor'],['BLACK','Deceased']];
      return '<div class="tagpick">' + tags.map(function(t){
        return '<button class="tp-b t-' + t[0].toLowerCase() + '" data-act="triage" data-val="' + c.cid + ':' + t[0] + '"><b>' + t[0] + '</b><span>' + t[1] + '</span></button>'; }).join('') + '</div>';
    }
    var assessBtn = c.assessed ? '' : '<button class="cbtn" data-act="assess" data-val="' + c.cid + '">Take vital signs</button>';
    var triBtn = '<button class="cbtn primary" data-act="triage-open" data-val="' + c.cid + '">Give a triage tag</button>';
    return '<div class="cactions">' + assessBtn + triBtn + '</div>';
  }
  if (c.status === 'waiting'){

  }

function card(c){

function section(title, list, note){

function endRow(label, n, cls){ return '<div class="endrow"><span class="endrow-l">' + esc(label) + '</span><span class="endrow-v mono ' + cls + '">' + n + '</span></div>'; }
function triageErrorBlock(rep){

/* ---------------- PDF export (self-contained, no library) ---------------- */
function pdfEsc(s){ return String(s).replace(/[^\x20-\x7E\xA0-\xFF]/g,'').replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)'); }
function pdfWrap(text, max){
  var words = String(text).split(/\s+/), lines = [], line = '';
  words.forEach(function(w){
    if ((line ? line + ' ' + w : w).length > max){ if (line) lines.push(line); line = w; }
    else line = line ? line + ' ' + w : w;
  });
  if (line) lines.push(line); return lines;
}
function buildReportLines(){

  head('Triage');

  line('Under-triage: ' + rep.underRate + '% (target under 5%)');
  line('Over-triage: ' + rep.overRate + '%');
  line('Vitals measured on: ' + rep.assessedCount + ' of ' + rep.n);

  head('Where everyone ended');

  head('Session code');
  line(sim.seed, { b:true });
  line('', { gap:6 });
  line('Training simulation only. Invented casualties and generated timings. Not a decision aid for a real incident.', { size:8.5 });
  line('Generated ' + new Date().toLocaleString(), { size:8.5 });
  return out;
}
function makePdf(lines){
  var pageW = 612, pageH = 792, mL = 54, mT = 56, mB = 54;
  var pages = [], cur = [], y = pageH - mT;
  lines.forEach(function(ln){
    var size = ln.size || 10.5;
    if (ln.before) y -= ln.before;
    var adv = size * 1.35 + (ln.gap || 0);
    if (y - size * 1.35 < mB){ pages.push(cur); cur = []; y = pageH - mT; }
    if (ln.t !== '') cur.push({ t:ln.t, b:ln.b, size:size, x:mL + (ln.indent || 0), y:y });
    y -= adv;
  });
  pages.push(cur);
  var objs = [];
  objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  var num = 5, kids = [];
  pages.forEach(function(pg){
    var content = '';
    pg.forEach(function(o){
      content += 'BT /' + (o.b ? 'F2' : 'F1') + ' ' + o.size + ' Tf ' + o.x.toFixed(1) + ' ' + o.y.toFixed(1) + ' Td (' + pdfEsc(o.t) + ') Tj ET\n';
    });
    var contentNum = num++, pageNum = num++;
    objs[contentNum] = '<< /Length ' + content.length + ' >>\nstream\n' + content + 'endstream';
    objs[pageNum] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pageW + ' ' + pageH + '] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ' + contentNum + ' 0 R >>';
    kids.push(pageNum);
  });
  objs[2] = '<< /Type /Pages /Kids [' + kids.map(function(k){ return k + ' 0 R'; }).join(' ') + '] /Count ' + kids.length + ' >>';
  var pdf = '%PDF-1.4\n', offsets = [], maxObj = num - 1, i;
  for (i = 1; i <= maxObj; i++){ offsets[i] = pdf.length; pdf += i + ' 0 obj\n' + objs[i] + '\nendobj\n'; }
  var xrefPos = pdf.length;
  pdf += 'xref\n0 ' + (maxObj + 1) + '\n0000000000 65535 f \n';
  for (i = 1; i <= maxObj; i++) pdf += ('0000000000' + offsets[i]).slice(-10) + ' 00000 n \n';
  pdf += 'trailer\n<< /Size ' + (maxObj + 1) + ' /Root 1 0 R >>\nstartxref\n' + xrefPos + '\n%%EOF';
  var bytes = new Uint8Array(pdf.length);
  for (i = 0; i < pdf.length; i++) bytes[i] = pdf.charCodeAt(i) & 0xff;
  return new Blob([bytes], { type:'application/pdf' });
}
function exportPdf(){
  var a = document.createElement('a'); a.href = URL.createObjectURL(makePdf(buildReportLines()));
  var slug = (S.sim.participant && S.sim.participant.name ? S.sim.participant.name.replace(/[^a-z0-9]+/gi,'-').toLowerCase() + '-' : '');
  a.download = 'incident-report-' + slug + S.sim.seed + '.pdf'; a.click();
}

function lsSet(k,v){ try { window.localStorage.setItem(k,v); } catch(e){} }
function viewAccess(){
  var expiredNote = '';

  if (g){ var exp = parseInt(g,10); if (!isNaN(exp) && daysSinceEpoch(Date.now()) > exp) expiredNote = '<p class="access-expired">Your previous access expired on ' + esc(expiryDateStr(exp)) + '.</p>'; }
  var b =
  '<section class="access-card">' +
    '<p class="eyebrow">Access required</p>' +
    '<p>This exercise is released for a set period. Enter the access code your facilitator gave you. The code stops working once its time is up.</p>' +
    expiredNote +
    '<div class="access-in"><input id="access-code" class="seedin access-field" placeholder="MICE-XXXX-XX" value="' + esc(S.access.code) + '">' +
    '<button class="btn btn-primary" data-act="access-unlock">Unlock</button></div>' +
    (S.access.error ? '<p class="access-err">' + esc(S.access.error) + '</p>' : '') +
    '<p class="access-foot muted small"><button class="linkbtn" data-go="learn">Learn the triage system</button> &nbsp;&middot;&nbsp; <button class="linkbtn" data-go="credits">Credits</button></p>' +
    '<p class="access-foot muted small">Facilitator issuing codes for a course? <button class="linkbtn" data-act="issue-open">Issue a code</button></p>' +
  '</section>' +
  '<p class="disclaimer">Access control is a simple time based gate for course use. It relies on this device clock and is not a security control.</p>';
  return shell('Surge vs. Lifeline', 'A disaster triage decision simulation.', b);
}
